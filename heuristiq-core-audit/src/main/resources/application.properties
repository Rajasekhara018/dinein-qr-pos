spring.application.name=RealBoom-AuditService
logging.file.name=${LOG_FILE:../logs/audit.log}
server.port=${AUDIT_PORT:9106}
# Active profile. Production MUST set SPRING_PROFILES_ACTIVE explicitly (e.g. prod, or prod,postgres for
# PostgreSQL): the dev profile carries local placeholders.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Persistence is database-agnostic, as in Rider_TrainService: the repository port has a MongoDB adapter and a
# PostgreSQL (JPA) adapter. MongoDB is the default; add the "postgres" profile for PostgreSQL. The two
# settings below stay in lockstep: the postgres profile flips both.
railcab.audit.persistence.type=mongo
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
spring.mongodb.uri=${AUDIT_MONGODB_URI:mongodb://localhost:27017/railcab_audit}
spring.mongodb.database=${AUDIT_MONGODB_DATABASE:railcab_audit}
spring.data.mongodb.auto-index-creation=true

# Controllers carry their own /api/v1/audit prefix. Actuator is not a @RestController, so its base path is
# set explicitly to the same external path.
management.endpoints.web.base-path=/api/v1/audit/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
server.forward-headers-strategy=framework
logging.pattern.level=%5p [%X{correlationId:-}]
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
# Batches of up to 500 events are small, but cap the body anyway (the gateway has its own limit).
server.tomcat.max-swallow-size=2MB
spring.servlet.multipart.enabled=false

# Service discovery (Eureka) -- same convention as the other Rider_* services.
spring.cloud.compatibility-verifier.enabled=false
railcab.service.discovery.enabled=${SERVICE_DISCOVERY_ENABLED:true}
eureka.client.enabled=${railcab.service.discovery.enabled}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${eureka-username:${EUREKA_USERNAME}}:${eureka-password:${EUREKA_PASSWORD}}@localhost:9100/eureka/}
eureka.instance.prefer-ip-address=true

# Deploy resilience: a restarted or stopped instance must leave and join the registry within seconds, not minutes
# (the defaults are a 30 s renewal, a 90 s expiry and a 30 s registry fetch). Shared by every service that registers.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.metadata-map.zone=${SERVICE_ZONE:region1}
eureka.client.jersey.enabled=false
spring.cloud.vault.enabled=false

management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Authentication. No defaults on purpose: the service refuses to start without them.
# jwt-secret must equal Rider_UAM's railcab.uam.auth.jwt-secret.
railcab.audit.auth.jwt-secret=${jwt-secret:${JWT_SECRET}}
# Shared service-to-service credential (header X-Rider-Service-Token), same property as the other services.
rider.internal.service-token=${RIDER_INTERNAL_SERVICE_TOKEN}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---- Ingest limits ----
railcab.audit.ingest.max-batch-size=${AUDIT_INGEST_MAX_BATCH:500}
railcab.audit.ingest.screen-view-max-batch-size=${AUDIT_SCREEN_VIEW_MAX_BATCH:50}
# Per-user cap on screen-view events (this instance); excess is dropped and answered with 429.
railcab.audit.ingest.screen-views-per-minute=${AUDIT_SCREEN_VIEWS_PER_MINUTE:60}
# Mask the last IPv4 octet (and the host half of an IPv6 address) before storing.
railcab.audit.ingest.mask-ip=${AUDIT_MASK_IP:true}
# Events claiming to be this far in the future are clamped to "now".
railcab.audit.ingest.max-future-skew-seconds=${AUDIT_MAX_FUTURE_SKEW_SECONDS:300}

# ---- Query ----
railcab.audit.query.max-page-size=${AUDIT_QUERY_MAX_PAGE_SIZE:200}
railcab.audit.query.export-max-rows=${AUDIT_EXPORT_MAX_ROWS:10000}
# Dropdown values (roles, features, screens) are read from this many recent days.
railcab.audit.query.facet-window-days=${AUDIT_FACET_WINDOW_DAYS:30}
railcab.audit.query.facet-max-values=${AUDIT_FACET_MAX_VALUES:500}

# ---- Retention (days) per class; stored on each event as expireAt when it is ingested ----
# CERT-In directions (28 Apr 2022) require logs to be kept in India for at least 180 days: do not set any class below 180 in production.
railcab.audit.retention.access-read-days=${AUDIT_RETENTION_ACCESS_READ_DAYS:180}
railcab.audit.retention.screen-view-days=${AUDIT_RETENTION_SCREEN_VIEW_DAYS:180}
railcab.audit.retention.access-write-days=${AUDIT_RETENTION_ACCESS_WRITE_DAYS:180}
railcab.audit.retention.communication-days=${AUDIT_RETENTION_COMMUNICATION_DAYS:365}
railcab.audit.retention.payment-gateway-days=${AUDIT_RETENTION_PAYMENT_GATEWAY_DAYS:365}
railcab.audit.retention.domain-days=${AUDIT_RETENTION_DOMAIN_DAYS:365}
# Purge job (runs under a SchedulerLock; MongoDB additionally expires through a TTL index on expireAt).
railcab.audit.retention.purge-enabled=${AUDIT_PURGE_ENABLED:true}
railcab.audit.retention.purge-interval-ms=${AUDIT_PURGE_INTERVAL_MS:3600000}

# ---- Stored headers and bodies (kept in audit_event_payloads, same retention as the event) ----
# Credentials are redacted before storage (see PayloadRedactor). Bodies longer than the cap are cut and flagged.
railcab.audit.payload.max-body-bytes=${AUDIT_PAYLOAD_MAX_BODY_BYTES:16384}
railcab.audit.payload.max-headers=${AUDIT_PAYLOAD_MAX_HEADERS:60}
# Bodies are never stored for paths matching these Ant patterns (login, OTP, password, token refresh, cards).
# Override with a comma-separated list; the default is PayloadRedactor.DEFAULT_SKIP_BODY_PATHS.
# railcab.audit.payload.skip-body-paths=/**/identity/auth/**,/**/auth/**
# Rows of a payload export (each row also carries its bodies).
railcab.audit.query.export-payload-max-rows=${AUDIT_EXPORT_PAYLOAD_MAX_ROWS:1000}
