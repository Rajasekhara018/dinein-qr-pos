# Development only: local placeholders so the service starts without any env. NEVER used outside dev/local.
logging.level.root=INFO
logging.level.com.railcab.audit=DEBUG
spring.jpa.show-sql=false
railcab.service.discovery.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9100/eureka/}
management.tracing.sampling.probability=1.0

railcab.audit.auth.jwt-secret=${JWT_SECRET:dev-only-audit-jwt-secret-change-me-32bytes!}
rider.internal.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:local-rider-service-token}
# The gateway forwards the browser's Origin header on every write (PUT/POST/PATCH/DELETE), so this service's own
# CORS check must accept the real site origins too, not only localhost, or writes fail with 403 "Invalid CORS request".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://rider.thebridaldesire.com,https://driver.thebridaldesire.com,https://customer.thebridaldesire.com,http://localhost:4200,http://localhost:4201}
