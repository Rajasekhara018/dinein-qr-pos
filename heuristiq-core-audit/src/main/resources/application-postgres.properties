# PostgreSQL persistence (the JPA adapters of every repository port). Combine with an environment
# profile, e.g. SPRING_PROFILES_ACTIVE=prod,postgres.
railcab.audit.persistence.type=postgres

# Re-enable JPA / DataSource / Flyway (excluded by default for MongoDB mode in application.properties)
# and exclude MongoDB instead -- every Mongo-backed bean is conditional on persistence.type=mongo.
spring.autoconfigure.exclude=  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,  org.springframework.boot.mongodb.autoconfigure.MongoReactiveAutoConfiguration,  org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration,  org.springframework.boot.mongodb.autoconfigure.health.MongoReactiveHealthContributorAutoConfiguration,  org.springframework.boot.mongodb.autoconfigure.metrics.MongoMetricsAutoConfiguration,  org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,  org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveAutoConfiguration,  org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration,  org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveRepositoriesAutoConfiguration

spring.datasource.url=${AUDIT_POSTGRES_URL:jdbc:postgresql://localhost:5432/railcab.audit}
spring.datasource.username=${AUDIT_POSTGRES_USERNAME:railcab.audit}
spring.datasource.password=${AUDIT_POSTGRES_PASSWORD:}

spring.datasource.hikari.pool-name=audit-postgres-pool
spring.datasource.hikari.maximum-pool-size=${AUDIT_POSTGRES_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${AUDIT_POSTGRES_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${AUDIT_POSTGRES_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${AUDIT_POSTGRES_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${AUDIT_POSTGRES_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.leak-detection-threshold=${AUDIT_POSTGRES_LEAK_DETECTION_MS:30000}

# Schema is Flyway-managed (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
