# Production. Every secret and URL setting comes from the environment (or Vault); the base
# application.properties deliberately has no defaults for them, so a missing value fails startup.
logging.level.root=WARN
logging.level.com.heuristiq.audit=INFO
spring.jpa.show-sql=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING:0.05}
