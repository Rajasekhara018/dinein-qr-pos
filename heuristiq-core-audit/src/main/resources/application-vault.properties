# Activate with SPRING_PROFILES_ACTIVE=<env>,postgres,vault to read secrets from HashiCorp Vault
# (secret/railcab/audit): jwt-secret, internal service token, DB password.
# Omit this profile to use plain environment variables instead.
# The connection properties must appear BEFORE spring.config.import (it is resolved while parsing).
spring.cloud.vault.enabled=true
spring.cloud.vault.host=${VAULT_HOST:localhost}
spring.cloud.vault.port=${VAULT_PORT:8200}
spring.cloud.vault.scheme=${VAULT_SCHEME:http}
spring.cloud.vault.token=${VAULT_TOKEN:}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.backend-version=2
spring.config.import=optional:vault://secret/railcab/audit
