# JPA/SQL mode tests: embedded PostgreSQL is wired by the test itself; no Eureka, Vault or tracing exporters.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.cloud.discovery.enabled=false
spring.cloud.vault.enabled=false
eureka.client.enabled=false
railcab.audit.persistence.type=postgres
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.enabled=false
management.tracing.enabled=false
railcab.audit.auth.jwt-secret=test-secret-test-secret-test-secret-123456
rider.internal.service-token=test-service-token
app.cors.allowed-origins=*
spring.autoconfigure.exclude=de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.MongoReactiveAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.health.MongoReactiveHealthContributorAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.metrics.MongoMetricsAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveRepositoriesAutoConfiguration
