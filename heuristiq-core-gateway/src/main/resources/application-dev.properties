# Activate with: --spring.profiles.active=dev
# Points at the shared remote dev Mongo/Redis instances instead of localhost, and disables Redis
# autoconfiguration so the gateway can still start if that instance is unreachable -- rate
# limiting is automatically skipped as a result (RateLimiterConfig conditional).
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/railcab_uam}
spring.data.mongodb.bookings-uri=${BOOKINGS_MONGO_URI:mongodb://localhost:27017/railcab_bookings}
spring.data.mongodb.uam-uri=${UAM_MONGO_URI:mongodb://localhost:27017/railcab_uam}
spring.data.redis.host=${REDIS_HOST:redis}

# Full list repeated here (not just the Redis addition) -- this profile's spring.autoconfigure.exclude
# replaces application.properties's list rather than merging with it, so the JPA/DataSource
# excludes must be repeated wherever Redis is also excluded.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

railcab.gateway.rate-limit.enabled=false

# Redis autoconfigure is excluded in dev -- prevent health DOWN
management.health.redis.enabled=false

logging.level.root=DEBUG
logging.level.com.heuristiq.gateway=DEBUG
