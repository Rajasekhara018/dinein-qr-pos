# Activate with: --spring.profiles.active=prod
# Tightens logging, enforces RBAC/rate-limiting, and gates the IRCTC simulator.
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/railcab_uam}
spring.data.mongodb.bookings-uri=${BOOKINGS_MONGO_URI:mongodb://localhost:27017/railcab_bookings}
spring.data.mongodb.uam-uri=${UAM_MONGO_URI:mongodb://localhost:27017/railcab_uam}
spring.data.redis.host=${REDIS_HOST:redis}

railcab.gateway.rbac.enabled=true
railcab.gateway.rate-limit.enabled=true

# Gate the IRCTC simulator in production -- override to empty so the filter never registers it as
# a public path. The simulator should not be reachable via the gateway in production deployments.
pathmatchers.irctc-simulator=

logging.level.root=WARN
logging.level.com.heuristiq.gateway=INFO
logging.level.org.springframework.cloud.gateway=WARN

# ── Service registry ──────────────────────────────────────────────────────────────────────────────
# The registry client follows the same switch as every other profile (GATEWAY_DISCOVERY_ENABLED, default true; see
# application.properties), so a deployment with a service registry (the Docker deployment) routes through it: lb://REALBOOM-*.
# A deployment without one (Kubernetes, where Services and the nginx Ingress do the discovery) sets GATEWAY_DISCOVERY_ENABLED=false:
# the registry client is then off and the static instance list below answers lb:// instead (ops/k8s/deployment.yaml sets it).
# Nothing here forces the registry off any more: a "prod" profile used to do that and left Docker deployments with "No servers
# available for service: REALBOOM-UAM".

# RouteConfig.java's route URIs are hardcoded `lb://<SERVICE-ID>` constants (unchanged here on
# purpose -- no Java changes needed). Spring Cloud's Simple Discovery Client (part of
# spring-cloud-commons, already on the classpath via spring-cloud-starter-loadbalancer -- no new
# dependency) lets `lb://` keep resolving via this static, properties-driven instance list instead
# of Eureka's dynamic registry. Every SERVICE-ID below matches spring.application.name (case
# preserved, since Simple Discovery Client's map keys are NOT relaxed-bound to lowercase). Hosts
# assume short in-cluster DNS names resolving within the same namespace as this gateway -- use
# <service-name>.<namespace>.svc.cluster.local instead if they're split across namespaces.
#
# NOTE: RAILCAB-BOOKINGSAPI and RAILCAB-UAM's spring.application.name starts with a
# digit ("2026-"), which is not a legal Kubernetes object name (must start with a letter) -- their
# Service names below (railcab-bookings-api, railcab-uam) use this platform's railcab-<service>
# convention instead. Every one of these eight is now backed by a real ops/k8s/deployment.yaml in
# its own service's repo (ports/paths verified against each service's own application*.properties):
# DMS, BookingsAPI, UAM, AdminAPI, PaymentAPI, IRCTC, NMS, SearchAPI.
spring.cloud.discovery.client.simple.instances.RAILCAB-ADMIN-API[0].uri=http://railcab-admin-api:9000
spring.cloud.discovery.client.simple.instances.RAILCAB-BOOKINGSAPI[0].uri=http://railcab-bookings-api:9001
spring.cloud.discovery.client.simple.instances.RAILCAB-IRCTC-API-INTEGRATION[0].uri=http://railcab-irctc-api-integration:9002
spring.cloud.discovery.client.simple.instances.RAILCAB-UAM[0].uri=http://railcab-uam:9103
spring.cloud.discovery.client.simple.instances.RAILCAB-DMS[0].uri=http://railcab-dms:9006
spring.cloud.discovery.client.simple.instances.RAILCAB-PAYMENT-API[0].uri=http://railcab-payment-api:9006
spring.cloud.discovery.client.simple.instances.RAILCAB-NMS[0].uri=http://railcab-nms:9005
spring.cloud.discovery.client.simple.instances.RAILCAB-SEARCH-API[0].uri=http://railcab-search-api:9116
# Rider_WalletService (shared credits ledger). Used when RIDER_SERVICES_DISCOVERY_ENABLED=true; otherwise the
# route uses railcab.gateway.static.rider-wallet-api-url (RIDER_WALLET_SERVICE_URL) -- see RouteConfig#riderUri.
spring.cloud.discovery.client.simple.instances.REALBOOM-WALLETSERVICE[0].uri=http://rider-walletservice:9121
# Rider_AccountingService (general ledger). Used when RIDER_SERVICES_DISCOVERY_ENABLED=true; otherwise the route uses
# railcab.gateway.static.rider-accounting-api-url (RIDER_ACCOUNTING_SERVICE_URL) -- see RouteConfig#riderUri.
spring.cloud.discovery.client.simple.instances.REALBOOM-ACCOUNTINGSERVICE[0].uri=http://rider-accountingservice:9126
# Rider_FranchiseService (franchises, plans, agents). Used when RIDER_SERVICES_DISCOVERY_ENABLED=true; otherwise the
# route uses railcab.gateway.static.rider-franchise-api-url (RIDER_FRANCHISE_SERVICE_URL) -- see RouteConfig#riderUri.
spring.cloud.discovery.client.simple.instances.REALBOOM-FRANCHISESERVICE[0].uri=http://rider-franchiseservice:9124
