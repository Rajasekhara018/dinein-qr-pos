# Renamed from railcab-api-gateway: this is bestride-rider-app's own copy, extended with routes
# to the 5 rider microservices (see RouteConfig's "Rider microservices" section) alongside the
# original RailCab platform routes it was copied with.
spring.application.name=RealBoom-API-Gateway
# Written to a shared repo-root logs/ directory so Promtail (docker-compose.logging.yml) can
# tail it and ship every line to Loki -- centralized logging.
logging.file.name=${LOG_FILE:../logs/api-gateway.log}
# Applies to the default @Async/@Scheduled executor (currently unused, @EnableAsync-ready) and
# Tomcat, neither of which this gateway relies on for its core request path -- that's Netty's
# non-blocking event loop. The actual "use virtual threads" lever for this reactive app is the
# blockingOpsScheduler bean (see VirtualThreadSchedulerConfig), used by
# ReactiveJwtAuthenticationFilter/PrivilegeBasedAccessFilter instead of Schedulers.boundedElastic().
spring.threads.virtual.enabled=true

# Persistence backend for RolePrivilegeRepository: mongo (default) or mysql. To switch, activate
# the "mysql" Spring profile (SPRING_PROFILES_ACTIVE=mysql,...) -- see application-mysql.properties.
# Do not set railcab.gateway.persistence.type directly here; it must stay in lockstep with the
# autoconfigure.exclude below, which the mysql profile flips atomically.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/railcab_uam}
spring.data.mongodb.bookings-uri=${BOOKINGS_MONGO_URI:mongodb://localhost:27017/railcab_bookings}
spring.data.mongodb.uam-uri=${UAM_MONGO_URI:mongodb://localhost:27017/railcab_uam}
spring.data.mongodb.auto-index-creation=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# HTTP client the gateway uses to call every downstream service. Spring Cloud Gateway 5 (Spring Cloud 2025.1) binds
# these only under spring.cloud.gateway.server.webflux.httpclient.*: the older spring.cloud.gateway.httpclient.* names
# are ignored without a warning, which is how these settings went unused before. HttpClientPropertiesBindingTest fails
# if they stop binding. connect-timeout is in ms -- fail fast on connection refused. response-timeout keeps zombie
# connections bounded; the per-route circuit-breaker time limit below (10 s) normally ends a slow call first.
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s
# Connection pool: close a pooled connection after 15 s idle (below the downstream servers' keep-alive timeouts, so the
# gateway never reuses a connection the server has already closed) and after 5 minutes in any case (so connections move
# to new instances after a deploy or scale-out). Idle connections are also swept in the background every 30 s.
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=15s
spring.cloud.gateway.server.webflux.httpclient.pool.max-life-time=5m
spring.cloud.gateway.server.webflux.httpclient.pool.eviction-interval=30s

server.port=${GATEWAY_PORT:9101}
server.address=0.0.0.0

# ─── Service discovery (Eureka) ───────────────────────────────────────────────
# Downstream routes in RouteConfig resolve via lb://<service-id> against this registry when
# enabled -- see realboom-service-registry. Defaults to ON: RouteConfig routes every service via
# lb://<service-id> against a running ServiceRegistry, and the Eureka client registers this
# gateway with it at startup (registration failure is non-fatal). Set GATEWAY_DISCOVERY_ENABLED=false
# (or railcab.gateway.discovery.enabled=false) to fall back to static host:port routing
# (railcab.gateway.static.*-url) with no ServiceRegistry dependency at all.
railcab.gateway.discovery.enabled=${GATEWAY_DISCOVERY_ENABLED:true}
eureka.client.enabled=${railcab.gateway.discovery.enabled}
# Rider microservices: RIDER_*_SERVICE_URL when set, otherwise Eureka (they all register) while
# discovery is enabled -- see RouteConfig#riderUri. This flag forces Eureka for all of them.
railcab.gateway.rider-services.discovery-enabled=${RIDER_SERVICES_DISCOVERY_ENABLED:false}
railcab.gateway.static.rider-pricing-api-url=${RIDER_PRICING_SERVICE_URL:}
railcab.gateway.static.rider-location-api-url=${RIDER_LOCATION_SERVICE_URL:}
railcab.gateway.static.rider-dispatch-api-url=${RIDER_DISPATCH_SERVICE_URL:}
railcab.gateway.static.rider-ride-api-url=${RIDER_RIDE_SERVICE_URL:}
railcab.gateway.static.rider-payment-api-url=${RIDER_PAYMENT_SERVICE_URL:}
railcab.gateway.static.rider-customer-api-url=${RIDER_CUSTOMER_SERVICE_URL:}
railcab.gateway.static.rider-workflow-api-url=${RIDER_WORKFLOW_SERVICE_URL:}
railcab.gateway.static.rider-onboarding-api-url=${RIDER_ONBOARDING_SERVICE_URL:}
# Matrimony API (matrimonial-api): not on the service registry, so its base URL (host:port, no path) is set here.
railcab.gateway.static.matrimony-api-url=${MATRIMONY_API_URL:}
railcab.gateway.static.rider-train-api-url=${RIDER_TRAIN_SERVICE_URL:}
railcab.gateway.static.rider-commerce-api-url=${RIDER_COMMERCE_SERVICE_URL:}
railcab.gateway.static.rider-config-api-url=${RIDER_CONFIG_SERVICE_URL:}
railcab.gateway.static.rider-audit-api-url=${RIDER_AUDIT_SERVICE_URL:}
railcab.gateway.static.rider-wallet-api-url=${RIDER_WALLET_SERVICE_URL:}
railcab.gateway.static.rider-accounting-api-url=${RIDER_ACCOUNTING_SERVICE_URL:}
railcab.gateway.static.rider-franchise-api-url=${RIDER_FRANCHISE_SERVICE_URL:}
# food-delivery-platform/backend (the whole /api/v1/food/** API); not on the service registry, so a URL (default http://localhost:9123).
railcab.gateway.static.food-api-url=${FOOD_SERVICE_URL:${FOOD_API_URL:}}
railcab.gateway.static.rider-reports-api-url=${RIDER_REPORTS_SERVICE_URL:}
railcab.gateway.static.rider-driver-earnings-api-url=${RIDER_DRIVER_EARNINGS_SERVICE_URL:}
# Rider_BookingsAPI never registers with Eureka, so it is always reached through this URL.
railcab.gateway.static.bookings-api-url=${BOOKINGS_SERVICE_URL:http://localhost:9006}
# Rider_ServiceRegistry (Eureka) -- only used for its /javadoc pages (route "registry-javadoc").
railcab.gateway.static.registry-url=${REGISTRY_SERVICE_URL:http://localhost:9100}
# EUREKA_URL, if set, overrides this entirely (include your own credentials in it). Otherwise
# the default embeds the shared Eureka Basic-Auth credentials (see EurekaSecurityConfig in
# 2026_RailCab_ServiceRegistry) via the same Vault-priority chain used elsewhere in this file.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${eureka-username:${EUREKA_USERNAME}}:${eureka-password:${EUREKA_PASSWORD}}@localhost:9100/eureka/}
eureka.instance.prefer-ip-address=true

# Deploy resilience: a restarted or stopped instance must leave and join the registry within seconds, not minutes
# (the defaults are a 30 s renewal, a 90 s expiry and a 30 s registry fetch). Shared by every service that registers.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5

# Finish in-flight requests, and deregister, before stopping on a deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# The gateway's load balancer re-reads the registry every 5 s (default 35 s), so a replaced instance drops out quickly.
spring.cloud.loadbalancer.cache.ttl=5s
eureka.instance.metadata-map.zone=${SERVICE_ZONE:region1}
# jersey-client is on the classpath for KeycloakAuthProvider (see build.gradle), which makes
# Spring Cloud Netflix's OnJerseyClientPresentAndEnabledCondition true and commits Eureka to a
# Jersey-based TransportClientFactories -- but eureka-client-jersey3 (the artifact that actually
# implements it) isn't a dependency, so no bean is ever produced and registration fails with
# "No qualifying bean of type TransportClientFactories". Force the WebClient-based transport
# instead, which fits this reactive gateway anyway.
eureka.client.jersey.enabled=false

# ─── Gateway config ──────────────────────────────────────────────────────────
# Persistence backend for RolePrivilegeRepository: mongo (default) or mysql -- must stay in
# lockstep with the spring.autoconfigure.exclude above.
railcab.gateway.persistence.type=mongo
# Vault-contributed properties (see spring.cloud.vault.* below) take priority; fall back to the
# plain env var so this still works in an environment where Vault isn't configured yet.
railcab.gateway.auth.jwt-secret=${jwt-secret:${JWT_SECRET}}
railcab.gateway.auth.customer-jwt-secret=${customer-jwt-secret:${CUSTOMER_JWT_SECRET:${JWT_SECRET}}}
# Selects the active IAuthProvider bean (AuthProviderRouter) -- hmac (default), keycloak, or oidc.
# Config-driven, same shape as railcab.uam.identity-provider.type -- no Spring profile needed.
railcab.gateway.identity-provider.type=${AUTH_PROVIDER_TYPE:hmac}
# Generic OIDC provider (used when identity-provider.type=oidc) -- works against any RFC 7662
# introspection endpoint (Auth0, Okta, Azure AD, ...). No vendor-specific class needed; unlike
# Keycloak's fixed realm_access.roles path, the role claim and role names are configurable.
railcab.gateway.oidc.introspection-uri=${OIDC_INTROSPECTION_URI:}
railcab.gateway.oidc.client-id=${OIDC_CLIENT_ID:}
railcab.gateway.oidc.client-secret=${OIDC_CLIENT_SECRET:}
railcab.gateway.oidc.subject-claim=${OIDC_SUBJECT_CLAIM:sub}
railcab.gateway.oidc.roles-claim=${OIDC_ROLES_CLAIM:roles}
railcab.gateway.oidc.introspection-cache-ttl-seconds=${OIDC_INTROSPECTION_CACHE_TTL:15}
railcab.gateway.oidc.role-map.super_admin=SUPER_ADMIN
railcab.gateway.oidc.role-map.manager=MANAGER
railcab.gateway.oidc.role-map.accountant=ACCOUNTANT
railcab.gateway.oidc.role-map.support=SUPPORT
railcab.gateway.oidc.role-map.auditor=AUDITOR
railcab.gateway.internal.secret-keys=${INTERNAL_SECRET_KEYS:railcab-bookings-internal-key}
# Injected as X-Gateway-Token on every forwarded request. Downstream services check this header to
# confirm the request came through the gateway -- no duplicate JWT validation needed.
railcab.gateway.internal.gateway-forward-key=${gateway-forward-key:${GATEWAY_FORWARD_KEY}}

# Secrets management (see docs/design/Platform/SecretsManagement.md). Vault connection + config-
# import now live in application-vault.properties, an opt-in profile -- activate with
# --spring.profiles.active=<env>,vault to source secrets from Vault; omit it to use plain env vars
# (e.g. Kubernetes Secrets via secretKeyRef) instead.
# spring.cloud.vault.enabled gates ALL of Spring Cloud Vault's autoconfiguration (config-import,
# health indicator, everything) and defaults to true when absent -- without setting it false here,
# VaultAutoConfiguration still tries to build a VaultTemplate with no host/token configured at all
# and fails hard at startup whenever the vault profile is NOT active. application-vault.properties
# flips this back to true when that profile IS active.
spring.cloud.vault.enabled=false

# mTLS proof-of-concept: Gateway<->PaymentAPI (see docs/design/Platform/SecretsManagement.md and
# RouteConfig.paymentApiUri()). Disabled by default -- when railcab.gateway.mtls.enabled=false
# (the default), these SSL settings are configured but never exercised, since every route's target
# stays http://. Global (not per-route) because Spring Cloud Gateway shares one Netty HttpClient
# across all routes; harmless for the other, still-plain-HTTP routes since a client cert is only
# ever presented during a TLS handshake, which only happens for an https:// target.
# Under their old names these keys were never read. Now that they bind, the gateway loads the key store and CA
# certificate when it builds its HTTP client, at startup, and fails to start if a configured file is missing. So the
# paths are empty unless set: give MTLS_KEYSTORE_PATH (a file path or a file:/classpath: URL) and MTLS_CA_CERT_PATH
# wherever MTLS_ENABLED=true. The old default paths (../mtls-certs/...) are not assumed any more.
railcab.gateway.mtls.enabled=${MTLS_ENABLED:false}
spring.cloud.gateway.server.webflux.httpclient.ssl.key-store=${MTLS_KEYSTORE_PATH:}
spring.cloud.gateway.server.webflux.httpclient.ssl.key-store-password=${keystore-password:${MTLS_KEYSTORE_PASSWORD:}}
spring.cloud.gateway.server.webflux.httpclient.ssl.key-store-type=PKCS12
spring.cloud.gateway.server.webflux.httpclient.ssl.trusted-x509-certificates=${MTLS_CA_CERT_PATH:}

railcab.gateway.internal.nms-api-key=${internal-api-key:${NMS_INTERNAL_API_KEY:}}
railcab.gateway.cors.allowed-origins=${CORS_ORIGINS:https://realboom.thebridaldesire.com,https://ops.pasupukumkuma.net,http://localhost:4200,http://localhost:4300,http://localhost:5173,http://localhost:3000,http://35.154.15.238:92,https://checkout.razorpay.com,https://api.razorpay.com,https://payu.in,https://*.payu.in,https://*.toucanpay.in,https://*.testtoucanpay.in}
# /api/payment/callback/** uses this list instead of allowed-origins above (see
# GatewaySecurityConfig.corsConfigurationSource) -- gateway redirect chains (Razorpay/PayU)
# commonly arrive with a literal "null" Origin header, which is too permissive to allow globally.
railcab.gateway.cors.payment-callback-allowed-origins=${PAYMENT_CALLBACK_CORS_ORIGINS:null,https://checkout.razorpay.com,https://api.razorpay.com,https://payu.in,https://*.payu.in,https://*.toucanpay.in,https://*.testtoucanpay.in}
railcab.gateway.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
railcab.gateway.rate-limit.replenish-rate=50
railcab.gateway.rate-limit.burst-capacity=100
railcab.gateway.rate-limit.auth-replenish-rate=5
railcab.gateway.rate-limit.auth-burst-capacity=10
# Password login only (route uam-login-api): per client address, and one shared limit for all callers. The shared limit should stay at
# or a little above what UAM can hash per second (about 4 logins/s per UAM CPU at bcrypt cost 11): when it is exceeded the gateway answers 429
# instead of UAM answering 503 after its 2 s bcrypt queue timeout. Raise it together with UAM's CPU limit or instance count.
railcab.gateway.rate-limit.login-replenish-rate=${LOGIN_RATE_PER_IP:2}
railcab.gateway.rate-limit.login-burst-capacity=${LOGIN_BURST_PER_IP:5}
railcab.gateway.rate-limit.login-global-replenish-rate=${LOGIN_RATE_GLOBAL:10}
railcab.gateway.rate-limit.login-global-burst-capacity=${LOGIN_BURST_GLOBAL:20}
# Public live-trip tracking (GET /api/v1/ride/public/track, route rider-ride-public-track): no sign-in, so one bucket per client
# address. The tracking page polls every 5 s; 1 req/s with a burst of 5 leaves room for a few open tabs behind one address.
railcab.gateway.rate-limit.public-track-replenish-rate=${PUBLIC_TRACK_RATE_PER_IP:1}
railcab.gateway.rate-limit.public-track-burst-capacity=${PUBLIC_TRACK_BURST_PER_IP:5}
# Token refresh (POST /api/v1/uam/identity/auth/refresh, route uam-refresh-api): its own bucket per client address, more generous
# than the auth surface, because many phones share one carrier NAT address and a refused refresh logs the user out.
railcab.gateway.rate-limit.refresh-replenish-rate=${REFRESH_RATE_PER_IP:30}
railcab.gateway.rate-limit.refresh-burst-capacity=${REFRESH_BURST_PER_IP:60}
# Public sign-up (POST /api/v1/uam/identity/auth/register): an hourly budget per client address on top of the auth limit. Sign-up
# answers 409 for an existing phone or email, so this is what stops scripted checks of who is registered. Kept above a handful
# because many phones share one carrier NAT address.
railcab.gateway.rate-limit.register-per-hour=${REGISTER_PER_HOUR_PER_IP:20}
railcab.gateway.rate-limit.register-burst=${REGISTER_BURST_PER_IP:10}
# Proxies in front of the gateway that add to X-Forwarded-For (1 = nginx on the host, 2 = load balancer + nginx, 0 = ignore the header).
railcab.gateway.rate-limit.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:1}
railcab.gateway.request.max-body-size-bytes=${MAX_BODY_SIZE_BYTES:10485760}
railcab.gateway.cache.user-status-ttl-seconds=${USER_STATUS_CACHE_TTL:60}
# Entries are tiny (a user id and a flag, roughly 150-250 bytes each with cache overhead), but a gateway instance
# sees every user that is active within the TTL: size it to the active users per TTL window (see the cache.*
# meters, cache=gateway.user-status, for the hit ratio and evictions), and keep the memory in the container budget.
railcab.gateway.cache.user-status-max-size=${USER_STATUS_CACHE_MAX_SIZE:10000}
railcab.gateway.cache.role-privilege-ttl-seconds=${ROLE_PRIVILEGE_CACHE_TTL:30}
railcab.gateway.cache.role-privilege-max-size=1000
railcab.gateway.rbac.enabled=${RBAC_ENABLED:true}

# ─── Keycloak (used when railcab.gateway.identity-provider.type=keycloak) ────
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:railcab}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:railcab-gateway}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}

# ─── Public path matchers ─────────────────────────────────────────────────────
# admin-vendor-public: only vendor self-registration is public (AdminAPI's PublicVendorController, POST /register). It must stay
# exactly that path: "/api/v1/admin/vendors/**" made the whole vendor admin API public, so the gateway dropped the signed-in
# user's identity and AdminAPI answered 401 to every staff call (list, approve, reject, suspend) and the privilege check never ran.
pathmatchers.admin-vendor-public=/api/v1/admin/vendors/register
pathmatchers.bookings-health=/api/bookings/actuator/**
pathmatchers.irctc-health=/api/irctc/health/**
pathmatchers.irctc-simulator=/api/irctc/simulator/**
pathmatchers.uam-identity-auth=/api/v1/uam/identity/auth/**
# Versioned shapes RouteConfig's uam-auth-api route also accepts -- version before "uam"
# (/api/v1/uam/identity/auth/**) and version after it (/api/uam/v1/identity/auth/**). Without
# these, login/OTP calls on a versioned path hit the JWT filter and 401 "Access token missing".
# Ride-payment webhook (PaymentController's /payments/webhook) and wallet top-up webhook
# (WalletController's /wallet/topup/webhook) -- both are Razorpay-initiated callbacks with no
# user JWT, authenticated via HMAC signature verification inside PaymentService instead.
# Listed as two exact paths rather than /api/rider/payment/**/webhook: Spring Security 7's
# PathPatternParser rejects "**" anywhere but the start or end of a pattern (fails startup).
pathmatchers.rider-payment-webhook=/api/v1/payment/payments/webhook
pathmatchers.rider-wallet-webhook=/api/v1/payment/wallet/topup/webhook
pathmatchers.rider-ride-websocket=/api/v1/ride/ws
# Matrimony STOMP socket (the matrimony API authenticates the STOMP CONNECT frame itself).
pathmatchers.matrimony-websocket=/api/v1/matrimony/ws-raw
# Matrimony sign-up switches read by the sign-in page before login (GET-only endpoint on matrimonial-api).
pathmatchers.matrimony-self-registration-config=/api/v1/matrimony/config/self-registration
# Reference lists (religion, country, state, city, ...) the public sign-up form reads before login (GET-only endpoint on matrimonial-api).
pathmatchers.matrimony-public-config-options=/api/v1/matrimony/config/public-options
# Food paths with no sign-in at the gateway: the socket and webhook are checked by the food API, photos are public.
pathmatchers.food-websocket=/api/v1/food/ws/orders
pathmatchers.food-payment-webhook=/api/v1/food/webhooks/razorpay
pathmatchers.food-media=/api/v1/food/media/images/**
pathmatchers.food-uploads=/api/v1/food/uploads/**
# Food catalogue, open to guests. The food API only serves GET here without sign-in.
pathmatchers.food-home=/api/v1/food/home
pathmatchers.food-categories=/api/v1/food/categories/**
pathmatchers.food-restaurants=/api/v1/food/restaurants/**
pathmatchers.food-items=/api/v1/food/foods/**
pathmatchers.food-search=/api/v1/food/search/**
pathmatchers.food-serviceability=/api/v1/food/serviceability
pathmatchers.nms-in-app-websocket=/api/v1/nms/in-app/ws/**
# RideService ride-call signaling socket: the upgrade carries no Authorization header; RideService
# validates the ?token= itself.
pathmatchers.rider-ride-signaling-websocket=/api/v1/ride/ws-signal/**
# Onboarding runtime leaves are public -- callers self-report identity via userId in the request
# body instead of a JWT (OnboardingRuntimeController), since a customer/driver may not have a
# session yet when they start onboarding. Scoped to exactly these two leaves under the
# rider-onboarding-api route's client-facing prefix (/api/v1/onboarding/{type}/...) --
# NOT a blanket /api/v1/onboarding/**, so the admin and internal sub-paths of that same route
# stay behind their own downstream JWT filters.
pathmatchers.rider-onboarding-active-schema-public=/api/v1/onboarding/*/active-schema
pathmatchers.rider-onboarding-submissions-public=/api/v1/onboarding/*/submissions/**
# Driver sign-up: the active franchises (id, code, name, city) an applicant without a login may join, for an organization
# named by its public self-signup code (Onboarding validates it through UAM). GET ONLY and the exact path (no /**).
pathmatchers.rider-onboarding-franchise-options-public=/api/v1/onboarding/*/franchise-options
# Driver sign-up: search of the places (franchise locations master) an applicant without a login can choose before listing
# that place's franchises. GET ONLY and the exact path (no /**).
pathmatchers.rider-onboarding-franchise-places-public=/api/v1/onboarding/*/franchise-places
# Train: guest search (GET-only endpoints on the service) and the IRCTC web view / return callback,
# which cannot carry a bearer token (protected by a per-booking HMAC link inside the service).
# Client-facing form: /api/v1/train/<path>.
pathmatchers.rider-train-search-public=/api/v1/train/search
pathmatchers.rider-train-public=/api/v1/train/public
# Browsing a Best Purchase shop before sign-in (the commerce service answers GET only there).
pathmatchers.rider-commerce-public=/api/v1/commerce/public
# Config: banners, FAQs and the app-version check are read by the apps before login (GET-only endpoints
# on the service). The admin settings and the /internal paths stay behind the gateway token check.
pathmatchers.rider-config-public=/api/v1/config/public
# Ride: public live-trip tracking. GET ONLY (see PathMatchersConfig#publicGetOnlyPaths) and the exact path only (no /**):
# the share token comes in the X-Share-Token header and RideService checks it; any other method still needs a JWT.
pathmatchers.rider-ride-public-track=/api/v1/ride/public/track
# NMS delivery-receipt callbacks from SMS/WhatsApp/email providers: they carry no user JWT, so the gateway lets
# them through and each NMS endpoint verifies its own shared secret or provider signature.
pathmatchers.nms-callbacks=/api/v1/nms/callbacks/**
pathmatchers.actuator=/actuator

# ─── MongoDB connection pool ──────────────────────────────────────────────────
mongodb.pool.min-size=5
mongodb.pool.max-size=50
mongodb.pool.max-wait-time-ms=3000
mongodb.pool.max-connection-idle-time-ms=60000
mongodb.pool.max-connection-life-time-ms=600000
mongodb.socket.connect-timeout-ms=3000
mongodb.socket.read-timeout-ms=30000
mongodb.cluster.server-selection-timeout-ms=5000

# ─── Circuit breaker (Resilience4j) ──────────────────────────────────────────
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.admin-cb.base-config=default
resilience4j.circuitbreaker.instances.bookings-cb.base-config=default
resilience4j.circuitbreaker.instances.irctc-cb.base-config=default
resilience4j.circuitbreaker.instances.uam-cb.base-config=default
resilience4j.circuitbreaker.instances.dms-cb.base-config=default
resilience4j.circuitbreaker.instances.nms-cb.base-config=default
resilience4j.circuitbreaker.instances.pay-cb.base-config=default
resilience4j.circuitbreaker.instances.search-cb.base-config=default
resilience4j.circuitbreaker.instances.rider-pricing-cb.base-config=default
resilience4j.circuitbreaker.instances.rider-location-cb.base-config=default
