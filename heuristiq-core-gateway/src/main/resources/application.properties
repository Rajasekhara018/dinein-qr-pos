# ─── Response-envelope normalization (ResponseEnvelopeNormalizationFilter) ─────
# OFF by default — neither Flutter app routes through this gateway yet (both call each service
# directly, see their own app_config.dart), so enabling this today wouldn't affect anything.
# Flip to true (no code change) to rewrite every backend's JSON response into one canonical
# {success, message, data, errorCode} shape once mobile traffic is actually routed through here.
railcab.gateway.response-normalization.enabled=${GATEWAY_RESPONSE_NORMALIZATION_ENABLED:false}

# ─── Logging (default / dev) ───────────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.heuristiq.gateway=DEBUG

# ─── Access audit (AuditEventPublisher -> Rider_AuditService) ─────────────────
# Every routed request becomes an ACCESS event on a bounded in-memory queue (oldest dropped when full) that a
# background batcher posts to the audit service's internal endpoint with the shared service token. Never blocks
# or fails a request. Headers and bodies are redacted here and again by the audit service.
gateway.audit.enabled=${GATEWAY_AUDIT_ENABLED:true}
# Empty = discover REALBOOM-AUDITSERVICE through Eureka (localhost:9106 when discovery is off).
gateway.audit.base-url=${AUDIT_SERVICE_URL:}
gateway.audit.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}
gateway.audit.queue-capacity=${GATEWAY_AUDIT_QUEUE_CAPACITY:5000}
gateway.audit.max-queue-bytes=${GATEWAY_AUDIT_MAX_QUEUE_BYTES:67108864}
gateway.audit.batch-size=${GATEWAY_AUDIT_BATCH_SIZE:100}
gateway.audit.flush-interval-ms=${GATEWAY_AUDIT_FLUSH_INTERVAL_MS:2000}
gateway.audit.timeout-ms=${GATEWAY_AUDIT_TIMEOUT_MS:3000}
gateway.audit.warn-interval-ms=${GATEWAY_AUDIT_WARN_INTERVAL_MS:30000}
gateway.audit.trust-forwarded-for=${GATEWAY_AUDIT_TRUST_FORWARDED_FOR:true}
# Query strings are not stored (path only) unless this is on; sensitive parameter values are replaced either way.
gateway.audit.include-query=${GATEWAY_AUDIT_INCLUDE_QUERY:false}
gateway.audit.capture-headers=${GATEWAY_AUDIT_CAPTURE_HEADERS:true}
gateway.audit.capture-bodies=${GATEWAY_AUDIT_CAPTURE_BODIES:true}
gateway.audit.max-body-bytes=${GATEWAY_AUDIT_MAX_BODY_BYTES:16384}
# Comma-separated Ant patterns on the client path. Defaults: skip-body-paths = AuditPayloadRedactor.DEFAULT_SKIP_BODY_PATHS
# (login, OTP, password, token, card paths); capture-exclude-paths is empty (nothing excluded).
# gateway.audit.capture-exclude-paths=/api/rider/location/**
# gateway.audit.skip-body-paths=/**/identity/auth/**,/**/auth/**
