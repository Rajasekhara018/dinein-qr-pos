# ─── Actuator ─────────────────────────────────────────────────────────────────
# Only health/info/prometheus are exposed: heapdump/env/threaddump/configprops etc. reveal
# secrets (JWT secret, DB passwords, tokens) and a heap dump needs about the heap's size in
# extra memory, enough to get a 512m container OOM-killed. Take dumps from inside the host.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.heapdump.access=none
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.gateway.enabled=true
management.metrics.tags.application=${spring.application.name}
# Distributed tracing -- OTLP endpoint, matching PaymentAPI/NMS's convention. Non-fatal if no
# collector is listening (spans just drop); see docker-compose.tracing.yml at the repo root.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
# management.otlp.tracing.endpoint is deprecated at error level since Boot 4.0 (silently does
# nothing) -- management.opentelemetry.tracing.export.otlp.endpoint is the real property name.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics: Prometheus scrape only (/actuator/prometheus) -- OTLP metrics push disabled. Tracing
# still goes over OTLP above; spring-boot-starter-opentelemetry pulls in micrometer-registry-otlp
# and defaults this to true, which was never an intentional metrics path.
management.otlp.metrics.export.enabled=false
# Histogram buckets for http.server.requests -- needed so Prometheus's histogram_quantile() can
# compute p95/p99 latency per endpoint (Grafana golden-signals dashboard/alerts); a plain Timer
# alone only exports count/sum, no distribution.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ─── OpenAPI ──────────────────────────────────────────────────────────────────
# The gateway's own bare paths (above) serve a near-empty spec -- FallbackController is its only
# @RestController. The real value is the aggregator below: springdoc-openapi-starter-webflux-ui's
# swagger-ui.html renders a service dropdown from swagger-ui.urls, one entry per downstream
# service, each URL proxied through this gateway's own routes (see RouteConfig's pay-docs/nms-docs/
# search-docs/irctc-docs routes, and the admin/bookings/uam/dms routes whose existing rewrite
# already reinserts that service's own context-path). "Try it out" round-trips correctly because
# every route also sends X-Forwarded-Prefix, which each backend service's
# server.forward-headers-strategy=framework turns into the correct externally-reachable server URL
# in that service's own generated OpenAPI spec.
springdoc.swagger-ui.path=/swagger-ui.html
# Origins allowed to embed the Swagger UI in an iframe (Rider_Web's API docs page) -- CSP
# frame-ancestors on the Swagger paths only. Space-separated; host:* covers every port.
railcab.gateway.swagger.frame-ancestors=${SWAGGER_FRAME_ANCESTORS:http://localhost:4200 http://35.154.15.238:*}
