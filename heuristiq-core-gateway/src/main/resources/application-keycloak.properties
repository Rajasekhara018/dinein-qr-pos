# Not required to activate Keycloak auth -- that's controlled by
# railcab.gateway.identity-provider.type=keycloak. This profile only turns on verbose
# auth-provider logging, handy when debugging introspection calls. Combine with other active
# profiles, e.g. SPRING_PROFILES_ACTIVE=prod,keycloak.
logging.level.com.heuristiq.gateway.auth.provider=DEBUG
