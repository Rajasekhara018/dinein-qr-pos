# Activate with SPRING_PROFILES_ACTIVE=postgres (can be combined with dev/local/prod, e.g. "dev,postgres").
# Switches RolePrivilegeRepository to the JPA/PostgreSQL implementation, reading the SAME uam_roles/
# uam_role_permissions/permissions tables UAM itself owns and migrates -- this profile never runs
# Flyway or DDL generation (spring.jpa.hibernate.ddl-auto=none), it only reads.

# Un-exclude JPA/DataSource autoconfiguration (excluded by default in application.properties for mongo mode)
# and exclude MongoDB instead -- every Mongo-backed bean is conditional on persistence.type=mongo, so in
# this profile nothing needs a MongoClient and the gateway must not try to reach one at startup.
spring.autoconfigure.exclude=\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.MongoReactiveAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.health.MongoReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.metrics.MongoMetricsAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveRepositoriesAutoConfiguration

spring.datasource.url=${UAM_POSTGRES_URL:jdbc:postgresql://localhost:5432/railcab_uam}
spring.datasource.username=${UAM_POSTGRES_USERNAME:railcab_uam}
spring.datasource.password=${UAM_POSTGRES_PASSWORD:railcab_uam}
spring.datasource.hikari.pool-name=gateway-uam-postgres-pool
spring.datasource.hikari.maximum-pool-size=${UAM_POSTGRES_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${UAM_POSTGRES_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${UAM_POSTGRES_CONN_TIMEOUT_MS:10000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

railcab.gateway.persistence.type=postgres
