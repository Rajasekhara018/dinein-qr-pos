@if (handset()) {
  <div class="flex justify-center pt-2" aria-hidden="true">
    <span class="h-1.5 w-10 rounded-full bg-line-strong"></span>
  </div>
}
<header class="flex items-start gap-3 border-b border-line px-4 py-3 sm:px-6">
  <div class="min-w-0 flex-1">
    <h2
      [id]="titleId"
      tabindex="-1"
      class="font-display text-lg font-semibold leading-tight outline-none sm:text-xl"
    >
      {{ title() }}
    </h2>
    @if (subtitle()) {
      <p class="mt-0.5 text-sm text-ink-muted">{{ subtitle() }}</p>
    }
    <ng-content select="[sheetHeader]" />
  </div>
  <button
    appIconButton
    type="button"
    class="-mr-2 -mt-1"
    aria-label="Close"
    (click)="closed.emit()"
  >
    <svg viewBox="0 0 20 20" class="size-5 fill-current" aria-hidden="true">
      <path
        d="M5.3 4 10 8.6 14.7 4 16 5.3 11.4 10l4.6 4.7-1.3 1.3-4.7-4.6L5.3 16 4 14.7 8.6 10 4 5.3 5.3 4Z"
      />
    </svg>
  </button>
</header>
<div class="min-h-0 flex-1 overflow-y-auto overscroll-contain px-4 py-4 sm:px-6">
  <ng-content />
</div>
<footer
  class="border-t border-line bg-surface px-4 pt-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] sm:px-6 sm:pb-4 empty:hidden"
>
  <ng-content select="[sheetFooter]" />
</footer>
