@if (takeaway()) {
  <span
    class="inline-flex items-center gap-1 whitespace-nowrap rounded-full bg-violet-700 px-2.5 py-0.5 text-xs font-bold uppercase tracking-wide text-white dark:bg-violet-500 dark:text-violet-950"
    data-testid="order-type-badge"
  >
    <svg viewBox="0 0 20 20" class="size-3.5 fill-current" aria-hidden="true">
      <path d="M6 6V5a4 4 0 1 1 8 0v1h3l-1 12H4L3 6h3Zm2 0h4V5a2 2 0 1 0-4 0v1Z" />
    </svg>
    {{ label() }}
  </span>
} @else if (!hideDineIn()) {
  <span
    class="inline-flex items-center whitespace-nowrap rounded-full bg-surface-muted px-2.5 py-0.5 text-xs font-semibold text-ink-muted"
    data-testid="order-type-badge"
  >
    {{ label() }}
  </span>
}
