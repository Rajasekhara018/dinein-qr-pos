@if (removable()) {
  <span [class]="classes()">
    <span>{{ label() }}</span>
    <button
      type="button"
      class="-mr-1 inline-flex size-5 items-center justify-center rounded-full hover:bg-black/10"
      [attr.aria-label]="removeLabel() || 'Remove ' + label()"
      [disabled]="disabled()"
      (click)="toggle()"
    >
      <svg viewBox="0 0 20 20" class="size-3 fill-current" aria-hidden="true">
        <path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="2" />
      </svg>
    </button>
  </span>
} @else {
  <button
    type="button"
    role="checkbox"
    [class]="classes()"
    [attr.aria-checked]="selected()"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    @if (selected()) {
      <svg viewBox="0 0 20 20" class="size-3.5 fill-current" aria-hidden="true">
        <path d="M16.7 5.3a1 1 0 0 1 0 1.4l-8 8a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4L8 12.6l7.3-7.3a1 1 0 0 1 1.4 0Z" />
      </svg>
    }
    <span>{{ label() }}</span>
  </button>
}
