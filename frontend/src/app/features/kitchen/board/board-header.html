<header class="flex flex-wrap items-center gap-x-4 gap-y-2 px-3 py-2 sm:px-4 lg:px-6">
  <div class="min-w-0 flex-1">
    <h1
      class="truncate font-display text-[clamp(1.15rem,0.9rem+0.9vw,2rem)] font-bold leading-tight"
    >
      {{ store.config().restaurantName }}
    </h1>
    @if (deviceLabel()) {
      <p class="truncate text-sm text-ink-muted">{{ deviceLabel() }}</p>
    }
  </div>

  <dl
    class="hidden items-center gap-4 text-[clamp(0.95rem,0.8rem+0.4vw,1.35rem)] font-semibold lg:flex"
    aria-label="Order counts"
  >
    <div class="flex items-center gap-1.5">
      <dt class="text-ink-muted">New</dt>
      <dd class="tabular-nums" data-testid="count-CONFIRMED">{{ store.counts().CONFIRMED }}</dd>
    </div>
    <div class="flex items-center gap-1.5">
      <dt class="text-ink-muted">Preparing</dt>
      <dd class="tabular-nums">{{ store.counts().PREPARING }}</dd>
    </div>
    <div class="flex items-center gap-1.5">
      <dt class="text-ink-muted">Ready</dt>
      <dd class="tabular-nums">{{ store.counts().READY }}</dd>
    </div>
  </dl>

  <div class="flex items-center gap-3">
    <span
      class="inline-flex items-center gap-2 rounded-full bg-surface-muted px-3 py-1 text-sm font-semibold"
      [class]="connection().text"
      role="status"
      data-testid="connection-status"
    >
      <span class="size-2.5 rounded-full" [class]="connection().dot" aria-hidden="true"></span>
      {{ connection().label }}
    </span>
    <time
      class="font-mono text-[clamp(1.1rem,0.9rem+0.7vw,1.9rem)] font-bold tabular-nums"
      aria-label="Current time (IST)"
      >{{ clockText() }}</time
    >
  </div>

  <div class="flex items-center gap-1">
    @if (sound.supported) {
      <button
        appIconButton
        type="button"
        [attr.aria-label]="sound.enabled() ? 'Mute new-order sound' : 'Turn on new-order sound'"
        [attr.aria-pressed]="sound.enabled()"
        [title]="sound.enabled() ? 'Sound on' : 'Sound off'"
        (click)="toggleSound()"
      >
        @if (sound.enabled()) {
          <svg
            viewBox="0 0 24 24"
            class="size-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            aria-hidden="true"
          >
            <path d="M11 5 6 9H3v6h3l5 4V5Z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            class="size-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            aria-hidden="true"
          >
            <path d="M11 5 6 9H3v6h3l5 4V5Z" />
            <path d="m16 9 6 6M22 9l-6 6" />
          </svg>
        }
      </button>
    }
    <button
      appIconButton
      type="button"
      [attr.aria-label]="
        prefs.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
      "
      [title]="prefs.theme() === 'dark' ? 'Light theme' : 'Dark theme'"
      (click)="prefs.toggleTheme()"
    >
      @if (prefs.theme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          class="size-6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          class="size-6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          aria-hidden="true"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      }
    </button>
    @if (fullscreen.supported) {
      <button
        appIconButton
        type="button"
        [attr.aria-label]="fullscreen.active() ? 'Exit full screen' : 'Full screen'"
        [attr.aria-pressed]="fullscreen.active()"
        [title]="fullscreen.active() ? 'Exit full screen' : 'Full screen'"
        (click)="fullscreen.toggle()"
      >
        @if (fullscreen.active()) {
          <svg
            viewBox="0 0 24 24"
            class="size-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            aria-hidden="true"
          >
            <path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6" />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            class="size-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            aria-hidden="true"
          >
            <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" />
          </svg>
        }
      </button>
    }
    <button
      appIconButton
      type="button"
      aria-label="Sign out this screen"
      title="Sign out"
      (click)="signOut.emit()"
    >
      <svg
        viewBox="0 0 24 24"
        class="size-6"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        aria-hidden="true"
      >
        <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11" />
      </svg>
    </button>
  </div>
</header>
