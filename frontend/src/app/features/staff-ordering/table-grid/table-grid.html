<ul class="grid grid-cols-2 gap-3 min-[480px]:grid-cols-3 md:grid-cols-4 xl:grid-cols-6" role="list">
  @if (takeawayEnabled()) {
    <li class="min-w-0">
      <button
        type="button"
        class="flex min-h-24 w-full min-w-0 flex-col items-start justify-between gap-2 rounded-card border-2 p-3 text-left shadow-card transition-colors"
        [class]="
          takeawaySelected()
            ? 'border-violet-700 bg-violet-50 dark:border-violet-400 dark:bg-violet-950'
            : 'border-dashed border-violet-400 bg-surface hover:bg-violet-50 dark:hover:bg-violet-950'
        "
        [attr.aria-pressed]="takeawaySelected()"
        data-testid="table-tile-takeaway"
        (click)="pickTakeaway.emit()"
      >
        <span class="flex items-center gap-2 font-display text-xl font-bold text-violet-800 dark:text-violet-200">
          <svg viewBox="0 0 20 20" class="size-5 fill-current" aria-hidden="true">
            <path d="M6 6V5a4 4 0 1 1 8 0v1h3l-1 12H4L3 6h3Zm2 0h4V5a2 2 0 1 0-4 0v1Z" />
          </svg>
          Takeaway
        </span>
        <span class="text-sm text-ink-muted">No table · packed to go</span>
      </button>
    </li>
  }
  @for (table of tables(); track table.id) {
    <li class="min-w-0">
      <button
        type="button"
        class="flex min-h-24 w-full min-w-0 flex-col items-start justify-between gap-2 rounded-card border-2 p-3 text-left shadow-card transition-colors"
        [class]="
          selectedTableId() === table.id
            ? 'border-brand bg-brand-soft'
            : table.ready > 0
              ? 'border-emerald-500 bg-surface hover:bg-surface-muted'
              : 'border-line bg-surface hover:bg-surface-muted'
        "
        [attr.aria-pressed]="selectedTableId() === table.id"
        [attr.aria-label]="
          'Table ' +
          table.label +
          (showCounts() ? ', ' + table.openOrders + ' open, ' + table.ready + ' ready' : '')
        "
        [attr.data-testid]="'table-tile-' + table.label"
        (click)="pickTable.emit(table)"
      >
        <span class="w-full truncate font-display text-2xl font-bold">{{ table.label }}</span>
        @if (showCounts()) {
          @if (table.openOrders === 0) {
            <span class="text-sm text-ink-muted">Free</span>
          } @else {
            <span class="flex flex-wrap gap-1 text-xs font-semibold" aria-hidden="true">
              @if (table.confirmed > 0) {
                <span class="rounded-full bg-blue-100 px-2 py-0.5 text-blue-900 dark:bg-blue-900 dark:text-blue-50"
                  >{{ table.confirmed }} new</span
                >
              }
              @if (table.preparing > 0) {
                <span
                  class="rounded-full bg-orange-100 px-2 py-0.5 text-orange-900 dark:bg-orange-900 dark:text-orange-50"
                  >{{ table.preparing }} cooking</span
                >
              }
              @if (table.ready > 0) {
                <span
                  class="rounded-full bg-emerald-600 px-2 py-0.5 text-white dark:bg-emerald-500 dark:text-emerald-950"
                  >{{ table.ready }} ready</span
                >
              }
            </span>
          }
        }
      </button>
    </li>
  }
</ul>
