@if (cart.itemCount() > 0) {
  <div class="fixed inset-x-0 bottom-0 z-30 px-3 pt-2 pb-[calc(0.75rem+env(safe-area-inset-bottom))] animate-fade-in sm:px-4">
    <a
      routerLink="/menu/cart"
      class="mx-auto flex min-h-14 w-full max-w-3xl items-center justify-between gap-3 rounded-card bg-brand px-4 text-brand-contrast shadow-raised hover:bg-brand-strong"
      data-testid="cart-bar"
    >
      <span class="min-w-0 truncate font-semibold tabular-nums">
        {{ cart.itemCount() }} {{ cart.itemCount() === 1 ? 'item' : 'items' }} · {{ cart.total() | inr: 'paise' }}
        <span class="sr-only">(estimated)</span>
      </span>
      <span class="flex shrink-0 items-center gap-1 font-bold">
        View cart
        <svg viewBox="0 0 20 20" class="size-5 fill-current" aria-hidden="true"><path d="M7.3 4.3 13 10l-5.7 5.7-1.4-1.4L10.2 10 5.9 5.7l1.4-1.4Z"/></svg>
      </span>
    </a>
  </div>
}
