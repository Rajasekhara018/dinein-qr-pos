<app-card padding="none" class="flex max-h-[calc(100dvh-2rem)] flex-col">
  <h2 class="border-b border-line px-4 py-3 font-display text-lg font-semibold">Your order</h2>
  @if (cart.isEmpty()) {
    <p class="px-4 py-8 text-center text-sm text-ink-muted">Your cart is empty. Add something tasty!</p>
  } @else {
    <div class="min-h-0 flex-1 overflow-y-auto px-4 py-3">
      <app-cart-lines
        compact
        [lines]="cart.lines()"
        (edit)="edit($event)"
        (remove)="cart.remove($event.key)"
        (quantityChange)="setQuantity($event)"
      />
    </div>
    <div class="border-t border-line px-4 py-3">
      <app-bill-summary [bill]="cart.bill()" [pricesIncludeGst]="cart.pricesIncludeGst()" />
      <a appButton routerLink="/menu/cart" block size="lg" class="mt-3">
        Checkout · {{ cart.total() | inr: 'paise' }}
      </a>
    </div>
  }
</app-card>
