<article
  class="flex h-full min-w-0 gap-3 rounded-card border border-line bg-surface p-3 shadow-card sm:p-4"
  [class.opacity-60]="!item().available"
  [attr.aria-labelledby]="'item-' + item().id"
  [attr.data-testid]="'menu-item-' + item().id"
>
  <div class="flex min-w-0 flex-1 flex-col">
    <div class="flex items-center gap-2">
      <app-veg-marker [type]="item().foodType" />
      @if (customizable() && item().available) {
        <span class="text-xs text-ink-subtle">Customisable</span>
      }
    </div>
    <h3 [id]="'item-' + item().id" class="mt-1 font-semibold leading-snug text-ink">{{ item().name }}</h3>
    <app-price class="mt-0.5 text-[0.95rem] font-semibold text-ink" [amount]="price()" [from]="hasVariantRange()" whole />
    @if (item().description) {
      <p class="mt-1 line-clamp-2 text-sm text-ink-muted">{{ item().description }}</p>
    }
  </div>

  <div class="flex w-28 shrink-0 flex-col items-center sm:w-32">
    @if (item().thumbUrl) {
      <app-image-box
        [src]="item().thumbUrl"
        [alt]="''"
        ratio="square"
        sizes="128px"
        class="w-full rounded-control"
        [class.grayscale]="!item().available"
      />
    }
    <div class="relative z-10 flex w-full justify-center" [class.-mt-5]="!!item().thumbUrl" [class.mt-auto]="!item().thumbUrl">
      @if (!item().available) {
        <span class="rounded-control border border-line bg-surface px-3 py-2 text-xs font-semibold text-ink-muted shadow-card">
          Out of stock
        </span>
      } @else if (quantity() === 0) {
        <button
          type="button"
          class="min-h-touch w-full rounded-control border border-brand/40 bg-surface px-4 text-sm font-bold uppercase tracking-wide text-brand-ink shadow-card hover:bg-brand-soft disabled:opacity-50"
          [attr.aria-label]="'Add ' + item().name"
          (click)="add.emit()"
        >
          Add
        </button>
      } @else {
        <app-quantity-stepper
          class="shadow-card"
          [quantity]="quantity()"
          (quantityChange)="quantityChange.emit($event)"
          [incrementOnly]="customizable()"
          (increment)="add.emit()"
          [itemName]="item().name"
        />
      }
    </div>
  </div>
</article>
