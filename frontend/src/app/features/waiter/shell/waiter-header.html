<header class="mx-auto flex max-w-6xl items-center gap-1 px-2 py-1.5 sm:gap-2 sm:px-4">
  <div class="min-w-0 flex-1 pl-2">
    <p class="truncate font-display text-lg font-bold leading-tight" data-testid="waiter-restaurant">
      {{ restaurantName() }}
    </p>
    <p class="flex min-w-0 items-center gap-1.5 text-sm text-ink-muted">
      <span
        class="inline-flex shrink-0 items-center gap-1 font-semibold"
        [class]="connection().text"
        role="status"
        [attr.aria-label]="'Connection: ' + connection().label"
        data-testid="connection-status"
      >
        <span class="size-2.5 rounded-full" [class]="connection().dot" aria-hidden="true"></span>
        <span class="hidden min-[400px]:inline">{{ connection().label }}</span>
      </span>
      <span aria-hidden="true" class="hidden min-[400px]:inline">·</span>
      <span class="min-w-0 truncate" data-testid="waiter-staff-name">{{ staffName() }}</span>
    </p>
  </div>

  <app-waiter-bell />

  @if (alerts.supported) {
    <button
      appIconButton
      type="button"
      [attr.aria-label]="alerts.enabled() ? 'Mute order-ready sound' : 'Turn on order-ready sound'"
      [attr.aria-pressed]="alerts.enabled()"
      [title]="alerts.enabled() ? 'Sound on' : 'Sound off'"
      (click)="alerts.toggle()"
    >
      @if (alerts.enabled()) {
        <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z" />
          <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z" />
          <path d="m16 9 6 6M22 9l-6 6" />
        </svg>
      }
    </button>
  }

  <button appIconButton type="button" aria-label="Sign out" title="Sign out" (click)="signOut.emit()" data-testid="waiter-sign-out">
    <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11" />
    </svg>
  </button>
</header>
