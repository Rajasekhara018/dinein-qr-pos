@if (!editing()) {
  <button
    type="button"
    class="group -mx-2 inline-flex min-h-touch max-w-full items-center gap-2 rounded-control px-2 text-left hover:bg-surface-muted disabled:cursor-wait"
    [disabled]="busy()"
    [attr.aria-label]="'Edit price of ' + item().name + ' (' + summary() + ')'"
    [attr.data-testid]="'price-edit-' + item().id"
    (click)="start()"
  >
    <span class="min-w-0 font-semibold tabular-nums text-ink" [attr.data-testid]="'price-' + item().id">
      @if (item().hasVariants && item().variants.length) {
        @for (v of item().variants; track v.id) {
          <span class="block text-sm leading-6">
            <span class="font-normal text-ink-muted">{{ v.name }}</span> {{ v.price | inr }}
          </span>
        }
      } @else {
        {{ item().basePrice ?? item().displayPrice ?? 0 | inr }}
      }
    </span>
    @if (busy()) {
      <app-spinner [size]="16" class="text-ink-subtle" />
    } @else {
      <svg viewBox="0 0 24 24" class="size-4 shrink-0 text-ink-subtle group-hover:text-ink" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M4 20h4L19 9l-4-4L4 16v4Zm9-13 4 4" />
      </svg>
    }
  </button>
} @else {
  <form
    class="flex flex-wrap items-end gap-2"
    [formGroup]="form"
    (ngSubmit)="commit()"
    (keydown.escape)="cancel()"
    novalidate
  >
    @for (field of fields(); track field.key) {
      <label class="flex min-w-0 flex-col text-xs font-medium text-ink-muted">
        <span>{{ field.label }}<span class="sr-only"> price of {{ item().name }}</span></span>
        <span class="relative mt-0.5">
          <span class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-ink-subtle" aria-hidden="true">₹</span>
          <input
            #priceInput
            type="text"
            inputmode="decimal"
            autocomplete="off"
            class="min-h-touch w-28 rounded-control border border-line-strong bg-surface py-2 pl-6 pr-2 text-base tabular-nums text-ink aria-invalid:border-danger"
            [formControlName]="field.key"
            [attr.aria-invalid]="isInvalid(field.key) ? 'true' : null"
            [attr.data-testid]="'price-input-' + item().id + '-' + field.key"
          />
        </span>
      </label>
    }
    <div class="flex gap-1">
      <button appIconButton variant="solid" type="submit" aria-label="Save price" [attr.data-testid]="'price-save-' + item().id">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="m5 12 5 5L20 7" />
        </svg>
      </button>
      <button appIconButton variant="outline" type="button" aria-label="Cancel price edit" (click)="cancel()">
        <svg viewBox="0 0 20 20" class="size-4 fill-current" aria-hidden="true">
          <path d="M5.3 4 10 8.6 14.7 4 16 5.3 11.4 10l4.6 4.7-1.3 1.3-4.7-4.6L5.3 16 4 14.7 8.6 10 4 5.3 5.3 4Z" />
        </svg>
      </button>
    </div>
    @if (invalid()) {
      <p class="w-full text-sm font-medium text-danger" role="alert">
        Enter a price greater than ₹0 with at most 2 decimals.
      </p>
    }
  </form>
}
