<app-auth-shell
  theme="admin"
  eyebrow="Restaurant back-office"
  headline="Run the whole restaurant from one panel."
  description="Menu, orders, tables and reports — everything your team needs to keep the floor and kitchen moving."
  [benefits]="benefits"
  mobileTitle="DineIn admin"
  desktopTitle="Welcome back"
  desktopSubtitle="Sign in to manage your restaurant."
>
  <svg authShellIcon lucideChefHat class="size-4" aria-hidden="true"></svg>
  <svg authShellMobileIcon lucideChefHat class="size-7" aria-hidden="true"></svg>

  <form
    class="rounded-card border border-line bg-surface p-5 shadow-md sm:p-6"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
  >
    @if (error()) {
      <p
        class="mb-4 rounded-control bg-danger-bg px-3 py-2 text-sm font-medium text-danger-fg"
        role="alert"
        data-testid="login-error"
      >
        {{ error() }}
      </p>
    }
    <label for="login-username" class="block text-sm font-medium text-ink">Username</label>
    <div class="relative mt-1">
      <svg
        lucideUser
        class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-ink-subtle"
        aria-hidden="true"
      ></svg>
      <input
        id="login-username"
        appInput
        class="pl-9"
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        aria-describedby="login-username-error"
      />
    </div>
    <app-field-error id="login-username-error" [control]="form.controls.username" />

    <div class="mt-4 flex items-baseline justify-between">
      <label for="login-password" class="block text-sm font-medium text-ink">Password</label>
      <a routerLink="/admin/forgot-password" class="text-sm font-medium text-admin-brand-ink hover:underline">
        Forgot password?
      </a>
    </div>
    <div class="relative mt-1">
      <svg
        lucideLock
        class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-ink-subtle"
        aria-hidden="true"
      ></svg>
      <input
        id="login-password"
        appInput
        class="pl-9 pr-12"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        aria-describedby="login-password-error"
      />
      <button
        appIconButton
        type="button"
        class="absolute right-0 top-0"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="showPassword()"
        (click)="showPassword.set(!showPassword())"
      >
        @if (showPassword()) {
          <svg lucideEyeOff class="size-5" aria-hidden="true"></svg>
        } @else {
          <svg lucideEye class="size-5" aria-hidden="true"></svg>
        }
      </button>
    </div>
    <app-field-error id="login-password-error" [control]="form.controls.password" />

    <button appButton type="submit" size="lg" block class="mt-6" [loading]="submitting()">
      @if (submitting()) {
        <app-spinner [size]="18" />
      }
      Sign in
    </button>
  </form>
</app-auth-shell>
