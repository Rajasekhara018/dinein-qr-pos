<main class="flex min-h-dvh items-center justify-center bg-bg px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <div
        class="mx-auto mb-3 flex size-12 items-center justify-center rounded-card bg-brand text-brand-contrast"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24" class="size-7" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 11h18M5 11a7 7 0 0 1 14 0M12 4V3M4 15h16l-1 3H5l-1-3Z" />
        </svg>
      </div>
      <h1 class="font-display text-2xl font-semibold text-ink">DineIn admin</h1>
      <p class="mt-1 text-sm text-ink-muted">Sign in to manage your restaurant.</p>
    </div>

    <form
      class="rounded-card border border-line bg-surface p-5 shadow-card sm:p-6"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      @if (error()) {
        <p
          class="mb-4 rounded-control bg-red-50 px-3 py-2 text-sm font-medium text-red-900 dark:bg-red-950 dark:text-red-100"
          role="alert"
          data-testid="login-error"
        >
          {{ error() }}
        </p>
      }
      <label for="login-username" class="block text-sm font-medium text-ink">Username</label>
      <input
        id="login-username"
        appInput
        class="mt-1"
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        aria-describedby="login-username-error"
      />
      <app-field-error id="login-username-error" [control]="form.controls.username" />

      <label for="login-password" class="mt-4 block text-sm font-medium text-ink">Password</label>
      <div class="relative mt-1">
        <input
          id="login-password"
          appInput
          class="pr-12"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          aria-describedby="login-password-error"
        />
        <button
          appIconButton
          type="button"
          class="absolute right-0 top-0"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
            @if (showPassword()) {
              <path d="M4 4l16 16" />
            }
          </svg>
        </button>
      </div>
      <app-field-error id="login-password-error" [control]="form.controls.password" />

      <button appButton type="submit" size="lg" block class="mt-6" [loading]="submitting()">
        @if (submitting()) {
          <app-spinner [size]="18" />
        }
        Sign in
      </button>
    </form>
  </div>
</main>
