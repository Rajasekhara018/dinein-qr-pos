<app-auth-shell
  theme="admin"
  eyebrow="Account recovery"
  headline="Locked out? We'll get you back in."
  description="Staff accounts are set up and reset by your restaurant's owner or a manager, so a password reset always starts with them."
  mobileTitle="Forgot your password?"
  mobileSubtitle="Ask your owner or a manager to reset it for you."
>
  <svg authShellIcon lucideMail class="size-4" aria-hidden="true"></svg>
  <svg authShellMobileIcon lucideLock class="size-6" aria-hidden="true"></svg>

  <p class="mb-6 text-center text-sm text-ink-muted lg:text-left">
    There is no self-service reset in the admin panel. Ask your restaurant's owner or a manager to sign in and set a
    new temporary password for your account from <strong class="font-semibold text-ink">Staff &amp; devices</strong>
    — you'll be asked to choose your own password the next time you sign in.
  </p>

  <div class="rounded-card border border-line bg-surface p-5 shadow-md sm:p-6">
    <a appButton variant="outline" size="lg" block routerLink="/admin/login">
      <svg lucideChevronLeft class="size-4" aria-hidden="true"></svg>
      Back to sign in
    </a>
  </div>
</app-auth-shell>
