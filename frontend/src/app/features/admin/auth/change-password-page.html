<app-auth-shell
  theme="admin"
  eyebrow="Account security"
  headline="Keep your restaurant's account secure."
  description="A strong, unique password protects your menu, sales figures and staff accounts from anyone else who finds this link."
  [mobileTitle]="forced() ? 'Set a new password' : 'Change password'"
  [mobileSubtitle]="forced() ? 'For security, choose a new password before you continue.' : ''"
>
  <svg authShellIcon lucideLock class="size-4" aria-hidden="true"></svg>
  <svg authShellMobileIcon lucideLock class="size-6" aria-hidden="true"></svg>

  @if (forced() && auth.user(); as user) {
    <p class="mb-4 text-center text-sm text-ink-muted lg:text-left">
      Signed in as <strong class="font-semibold text-ink">{{ user.username }}</strong>
    </p>
  }

  <form
    class="rounded-card border border-line bg-surface p-5 shadow-md sm:p-6"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
  >
    @if (error()) {
      <p class="mb-4 rounded-control bg-danger-bg px-3 py-2 text-sm font-medium text-danger-fg" role="alert">
        {{ error() }}
      </p>
    }
    <!-- Hidden username helps password managers store the new password for the right account. -->
    <input
      type="text"
      class="sr-only"
      tabindex="-1"
      aria-hidden="true"
      autocomplete="username"
      [value]="auth.user()?.username ?? ''"
      readonly
    />

    <div class="flex items-baseline justify-between">
      <label for="cp-current" class="block text-sm font-medium text-ink">Current password</label>
      <button
        appIconButton
        type="button"
        [attr.aria-label]="showPasswords() ? 'Hide passwords' : 'Show passwords'"
        [attr.aria-pressed]="showPasswords()"
        (click)="showPasswords.set(!showPasswords())"
      >
        @if (showPasswords()) {
          <svg lucideEyeOff class="size-4" aria-hidden="true"></svg>
        } @else {
          <svg lucideEye class="size-4" aria-hidden="true"></svg>
        }
      </button>
    </div>
    <div class="relative mt-1">
      <svg
        lucideLock
        class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-ink-subtle"
        aria-hidden="true"
      ></svg>
      <input
        id="cp-current"
        appInput
        class="pl-9"
        [type]="showPasswords() ? 'text' : 'password'"
        formControlName="currentPassword"
        autocomplete="current-password"
        aria-describedby="cp-current-error"
      />
    </div>
    <app-field-error id="cp-current-error" [control]="form.controls.currentPassword" />

    <label for="cp-new" class="mt-4 block text-sm font-medium text-ink">New password</label>
    <div class="relative mt-1">
      <svg
        lucideLock
        class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-ink-subtle"
        aria-hidden="true"
      ></svg>
      <input
        id="cp-new"
        appInput
        class="pl-9"
        [type]="showPasswords() ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
        aria-describedby="cp-new-hint cp-new-error"
      />
    </div>
    <p id="cp-new-hint" class="mt-1 text-xs text-ink-subtle">
      8–72 characters, with at least one letter and one digit.
    </p>
    <app-field-error id="cp-new-error" [control]="form.controls.newPassword" [messages]="messages" />

    <label for="cp-confirm" class="mt-4 block text-sm font-medium text-ink">Confirm new password</label>
    <div class="relative mt-1">
      <svg
        lucideLock
        class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-ink-subtle"
        aria-hidden="true"
      ></svg>
      <input
        id="cp-confirm"
        appInput
        class="pl-9"
        [type]="showPasswords() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
        aria-describedby="cp-confirm-error cp-group-error"
      />
    </div>
    <app-field-error id="cp-confirm-error" [control]="form.controls.confirmPassword" />
    <app-field-error
      id="cp-group-error"
      [control]="form"
      [force]="attempted() || form.controls.confirmPassword.touched"
      [messages]="{
        mismatch: 'The new passwords do not match.',
        reused: 'The new password must differ from the current one.',
      }"
    />

    <div class="mt-6 flex flex-col gap-2">
      <button appButton type="submit" size="lg" block [loading]="submitting()">
        Save new password
      </button>
      @if (forced()) {
        <button appButton variant="ghost" type="button" block (click)="logout()">Sign out</button>
      } @else {
        <button appButton variant="ghost" type="button" block (click)="cancel()">Cancel</button>
      }
    </div>
  </form>
</app-auth-shell>
