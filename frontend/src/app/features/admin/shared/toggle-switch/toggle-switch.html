<button
  type="button"
  role="switch"
  class="inline-flex min-h-touch min-w-touch max-w-full items-center gap-3 rounded-control text-left disabled:cursor-not-allowed disabled:opacity-60"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="showLabel() ? null : label()"
  [attr.aria-busy]="busy() || null"
  [attr.data-testid]="testId()"
  [disabled]="isDisabled()"
  (click)="toggle()"
>
  <span
    class="relative inline-flex h-6 w-11 shrink-0 rounded-full transition-colors"
    [class.bg-success]="checked()"
    [class.bg-ink-subtle]="!checked()"
    aria-hidden="true"
  >
    <span
      class="absolute left-0.5 top-0.5 size-5 rounded-full bg-white shadow transition-transform"
      [class.translate-x-5]="checked()"
    ></span>
  </span>
  @if (showLabel()) {
    <span class="min-w-0">
      <span class="block text-sm font-medium text-ink sm:text-base">{{ label() }}</span>
      @if (hint()) {
        <span class="block text-sm text-ink-muted">{{ hint() }}</span>
      }
    </span>
  }
</button>
