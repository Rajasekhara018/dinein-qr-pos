# Test profile — in-memory H2 (Postgres compatibility mode), no live Postgres/Razorpay/Ride
# service required to run the test suite. Flyway is disabled in favor of Hibernate
# generating the schema directly from the JPA entities, so tests don't need to track
# the raw-SQL migration's Postgres-specific syntax (partial unique indexes, etc.).
spring.datasource.url=jdbc:h2:mem:payment-service-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=test-secret-key-for-payment-service-min-32-chars-long
app.razorpay.key-id=rzp_test_dummy
app.razorpay.key-secret=dummy_secret
app.razorpay.webhook-secret=whsec_test_dummy_secret
app.ride-service.base-url=http://localhost:19999
rider.audit.publish.enabled=false

# The outbox drain SQL is PostgreSQL-only (UPDATE ... FROM ... RETURNING, SKIP LOCKED); H2 cannot run it. It is
# tested on embedded PostgreSQL in DurableEventOutboxTest, so H2-backed contexts keep the drain off.
rider.outbox.enabled=false
# Sale settlement stores requests with PostgreSQL-only SQL (ON CONFLICT); tested on embedded PostgreSQL (JdbcSaleSettlementOutboxTest).
rider.sale-settlement.enabled=false
# H2 contexts mock accounting completion; real queue/lease SQL is verified on embedded PostgreSQL.
rider.refund-accounting.scheduler-enabled=false
