spring.application.name=RealBoom-PaymentService

server.port=9113
# API versioning is applied per-@RestController via ApiVersionConfig (addPathPrefix),
# not via server.servlet.context-path — a context-path is server-wide and would force
# every client onto the same version simultaneously on a future v2 bump.

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Datasource / Flyway ───────────────────────────────────────────────────────
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/rider_payment}
# Small pool: normal traffic needs a handful of connections, and each idle one holds
# buffers and a thread (see also Postgres max_connections across all services).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.username=${DATASOURCE_USERNAME:rider}
spring.datasource.password=${DATASOURCE_PASSWORD:rider}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Index migrations use CREATE INDEX CONCURRENTLY, which Flyway runs outside a transaction. With Flyway's default
# transaction-scoped PostgreSQL lock, that build waits for Flyway's own open transaction forever; a session lock does not.
spring.flyway.postgresql.transactional-lock=false

# ── JWT — bearer-token validation only (tokens are issued by the Auth/Ride service) ──
jwt.secret=${JWT_SECRET:rider-admin-super-secret-key-change-in-production-min-256bit}
jwt.expiry-days=${JWT_EXPIRY_DAYS:30}

# ── Razorpay — key-id is safe to expose (client-side); key-secret/webhook-secret via env ──
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_SYcoE53g3bDHZo}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ── Multi-gateway routing: which gateway an online payment uses when the caller's POST /payments
# request doesn't specify one explicitly (every existing Ride/Dispatch-service caller today).
# Change this (env var only, no code change/redeploy) to switch the platform-wide default gateway.
app.payment.default-gateway=${DEFAULT_PAYMENT_GATEWAY:RAZORPAY}

# Must equal the gateway's GATEWAY_FORWARD_KEY. The gateway's "elevated caller" header (X-User-Elevated) is honoured only
# together with this key; when blank nobody is elevated and admins cannot act on other users' payments.
gateway.forward-key=${GATEWAY_FORWARD_KEY:}

# ── Payment status polling (PaymentStatusPollingScheduler) ─────────────────────
# How PAYU/TOUCAN/PINELABS payments ever learn their outcome — those 3 gateways have no webhook
# ingestion in this service (only RAZORPAY does, via POST /api/v1/payment/payments/webhook). Payments older than
# max-age-hours with no resolved outcome are marked EXPIRED instead of polled forever.
app.payment-polling.check-interval-ms=${PAYMENT_POLLING_INTERVAL_MS:60000}
app.payment-polling.max-age-hours=${PAYMENT_POLLING_MAX_AGE_HOURS:24}
app.payment-polling.razorpay-grace-seconds=${PAYMENT_POLLING_RAZORPAY_GRACE_SECONDS:120}
app.payment-polling.page-size=${PAYMENT_POLLING_PAGE_SIZE:100}
app.payment-polling.concurrency=${PAYMENT_POLLING_CONCURRENCY:4}
# Must stay below the scheduler's ShedLock lockAtMostFor (PT5M).
app.payment-polling.run-budget=${PAYMENT_POLLING_RUN_BUDGET:PT4M}

# ── Multi-gateway support: PayU / Toucan / PineLabs ────────────────────────────
# All credential-bearing keys below use an empty-string env-var-only default — NO literal
# sandbox/production secret is ever committed here (same discipline as Razorpay's key-secret/
# webhook-secret above).
payment.gateway.payu.key=${PAYU_KEY:}
payment.gateway.payu.salt=${PAYU_SALT:}
payment.gateway.payu.salt-v1=${PAYU_SALT_V1:}
payment.gateway.payu.salt-v2=${PAYU_SALT_V2:}
payment.gateway.payu.payment-url=${PAYU_PAYMENT_URL:https://test.payu.in/_payment}
payment.gateway.payu.post-service-url=${PAYU_POST_SERVICE_URL:https://test.payu.in/merchant/postservice.php?form=2}
payment.gateway.payu.success-url=${PAYU_SUCCESS_URL:}
payment.gateway.payu.failure-url=${PAYU_FAILURE_URL:}
payment.gateway.payu.refund-callback-url=${PAYU_REFUND_CALLBACK_URL:}

payment.gateway.toucan.base-url=${TOUCAN_BASE_URL:https://pay.toucanpay.in}
payment.gateway.toucan.merchant-token=${TOUCAN_MERCHANT_TOKEN:}
payment.gateway.toucan.merchant-terminal=${TOUCAN_MERCHANT_TERMINAL:}
payment.gateway.toucan.merchant-number=${TOUCAN_MERCHANT_NUMBER:}

payment.gateway.pinelabs.base-url=${PINELABS_BASE_URL:https://pluraluat.v2.pinepg.in}
payment.gateway.pinelabs.merchant-id=${PINELABS_MERCHANT_ID:}
payment.gateway.pinelabs.client-id=${PINELABS_CLIENT_ID:}
payment.gateway.pinelabs.client-secret=${PINELABS_CLIENT_SECRET:}
payment.gateway.pinelabs.callback-url=${PINELABS_CALLBACK_URL:}

# ── Driver payment records (driver_payments) are history only: Payment no longer writes them; drivers' earnings live in
#    Rider_WalletService (docs/ACCOUNTING_REBUILD_PLAN.md, section 4) ──

# ── Outbound contract: Ride microservice ──────────────────────────────────────
app.ride-service.base-url=${RIDE_SERVICE_URL:http://localhost:9115}
rider.internal.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:local-rider-service-token}

# Durable payment-result and notification events are written to PostgreSQL first,
# then published by DurableEventOutbox with broker acknowledgements.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Durable outbox: rows per batch, time budget of one drain run (keep below the drain job's lockAtMostFor and the lease)
# and how long a claimed row stays hidden from other runs. The producer limits make every send settle (delivered or
# failed) within rider.outbox.send-timeout (max.block.ms + delivery.timeout.ms, checked at start-up), so a send the
# outbox recorded as failed can never be delivered later, after the next event of the same ride. Kafka requires
# delivery.timeout.ms >= linger.ms + request.timeout.ms.
rider.outbox.batch-size=${OUTBOX_BATCH_SIZE:200}
rider.outbox.batch-deadline=${OUTBOX_BATCH_DEADLINE:20s}
rider.outbox.lease=${OUTBOX_LEASE:30s}
rider.outbox.send-timeout=${OUTBOX_SEND_TIMEOUT:15s}
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:12000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:10000}
spring.kafka.producer.properties.linger.ms=${KAFKA_PRODUCER_LINGER_MS:5}

# ── Outbound contract: Notification microservice (NMS) ────────────────────────
# NMS mounts its notify endpoint at /api/nms/notify (no /api/v1 base) -- see NmsServiceClient.
app.nms-service.base-url=${NMS_SERVICE_URL:http://localhost:9111}

# Outbound WebClient timeout budget — fail fast rather than blocking a payment webhook
# response indefinitely on a slow Ride-service call.
rider.http-client.connect-timeout-ms=${HTTP_CLIENT_CONNECT_TIMEOUT_MS:3000}
rider.http-client.read-timeout-ms=${HTTP_CLIENT_READ_TIMEOUT_MS:5000}
rider.http-client.write-timeout-ms=${HTTP_CLIENT_WRITE_TIMEOUT_MS:5000}
rider.http-client.response-timeout-ms=${HTTP_CLIENT_RESPONSE_TIMEOUT_MS:5000}

# ── CORS ───────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ── Actuator ────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Deploy resilience: a restarted or stopped instance must leave and join the registry within seconds, not minutes
# (the defaults are a 30 s renewal, a 90 s expiry and a 30 s registry fetch). Shared by every service that registers.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5

# Finish in-flight requests, and deregister, before stopping on a deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── Fare verification: POST /payments must charge the ride's fare held by Rider_RideService ──
app.payment.fare-verification.enabled=${PAYMENT_FARE_VERIFICATION_ENABLED:true}
app.payment.fare-verification.tolerance-rupees=${PAYMENT_FARE_TOLERANCE_RUPEES:0.01}
app.razorpay.refund-timeout-seconds=${RAZORPAY_REFUND_TIMEOUT_SECONDS:30}

# ── Resilience (shared Rider_ResilientClient): Payment -> Ride lookups (GET, retried) ─────
rider.resilience.ride.call-timeout-ms=${RESILIENCE_RIDE_TIMEOUT_MS:5000}
rider.resilience.ride.max-attempts=${RESILIENCE_RIDE_MAX_ATTEMPTS:3}
rider.resilience.ride.max-concurrent-calls=${RESILIENCE_RIDE_MAX_CONCURRENT:25}
rider.resilience.ride.breaker-window-size=${RESILIENCE_RIDE_BREAKER_WINDOW:20}
rider.resilience.ride.breaker-minimum-calls=${RESILIENCE_RIDE_BREAKER_MIN_CALLS:10}
rider.resilience.ride.breaker-failure-rate-percent=${RESILIENCE_RIDE_BREAKER_FAILURE_PERCENT:50}
rider.resilience.ride.breaker-open-seconds=${RESILIENCE_RIDE_BREAKER_OPEN_SECONDS:15}

# Virtual threads for request handling: blocking WebClient/JDBC calls no longer pin platform threads.
spring.threads.virtual.enabled=true

# ── Payment-gateway audit trail: every gateway call and webhook is logged (payment_gateway_calls,
# payment_webhook_events) and queued in payment_audit_outbox; a scheduled job delivers the queue to
# Rider_AuditService (REALBOOM-AUDITSERVICE) in batches through the shared resilient client. An audit
# outage only delays delivery; it never affects a payment.
rider.audit.publish.enabled=${AUDIT_PUBLISH_ENABLED:true}
rider.audit.publish.url=${AUDIT_SERVICE_URL:http://localhost:9106}
rider.audit.publish.batch-size=${AUDIT_PUBLISH_BATCH_SIZE:100}
rider.audit.publish.interval-ms=${AUDIT_PUBLISH_INTERVAL_MS:5000}
rider.audit.publish.max-batches-per-run=${AUDIT_PUBLISH_MAX_BATCHES_PER_RUN:10}
rider.audit.publish.max-backoff-seconds=${AUDIT_PUBLISH_MAX_BACKOFF_SECONDS:300}
rider.audit.publish.published-retention-days=${AUDIT_PUBLISH_RETENTION_DAYS:7}
rider.audit.publish.purge-interval-ms=${AUDIT_PUBLISH_PURGE_INTERVAL_MS:3600000}
rider.resilience.audit.call-timeout-ms=${RESILIENCE_AUDIT_TIMEOUT_MS:5000}
rider.resilience.audit.max-attempts=${RESILIENCE_AUDIT_MAX_ATTEMPTS:3}
rider.resilience.audit.max-concurrent-calls=${RESILIENCE_AUDIT_MAX_CONCURRENT:5}
rider.resilience.audit.breaker-window-size=${RESILIENCE_AUDIT_BREAKER_WINDOW:20}
rider.resilience.audit.breaker-minimum-calls=${RESILIENCE_AUDIT_BREAKER_MIN_CALLS:10}
rider.resilience.audit.breaker-failure-rate-percent=${RESILIENCE_AUDIT_BREAKER_FAILURE_PERCENT:50}
rider.resilience.audit.breaker-open-seconds=${RESILIENCE_AUDIT_BREAKER_OPEN_SECONDS:30}

# -- Wallet: Rider_WalletService owns every balance and ledger entry. A verified top-up is credited there through one
# idempotent call (POST /internal/purchases, key = top-up id). Wallet refuses with 409 PURCHASE_DISABLED unless its
# railcab.wallet.purchase-enabled=true. That switch stays OFF until finance confirms it per environment; until then paid
# top-ups wait as PAID_AWAITING_CREDIT and the retry job credits them once it is switched on.
rider.wallet.base-url=${WALLET_SERVICE_URL:http://localhost:9121}/api/v1/wallet/internal
rider.wallet.app-code=${WALLET_APP_CODE:BESTRIDE_RIDER_APP}
rider.wallet.call-timeout-ms=${WALLET_CALL_TIMEOUT_MS:5000}
rider.wallet.max-attempts=${WALLET_MAX_ATTEMPTS:3}
rider.wallet.max-concurrent-calls=${WALLET_MAX_CONCURRENT_CALLS:25}
rider.wallet.breaker-open-seconds=${WALLET_BREAKER_OPEN_SECONDS:15}
rider.wallet.credit-retry-interval-ms=${WALLET_CREDIT_RETRY_INTERVAL_MS:30000}
rider.wallet.credit-retry-batch-size=${WALLET_CREDIT_RETRY_BATCH_SIZE:50}
rider.wallet.credit-retry-initial-backoff-seconds=${WALLET_CREDIT_RETRY_INITIAL_BACKOFF_SECONDS:30}
rider.wallet.credit-retry-max-backoff-seconds=${WALLET_CREDIT_RETRY_MAX_BACKOFF_SECONDS:3600}
rider.wallet.credit-alert-after-attempts=${WALLET_CREDIT_ALERT_AFTER_ATTEMPTS:10}

# -- Sale settlement (docs/FRANCHISE_PLAN.md step 8): a captured gateway payment settles its PENDING wallet sale
# (POST /internal/sales/{eventId}/settle, key sale-settle:<eventId>); a failed/expired one cancels it. Requests are stored
# with the payment change and sent by a ShedLock job. A settlement is sent only once its sale is booked: each run asks the
# wallet (POST /internal/sales/lookups, one read per organization) which sales exist; one not booked yet waits
# (await-sale-interval, no attempt counted) and is given up after await-sale-max-age. max-attempts counts real failures only.
rider.sale-settlement.enabled=${SALE_SETTLEMENT_ENABLED:true}
rider.sale-settlement.interval-ms=${SALE_SETTLEMENT_INTERVAL_MS:15000}
rider.sale-settlement.batch-size=${SALE_SETTLEMENT_BATCH_SIZE:100}
rider.sale-settlement.initial-backoff=${SALE_SETTLEMENT_INITIAL_BACKOFF:30s}
rider.sale-settlement.max-backoff=${SALE_SETTLEMENT_MAX_BACKOFF:1h}
rider.sale-settlement.max-attempts=${SALE_SETTLEMENT_MAX_ATTEMPTS:20}
rider.sale-settlement.await-sale-interval=${SALE_SETTLEMENT_AWAIT_SALE_INTERVAL:2m}
rider.sale-settlement.await-sale-max-age=${SALE_SETTLEMENT_AWAIT_SALE_MAX_AGE:P7D}
