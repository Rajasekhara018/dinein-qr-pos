# Production — no SQL logging, all secrets/URLs expected via environment variables.
logging.level.com.heuristiq.paymentservice=INFO

# Shared staging/production requirements. Values must come from the deployment environment.
jwt.secret=${JWT_SECRET}
spring.jpa.show-sql=false
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
rider.internal.service-token=${RIDER_INTERNAL_SERVICE_TOKEN}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG}

# Explicit wallet address; never silently call localhost in deployment.
rider.wallet.base-url=${WALLET_SERVICE_URL}/api/v1/wallet/internal
