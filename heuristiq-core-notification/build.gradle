plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.railcab'
version = '0.0.1'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories { mavenCentral() }

dependencies {
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // Core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // MongoDB
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // Publishes search-index events onto the shared Redis Stream 2026_RailCab_SearchAPI consumes
    // (see search.SearchEventPublisher) -- not used for caching in this service.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // Powers SearchIndexAspect (@Aspect/@AfterReturning) -- reindexes any SearchIndexable entity
    // right after ITemplateRepository.save(..)/saveAll(..). spring-boot-starter-aop was dropped
    // in Boot 4's modularization -- depend on aspectjweaver directly (version managed by the
    // Boot 4.1.0 BOM), same as UAM's SearchIndexAspect/BookingsAPI's IdempotencyAspect.
    implementation 'org.aspectj:aspectjweaver'

    // JPA + MySQL/Postgres (optional -- activate with spring.profiles.active=sql or =postgres)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Email (JavaMail / SMTP)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Kafka (async event consumer) -- Kafka auto-configuration (ConsumerFactory/ProducerFactory
    // beans from spring.kafka.* properties) is its own starter under Boot 4's modularization;
    // spring-kafka alone no longer pulls it in transitively.
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // In-process read caches (see docs/CACHING.md) -- same library and style as the API gateway's UserStatusCacheService.
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Service discovery -- registers with realboom-service-registry (Eureka). Spring Cloud
    // 2025.1.0's CompatibilityVerifier hard-fails on Boot 4.1.0 (see
    // spring.cloud.compatibility-verifier.enabled=false in application.properties).
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // Secrets management -- pulls jwt.secret from the local dev Vault instance
    // (docker-compose.vault.yml); see docs/design/Platform/SecretsManagement.md.
    implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'

    // Firebase Admin SDK (FCM push)
    implementation 'com.google.firebase:firebase-admin:9.4.1'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.14.0'

    // Twilio SDK (SMS + WhatsApp)
    implementation 'com.twilio.sdk:twilio:10.4.1'

    // AWS SES (email) — optional provider, activate with nms.provider.email=ses
    implementation platform('software.amazon.awssdk:bom:2.25.60')
    implementation 'software.amazon.awssdk:sesv2'

    // HTTP client for Meta WhatsApp Cloud API
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // Boot 4 ships WebClient.Builder auto-configuration as its own lean starter --
    // spring-boot-starter-webflux alone only pulls the reactive-server module and does NOT
    // register a WebClient.Builder bean, leaving every WebClient.Builder injection point
    // (NmsBeans.webClient) unsatisfiable. Same fix PaymentAPI already needed for the same reason.
    implementation 'org.springframework.boot:spring-boot-starter-webclient'

    // Resilience4j -- circuit breaker/retry/bulkhead around per-channel provider.send() calls
    // (replacing the hand-rolled ConcurrentHashMap circuit breaker + Semaphore rate limiter in
    // NotificationDispatchService). Same version/artifact PaymentAPI uses.
    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
    // Shared ResilientCaller + correlation-id propagation (composite build, see settings.gradle)
    implementation 'com.heuristiq:realboom-resilient-client'
    // Phone parsing/E.164/validation for any country (composite build, see settings.gradle)
    implementation 'com.heuristiq:realboom-phone'

    // Observability -- Prometheus scrape format for the actuator metrics endpoint, and Boot 4's
    // single official tracing starter (OTel API + Micrometer bridge + OTLP exporters + Boot's own
    // autoconfiguration glue -- a manually-assembled micrometer-tracing-bridge-otel +
    // opentelemetry-exporter-otlp combo silently has all the jars but none of Boot's
    // autoconfiguration for them, so no Tracer bean is ever created; this starter is the one that
    // actually works).
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

    // JWT — jjwt-jackson doesn't support Jackson 3 yet; keep Jackson 2 on the classpath
    // explicitly since Boot 4 no longer pulls it in by default.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'

    // Utilities
    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // A real MongoDB inside the test JVM for tests that start the whole application (no database needed on the build machine).
    testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring4x:4.24.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Real PostgreSQL for the migration test (downloads the binaries once; no Docker needed).
    testImplementation 'io.zonky.test:embedded-postgres:2.0.7'
    // The default binaries cover x86-64 only. This one lets the test also run on an ARM Linux build server; elsewhere it is not used.
    testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8:14.10.1'
    testRuntimeOnly 'com.h2database:h2'

    // Service Component Test pattern -- verifies the atomic DB-level constraints (idempotency-key
    // uniqueness / unique-index duplicate rejection) actually hold against a real MongoDB, not
    // just mocked unit-test logic. @Testcontainers(disabledWithoutDocker = true) on the test class
    // means CI/dev machines without Docker simply skip it rather than failing the build.
    //
    // Boot 4.1's dependency-management platform resolves the core 'org.testcontainers:testcontainers'
    // artifact to a nonexistent 2.0.5 -- 1.21.3 is the actual latest across all Testcontainers
    // modules on Maven Central, so all three are pinned explicitly to stay in one matched set.
    testImplementation('org.springframework.boot:spring-boot-testcontainers') {
        exclude group: 'org.testcontainers', module: 'testcontainers'
    }
    testImplementation 'org.testcontainers:testcontainers:1.21.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:mongodb:1.21.3'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.0'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
tasks.named('jar') { enabled = false }
tasks.named('javadoc') {
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.memberLevel = JavadocMemberLevel.PRIVATE
    failOnError = false
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += '-parameters' }

// Ships the javadoc inside the boot jar as static content, served publicly at
// /javadoc/index.html (through the gateway: /api/<service>/javadoc/).
tasks.named('bootJar') {
    from(tasks.named('javadoc')) {
        into 'BOOT-INF/classes/static/javadoc'
    }
}

// ── Code coverage (JaCoCo) ───────────────────────────────────────────────────────────────────────
// Run:  ./gradlew test jacocoTestReport      HTML report: build/reports/jacoco/test/html/index.html
//       (XML for CI/Sonar: build/reports/jacoco/test/jacocoTestReport.xml)
// Coverage is produced only when jacocoTestReport is asked for, so a plain `./gradlew test` is not slowed down.
jacoco {
    toolVersion = '0.8.13' // first line of releases with full Java 21+ support on current JDKs
}

tasks.named('jacocoTestReport') {
    // mustRunAfter, not dependsOn: as a finalizer of `test` it must still run when a test fails
    mustRunAfter tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// With -Pcoverage the report is written even when a test fails (known failures would otherwise stop `jacocoTestReport`).
// Without it a plain `./gradlew test` stays as fast as before.
tasks.named('test') {
    if (project.hasProperty('coverage') || gradle.startParameter.taskNames.any { it == 'coverage' || it.endsWith(':coverage') }) {
        finalizedBy tasks.named('jacocoTestReport')
    }
}

// One-word entry point: ./gradlew coverage  (runs the tests, then writes build/reports/jacoco/test/html/index.html even if a test fails)
tasks.register('coverage') {
    group = 'verification'
    description = 'Runs the tests and writes the JaCoCo coverage report (HTML + XML).'
    // jacocoTestReport is attached to `test` as a finalizer (see above), so it also runs when a test fails
    dependsOn tasks.named('test')
}
