# Activate this profile with spring.profiles.active=postgres
# Disables Mongo auto-configuration, enables JPA — same JPA entities/repositories as the
# "sql" (MySQL) profile; only the datasource URL/driver/dialect differ (see
# BroadcastJpaRepositoryAdapter et al., gated on nms.persistence.type in {mysql, postgres}).
# Every Mongo auto-configuration, not just DataMongo/Mongo: Boot 4 splits repository scanning into
# DataMongoRepositoriesAutoConfiguration, which otherwise still registers the *MongoSpringRepository
# interfaces and fails startup with "a bean named 'mongoTemplate' could not be found".
spring.autoconfigure.exclude[0]=org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.mongodb.autoconfigure.MongoReactiveAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration
spring.autoconfigure.exclude[3]=org.springframework.boot.mongodb.autoconfigure.health.MongoReactiveHealthContributorAutoConfiguration
spring.autoconfigure.exclude[4]=org.springframework.boot.mongodb.autoconfigure.metrics.MongoMetricsAutoConfiguration
spring.autoconfigure.exclude[5]=org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
spring.autoconfigure.exclude[6]=org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveAutoConfiguration
spring.autoconfigure.exclude[7]=org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
spring.autoconfigure.exclude[8]=org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveRepositoriesAutoConfiguration

nms.persistence.type=postgres

spring.datasource.url=${DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/railcab_nms}}
spring.datasource.username=${DATASOURCE_USERNAME:${DB_USER:rider}}
spring.datasource.password=${DATASOURCE_PASSWORD:${DB_PASS:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/postgres
spring.flyway.baseline-on-migrate=false
# Index migrations use CREATE INDEX CONCURRENTLY, which Flyway runs outside a transaction; with the default
# transaction-scoped Flyway lock that build would wait forever on Flyway's own open transaction.
spring.flyway.postgresql.transactional-lock=false
management.health.mongo.enabled=false
