spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/railcab_nms}
spring.mongodb.database=${MONGO_DB:railcab_nms}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP}}
spring.kafka.consumer.group-id=${NMS_KAFKA_GROUP_ID:railcab-nms-group}
spring.kafka.consumer.auto-offset-reset=earliest

nms.security.enabled=true
nms.security.internal-api-key=${NMS_INTERNAL_API_KEY}

nms.retry.attempts=${NMS_PROVIDER_RETRY_ATTEMPTS:3}
nms.retry.backoff-ms=${NMS_PROVIDER_RETRY_BACKOFF_MS:750}
nms.kafka.retry.attempts=${NMS_KAFKA_RETRY_ATTEMPTS:5}
nms.kafka.retry.backoff-ms=${NMS_KAFKA_RETRY_BACKOFF_MS:2000}
nms.kafka.topic.partitions=${NMS_KAFKA_TOPIC_PARTITIONS:6}
nms.kafka.topic.replication-factor=${NMS_KAFKA_TOPIC_REPLICATION_FACTOR:3}
nms.security.expose-docs=${NMS_SECURITY_EXPOSE_DOCS:false}
nms.http.connect-timeout-ms=${NMS_HTTP_CONNECT_TIMEOUT_MS:3000}
nms.http.read-timeout-ms=${NMS_HTTP_READ_TIMEOUT_MS:10000}
nms.http.max-connections=${NMS_HTTP_MAX_CONNECTIONS:200}
nms.rate-limit.email-concurrency=${NMS_RATE_EMAIL_CONCURRENCY:50}
nms.rate-limit.sms-concurrency=${NMS_RATE_SMS_CONCURRENCY:20}
nms.rate-limit.whatsapp-concurrency=${NMS_RATE_WHATSAPP_CONCURRENCY:20}
nms.rate-limit.push-concurrency=${NMS_RATE_PUSH_CONCURRENCY:100}
nms.audit.store-rendered-body=${NMS_AUDIT_STORE_RENDERED_BODY:false}
nms.audit.mask-recipients=${NMS_AUDIT_MASK_RECIPIENTS:true}
nms.audit.log-retention-days=${NMS_AUDIT_LOG_RETENTION_DAYS:90}
nms.idempotency.retry-failed-messages=${NMS_IDEMPOTENCY_RETRY_FAILED:true}
nms.idempotency.processing-timeout-minutes=${NMS_IDEMPOTENCY_PROCESSING_TIMEOUT_MINUTES:30}
nms.idempotency.message-retention-days=${NMS_IDEMPOTENCY_MESSAGE_RETENTION_DAYS:30}
nms.circuit-breaker.enabled=${NMS_CIRCUIT_BREAKER_ENABLED:true}
nms.circuit-breaker.failure-threshold=${NMS_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
nms.circuit-breaker.reset-timeout-ms=${NMS_CIRCUIT_BREAKER_RESET_TIMEOUT_MS:60000}

# Firebase FCM
nms.firebase.enabled=${FIREBASE_ENABLED:false}
nms.firebase.credentials-path=${FCM_CREDENTIALS_PATH:classpath:firebase-service-account.json}
nms.firebase.project-id=${FIREBASE_PROJECT_ID:}

# Only health/info/prometheus are exposed: heapdump/env/threaddump/configprops etc. reveal
# secrets (JWT secret, DB passwords, tokens) and a heap dump needs about the heap's size in
# extra memory, enough to get a 512m container OOM-killed. Take dumps from inside the host.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.heapdump.access=none
management.endpoint.health.probes.enabled=true
management.health.kafka.enabled=true
management.health.mongo.enabled=true

