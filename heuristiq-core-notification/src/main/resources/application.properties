spring.application.name=RealBoom-NMS
# Written to a shared repo-root logs/ directory so Promtail (docker-compose.logging.yml) can
# tail it and ship every line to Loki -- centralized logging.
logging.file.name=${LOG_FILE:../logs/nms.log}
# Was hardcoded to 9005 in the source repo (2026_RailCab_NMS) -- that collides with
# Rider_AdminAPI's actual port 9005 in bestride-rider-app, so this copy moves NMS to 9111
# and makes it env-overridable, matching the rest of this file's pattern.
server.port=${NMS_PORT:9111}
# Trusts X-Forwarded-* headers from the ApiGateway (X-Forwarded-Prefix specifically) so springdoc
# computes the correct externally-reachable server URL in this service's OpenAPI spec -- see the
# centralized Swagger aggregator in ApiGateway's application.properties (springdoc.swagger-ui.urls).
server.forward-headers-strategy=framework

# Service discovery (Eureka) -- registers with realboom-service-registry so the ApiGateway can
# route by service ID instead of a hardcoded URL. Required because this service is on Spring Boot
# 4.1.0 while Spring Cloud 2025.1.0's CompatibilityVerifier only officially supports 4.0.x.
spring.cloud.compatibility-verifier.enabled=false
# EUREKA_URL, if set, overrides this entirely (include your own credentials in it). Otherwise
# the default embeds the shared Eureka Basic-Auth credentials (see EurekaSecurityConfig in
# 2026_RailCab_ServiceRegistry) via the same Vault-priority chain used elsewhere in this file.
# Defaults to ON -- registers with ServiceRegistry at startup; Eureka registration failure is
# non-fatal (the service still starts even if no registry is reachable), so expect
# connection-refused log noise if ServiceRegistry isn't running. Set SERVICE_DISCOVERY_ENABLED=false
# to disable the Eureka client entirely.
railcab.service.discovery.enabled=${SERVICE_DISCOVERY_ENABLED:true}
eureka.client.enabled=${railcab.service.discovery.enabled}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${eureka-username:${EUREKA_USERNAME}}:${eureka-password:${EUREKA_PASSWORD}}@localhost:9100/eureka/}
eureka.instance.prefer-ip-address=true

# Deploy resilience: a restarted or stopped instance must leave and join the registry within seconds, not minutes
# (the defaults are a 30 s renewal, a 90 s expiry and a 30 s registry fetch). Shared by every service that registers.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5

# Finish in-flight requests, and deregister, before stopping on a deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
eureka.instance.metadata-map.zone=${SERVICE_ZONE:region1}

# ── Observability ─────────────────────────────────────────────────────────────
logging.pattern.level=%5p [%X{correlationId:-}]
# Only health/info/prometheus are exposed: heapdump/env/threaddump/configprops etc. reveal
# secrets (JWT secret, DB passwords, tokens) and a heap dump needs about the heap's size in
# extra memory, enough to get a 512m container OOM-killed. Take dumps from inside the host.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.heapdump.access=none
management.endpoint.health.probes.enabled=true

# Propagates W3C trace context (traceparent header) across every instrumented HTTP boundary --
# incoming requests, outbound calls to UAM/email/SMS/WhatsApp vendors (NmsBeans.webClient) --
# independent of whether a collector is reachable at the endpoint below. Like Mongo/health checks
# elsewhere, a missing/unreachable collector only drops exported spans (logged, async,
# non-blocking); it never blocks a request or boot. 10% sampling by default.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
# management.otlp.tracing.endpoint is deprecated at error level since Boot 4.0 (silently does
# nothing) -- management.opentelemetry.tracing.export.otlp.endpoint is the real property name.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics: Prometheus scrape only (/actuator/prometheus) -- OTLP metrics push disabled. Tracing
# still goes over OTLP above; spring-boot-starter-opentelemetry pulls in micrometer-registry-otlp
# and defaults this to true, which was never an intentional metrics path.
management.otlp.metrics.export.enabled=false
# Histogram buckets for http.server.requests -- needed so Prometheus's histogram_quantile() can
# compute p95/p99 latency per endpoint (Grafana golden-signals dashboard/alerts); a plain Timer
# alone only exports count/sum, no distribution.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Virtual threads for request handling (Tomcat) and dispatch (DispatchConfig.notificationExecutor)
# -- notification sends spend most of their time blocked on third-party provider HTTP I/O, which
# is what virtual threads are for.
spring.threads.virtual.enabled=true

# ── Database profile (mongo | sql) ──────────────────────────────────────────
# Set to "sql" to switch to MySQL/JPA persistence for all NMS tables.
spring.profiles.active=mongo

# Max FCM device registrations kept per user; the least recently active are dropped beyond this.
nms.push.max-tokens-per-user=${NMS_PUSH_MAX_TOKENS_PER_USER:10}

# Repository-adapter selection for the four NMS aggregates (log/message/template/event):
# mongo (default) or mysql. Must stay in lockstep with spring.profiles.active/
# spring.autoconfigure.exclude above and below -- the "sql" profile
# (application-sql.properties) flips this to mysql and un-excludes JPA/DataSource
# autoconfiguration atomically. Do not set this independently.
nms.persistence.type=mongo

# ── MongoDB ───────────────────────────────────────────────────────────────────
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/railcab_nms}
spring.mongodb.database=${MONGO_DB:railcab_nms}

# Mongo driver connection-pool sizing -- see MongoPoolConfig. Applies only when
# nms.persistence.type=mongo (the default).
nms.mongo.pool.min-size=${NMS_MONGO_POOL_MIN_SIZE:10}
nms.mongo.pool.max-size=${NMS_MONGO_POOL_MAX_SIZE:100}
nms.mongo.pool.wait-queue-timeout-ms=${NMS_MONGO_POOL_WAIT_TIMEOUT_MS:5000}

spring.autoconfigure.exclude[0]=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# ── MySQL/JPA (activated when spring.profiles.active=sql) ───────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/railcab_nms}
# Small pool: normal traffic needs a handful of connections, and each idle one holds
# buffers and a thread (see also Postgres max_connections across all services).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
spring.kafka.consumer.group-id=railcab-nms-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
nms.kafka.topic.notification-events=railcab-notification-events
# Answers of automated voice calls (digit pressed / outcome), consumed by Rider_RideService
nms.kafka.topic.voice-responses=${NMS_KAFKA_TOPIC_VOICE_RESPONSES:nms-voice-responses}

# ── Email / SMTP ──────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
nms.email.from=${MAIL_FROM:noreply@realboom.in}

# ── Twilio ────────────────────────────────────────────────────────────────────
nms.twilio.account-sid=${TWILIO_SID:}
nms.twilio.auth-token=${TWILIO_TOKEN:}
nms.twilio.sms-from=${TWILIO_SMS_FROM:}
nms.twilio.whatsapp-from=${TWILIO_WA_FROM:whatsapp:+14155238886}

# ── Meta WhatsApp Cloud API ───────────────────────────────────────────────────
nms.meta.whatsapp.api-url=${META_WA_URL:https://graph.facebook.com/v22.0/{phone_number_id}/messages}
nms.meta.whatsapp.phone-number-id=${META_WA_PHONE_ID:}
nms.meta.whatsapp.token=${META_WA_TOKEN:}

# ── Firebase / FCM ────────────────────────────────────────────────────────────
nms.firebase.credentials-path=${FIREBASE_CREDENTIALS:/firebase-service-account.json}
nms.firebase.project-id=${FIREBASE_PROJECT_ID:}
nms.firebase.enabled=${FIREBASE_ENABLED:false}

# ── Mailgun REST API (used when nms.provider.email=mailgun) ──────────────────
nms.mailgun.api-key=${MAILGUN_API_KEY:}
nms.mailgun.domain=${MAILGUN_DOMAIN:}
nms.mailgun.from=${MAILGUN_FROM:noreply@realboom.in}
nms.ses.from-address=${SES_FROM_ADDRESS:noreply@realboom.in}
nms.ses.from-name=${SES_FROM_NAME:${nms.branding.name:RealBoom}}
nms.mailgun.api-url=https://api.mailgun.net/v3

# ── Digimile Bulk SMS (used when nms.provider.sms=digimile) ──────────────────
nms.digimile.username=${DIGIMILE_USERNAME:}
nms.digimile.password=${DIGIMILE_PASSWORD:}
nms.digimile.url=${DIGIMILE_URL:https://rslri.connectbind.com:8443/bulksms/bulksms?}
nms.digimile.sender-id=${DIGIMILE_SENDER:RAILCB}
nms.digimile.entity-id=${DIGIMILE_ENTITY_ID:}

# ── Provider switches ─────────────────────────────────────────────────────────
# email   : smtp | mailgun
# sms     : twilio | digimile
# whatsapp: twilio | meta
# push    : fcm
# voice   : exotel | none (none = VOICE channel off, attempts recorded as NOT_CONFIGURED)
nms.provider.email=smtp
nms.provider.sms=twilio
nms.provider.whatsapp=twilio
nms.provider.push=fcm
nms.provider.voice=${NMS_PROVIDER_VOICE:none}

# ── Exotel voice calls (used when nms.provider.voice=exotel) ─────────────────
# Credentials only from the environment. status-callback-url = the PUBLIC gateway URL of
# /api/v1/nms/callbacks/voice/exotel; NMS adds nms:<NMS_VOICE_CALLBACK_SECRET>@ to it as basic credentials.
nms.voice.exotel.account-sid=${EXOTEL_ACCOUNT_SID:}
nms.voice.exotel.api-key=${EXOTEL_API_KEY:}
nms.voice.exotel.api-token=${EXOTEL_API_TOKEN:}
nms.voice.exotel.subdomain=${EXOTEL_SUBDOMAIN:api.exotel.com}
nms.voice.exotel.caller-id=${EXOTEL_CALLER_ID:}
nms.voice.exotel.flow-id=${EXOTEL_FLOW_ID:}
nms.voice.exotel.status-callback-url=${EXOTEL_STATUS_CALLBACK_URL:}
nms.voice.exotel.connect-timeout-ms=${EXOTEL_CONNECT_TIMEOUT_MS:3000}
nms.voice.exotel.read-timeout-ms=${EXOTEL_READ_TIMEOUT_MS:10000}

# Production controls
nms.retry.attempts=${NMS_PROVIDER_RETRY_ATTEMPTS:3}
nms.retry.backoff-ms=${NMS_PROVIDER_RETRY_BACKOFF_MS:500}
nms.kafka.retry.attempts=${NMS_KAFKA_RETRY_ATTEMPTS:3}
nms.kafka.retry.backoff-ms=${NMS_KAFKA_RETRY_BACKOFF_MS:1000}
nms.kafka.topic.partitions=${NMS_KAFKA_TOPIC_PARTITIONS:3}
nms.kafka.topic.replication-factor=${NMS_KAFKA_TOPIC_REPLICATION_FACTOR:1}
# Secure by default -- was false, meaning every endpoint (send email/SMS/WhatsApp/push, view
# message logs, broadcasts) was wide open with zero auth unless an operator remembered to flip
# this on. NmsSecurityConfig's permitAll-everything branch only exists for local dev now; set
# NMS_SECURITY_ENABLED=false explicitly if you genuinely need it off.
nms.security.enabled=${NMS_SECURITY_ENABLED:true}
# Vault-contributed property (see spring.cloud.vault.* above) takes priority; falls back to the
# plain env var. Required (no blank default) since NmsAuthenticationFilter's API-key auth path
# just returns false when this is blank -- silently leaving callers to fall through to the
# bearer-JWT path only, an easy-to-miss gap now that security is enabled by default.
nms.security.internal-api-key=${internal-api-key:${NMS_INTERNAL_API_KEY}}
nms.security.expose-docs=${NMS_SECURITY_EXPOSE_DOCS:true}
nms.http.connect-timeout-ms=${NMS_HTTP_CONNECT_TIMEOUT_MS:5000}
nms.http.read-timeout-ms=${NMS_HTTP_READ_TIMEOUT_MS:10000}
nms.http.max-connections=${NMS_HTTP_MAX_CONNECTIONS:100}
nms.rate-limit.email-concurrency=${NMS_RATE_EMAIL_CONCURRENCY:20}
nms.rate-limit.sms-concurrency=${NMS_RATE_SMS_CONCURRENCY:10}
nms.rate-limit.whatsapp-concurrency=${NMS_RATE_WHATSAPP_CONCURRENCY:10}
nms.rate-limit.push-concurrency=${NMS_RATE_PUSH_CONCURRENCY:50}
nms.rate-limit.in-app-concurrency=${NMS_RATE_IN_APP_CONCURRENCY:50}
nms.rate-limit.voice-concurrency=${NMS_RATE_VOICE_CONCURRENCY:5}
nms.audit.store-rendered-body=${NMS_AUDIT_STORE_RENDERED_BODY:false}
nms.audit.mask-recipients=${NMS_AUDIT_MASK_RECIPIENTS:true}
nms.audit.log-retention-days=${NMS_AUDIT_LOG_RETENTION_DAYS:90}
nms.idempotency.retry-failed-messages=${NMS_IDEMPOTENCY_RETRY_FAILED:true}
nms.idempotency.processing-timeout-minutes=${NMS_IDEMPOTENCY_PROCESSING_TIMEOUT_MINUTES:30}
nms.idempotency.message-retention-days=${NMS_IDEMPOTENCY_MESSAGE_RETENTION_DAYS:30}
nms.circuit-breaker.enabled=${NMS_CIRCUIT_BREAKER_ENABLED:true}
nms.circuit-breaker.failure-threshold=${NMS_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
nms.circuit-breaker.reset-timeout-ms=${NMS_CIRCUIT_BREAKER_RESET_TIMEOUT_MS:60000}

# In-process read caches (see docs/CACHING.md). NMS_CACHE_ENABLED=false makes every cache a pass-through.
nms.cache.enabled=${NMS_CACHE_ENABLED:true}
nms.cache.organization-profile.enabled=${NMS_CACHE_ORGANIZATION_PROFILE_ENABLED:true}
nms.cache.organization-profile.ttl-seconds=${NMS_CACHE_ORGANIZATION_PROFILE_TTL_SECONDS:300}
nms.cache.organization-profile.not-found-ttl-seconds=${NMS_CACHE_ORGANIZATION_PROFILE_NOT_FOUND_TTL_SECONDS:30}
nms.cache.organization-profile.max-size=${NMS_CACHE_ORGANIZATION_PROFILE_MAX_SIZE:500}
nms.cache.template.enabled=${NMS_CACHE_TEMPLATE_ENABLED:true}
nms.cache.template.ttl-seconds=${NMS_CACHE_TEMPLATE_TTL_SECONDS:60}
nms.cache.template.not-found-ttl-seconds=${NMS_CACHE_TEMPLATE_NOT_FOUND_TTL_SECONDS:15}
nms.cache.template.max-size=${NMS_CACHE_TEMPLATE_MAX_SIZE:1000}

# Retention cleanup sweep (see RetentionCleanupScheduler). No-op on the Mongo adapters, which
# already expire nms_logs/nms_messages natively via TTL indexes; runs the actual bulk delete
# on JPA/MySQL, which has no TTL equivalent.
nms.retention.cleanup-cron=${NMS_RETENTION_CLEANUP_CRON:0 30 2 * * *}

# ── Resilience4j: circuit breaker / bulkhead / retry per notification channel ────────────────
# Replaces the previous hand-rolled ConcurrentHashMap circuit breaker and raw Semaphore rate
# limiter in NotificationDispatchService (see ChannelResilienceDecorator) -- same battle-tested
# library PaymentAPI uses for its gateway calls. Values still come from nms.circuit-breaker.*/
# nms.rate-limit.*/nms.retry.* above (the single source of truth), just applied through
# Resilience4j instead of custom state machines.
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=${nms.circuit-breaker.failure-threshold}
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=${nms.circuit-breaker.reset-timeout-ms}ms
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.email.base-config=default
resilience4j.circuitbreaker.instances.sms.base-config=default
resilience4j.circuitbreaker.instances.whatsapp.base-config=default
resilience4j.circuitbreaker.instances.fcm_push.base-config=default
resilience4j.circuitbreaker.instances.in_app.base-config=default
resilience4j.circuitbreaker.instances.voice.base-config=default

resilience4j.bulkhead.instances.email.max-concurrent-calls=${nms.rate-limit.email-concurrency}
resilience4j.bulkhead.instances.sms.max-concurrent-calls=${nms.rate-limit.sms-concurrency}
resilience4j.bulkhead.instances.whatsapp.max-concurrent-calls=${nms.rate-limit.whatsapp-concurrency}
resilience4j.bulkhead.instances.fcm_push.max-concurrent-calls=${nms.rate-limit.push-concurrency}
resilience4j.bulkhead.instances.in_app.max-concurrent-calls=${nms.rate-limit.in-app-concurrency}
resilience4j.bulkhead.instances.voice.max-concurrent-calls=${nms.rate-limit.voice-concurrency}

resilience4j.retry.configs.default.max-attempts=${nms.retry.attempts}
resilience4j.retry.configs.default.wait-duration=${nms.retry.backoff-ms}ms
resilience4j.retry.instances.email.base-config=default
resilience4j.retry.instances.sms.base-config=default
resilience4j.retry.instances.whatsapp.base-config=default
resilience4j.retry.instances.fcm_push.base-config=default
resilience4j.retry.instances.in_app.base-config=default
# A voice call is never retried: a retry would ring the customer a second time.
resilience4j.retry.instances.voice.max-attempts=1

# ── JWT ───────────────────────────────────────────────────────────────────────
# Must match UAM's railcab.uam.auth.jwt-secret (2026_RailCab_UAM) so tokens issued by UAM
# validate here -- was a distinct placeholder default, silently failing HMAC verification of
# real UAM tokens in default/dev config (WebSocket in-app-notification auth, and this service's
# own outbound calls to UAM) whenever JWT_SECRET isn't set via env var.
# Vault-contributed property (see spring.cloud.vault.* below) takes priority; falls back to the
# plain env var so this still works in an environment where Vault isn't configured yet.
jwt.secret=${jwt-secret:${JWT_SECRET}}

# Secrets management (see docs/design/Platform/SecretsManagement.md). Vault connection + config-
# import now live in application-vault.properties, an opt-in profile -- activate with
# --spring.profiles.active=<env>,vault to source secrets from Vault; omit it to use plain env vars
# (e.g. Kubernetes Secrets via secretKeyRef) instead.
# spring.cloud.vault.enabled gates ALL of Spring Cloud Vault's autoconfiguration (config-import,
# health indicator, everything) and defaults to true when absent -- without setting it false here,
# VaultAutoConfiguration still tries to build a VaultTemplate with no host/token configured at all
# and fails hard at startup whenever the vault profile is NOT active. application-vault.properties
# flips this back to true when that profile IS active.
spring.cloud.vault.enabled=false
jwt.expiry-days=7

# ── OpenAPI ───────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ── WebSocket STOMP broker relay (in-app notifications) ──────────────────────
# Off by default -- Spring's in-memory simple broker, single-instance only (fine for one NMS
# replica). Set nms.websocket.relay.enabled=true once a STOMP-capable broker is provisioned
# (e.g. RabbitMQ with the rabbitmq_stomp plugin, default port 61613) to relay /topic and /queue
# across all NMS replicas -- required once NMS runs with replicas > 1 (see WebSocketConfig).
nms.websocket.relay.enabled=${NMS_WEBSOCKET_RELAY_ENABLED:false}
nms.websocket.relay.host=${NMS_WEBSOCKET_RELAY_HOST:localhost}
nms.websocket.relay.port=${NMS_WEBSOCKET_RELAY_PORT:61613}
nms.websocket.relay.client-login=${NMS_WEBSOCKET_RELAY_CLIENT_LOGIN:guest}
nms.websocket.relay.client-passcode=${NMS_WEBSOCKET_RELAY_CLIENT_PASSCODE:guest}
nms.websocket.relay.system-login=${NMS_WEBSOCKET_RELAY_SYSTEM_LOGIN:guest}
nms.websocket.relay.system-passcode=${NMS_WEBSOCKET_RELAY_SYSTEM_PASSCODE:guest}

# Search indexing -- publishes notification-template snapshots onto a Redis Stream consumed by
# 2026_RailCab_SearchAPI (see search.SearchEventPublisher/SearchIndexAspect). This Redis
# connection is the shared cross-service stream bus, not a cache -- in any environment where
# BookingsAPI/AdminAPI/UAM/DMS/SearchAPI also publish/consume this stream, point ALL of their
# Redis configs at the same broker.
railcab.search.redis.host=${SEARCH_REDIS_HOST:localhost}
railcab.search.redis.port=${SEARCH_REDIS_PORT:6379}
railcab.search.stream.name=${SEARCH_INDEX_STREAM_NAME:railcab:search:index-stream}

# Web lists the Rider_Web nms screens read from search (WEB_NMS_TEMPLATE, WEB_NMS_EVENT_TEMPLATE, WEB_NMS_EVENT,
# WEB_NMS_BROADCAST; contracts in search/web-list-models.json, copied from Rider_SearchAPI). They are read through NMS's own
# list endpoints, one partition per organization NMS holds records for (plus "default"), and POSTed to Rider_SearchAPI's
# ingestion endpoint (/api/v1/search/internal/projections) with X-Rider-Service-Token -- separate from the Redis stream above.
# Every SEARCH_WEB_LISTS_REFRESH_MS (default 10 min, first run SEARCH_WEB_LISTS_INITIAL_DELAY_MS = 60 s after start) on one
# background thread, and SEARCH_WEB_LISTS_CHANGE_DELAY_MS (2 s) after a successful POST/PUT/PATCH/DELETE to the lists' APIs.
# Env vars: SEARCH_API_BASE_URL (Rider_SearchAPI, e.g. http://rider-searchapi:9116), RIDER_INTERNAL_SERVICE_TOKEN (shared
# service token; while blank nothing is sent and each run logs why), SEARCH_WEB_LISTS_ENABLED (true).
railcab.search.base-url=${SEARCH_API_BASE_URL:http://localhost:9116}
railcab.search.web-lists.enabled=${SEARCH_WEB_LISTS_ENABLED:true}
railcab.search.web-lists.base-url=${railcab.search.base-url}
railcab.search.web-lists.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}
railcab.search.web-lists.refresh-ms=${SEARCH_WEB_LISTS_REFRESH_MS:600000}
railcab.search.web-lists.initial-delay-ms=${SEARCH_WEB_LISTS_INITIAL_DELAY_MS:60000}
railcab.search.web-lists.change-delay-ms=${SEARCH_WEB_LISTS_CHANGE_DELAY_MS:2000}

# ── Communication audit (COMMUNICATION events -> Rider_AuditService) ──────────────────────────
# Every delivery attempt and every provider status update is queued in the nms_audit_outbox
# table/collection and pushed by a scheduled drain (see AuditOutboxService). Never blocks or fails a
# send. The audit service is idempotent on eventId (attemptId[_STATUS]). Behind Eureka set the URL to
# the load-balanced name (REALBOOM-AUDITSERVICE) only if a load-balanced WebClient is wired; the default
# is the direct URL. The service token is the shared RIDER_INTERNAL_SERVICE_TOKEN; while it is blank
# events stay queued (and an error is logged once) instead of NMS failing to start.
nms.audit.publish.enabled=${NMS_AUDIT_PUBLISH_ENABLED:true}
nms.audit.publish.url=${NMS_AUDIT_PUBLISH_URL:http://localhost:9106}
nms.audit.publish.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}
nms.audit.publish.batch-size=${NMS_AUDIT_PUBLISH_BATCH_SIZE:100}
nms.audit.publish.interval-ms=${NMS_AUDIT_PUBLISH_INTERVAL_MS:5000}
nms.audit.publish.lease-seconds=${NMS_AUDIT_PUBLISH_LEASE_SECONDS:60}
nms.audit.publish.max-attempts=${NMS_AUDIT_PUBLISH_MAX_ATTEMPTS:20}

# Service-to-service endpoints (/api/v1/nms/internal/**, e.g. the application readiness facts Rider_UAM asks for): open only
# to X-Rider-Service-Token (the shared RIDER_INTERNAL_SERVICE_TOKEN) or a SERVICE-role JWT, never to the NMS API key the
# gateway adds. Blank token = only the JWT is accepted. The readiness evaluation answers within the time budget.
nms.internal-auth.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}
nms.readiness.time-budget=${NMS_READINESS_TIME_BUDGET:2s}
nms.audit.publish.retry-initial-backoff-seconds=${NMS_AUDIT_PUBLISH_RETRY_INITIAL_SECONDS:15}
nms.audit.publish.retry-max-backoff-seconds=${NMS_AUDIT_PUBLISH_RETRY_MAX_SECONDS:900}
nms.audit.publish.outbox-retention-days=${NMS_AUDIT_PUBLISH_OUTBOX_RETENTION_DAYS:7}
nms.audit.publish.call-timeout-ms=${NMS_AUDIT_PUBLISH_CALL_TIMEOUT_MS:3000}
nms.audit.publish.call-max-attempts=${NMS_AUDIT_PUBLISH_CALL_MAX_ATTEMPTS:3}

# ── Inbound provider delivery receipts (/api/v1/nms/callbacks/**) ─────────────────────────────
# Each endpoint refuses everything until its own secret is set. These paths must be public at the
# API gateway (providers carry no user token); authentication happens here.
#  shared-secret      : header X-NMS-Callback-Secret for /digimile/sms and /generic
#  twilio-callback-url: the exact public URL given to Twilio (signature input + per-message StatusCallback)
#  meta-*             : Meta app secret (X-Hub-Signature-256) and the webhook verify token
#  mailgun-signing-key: Mailgun HTTP webhook signing key
nms.callbacks.shared-secret=${NMS_CALLBACK_SHARED_SECRET:}
nms.callbacks.twilio-callback-url=${NMS_CALLBACK_TWILIO_URL:}
nms.callbacks.meta-app-secret=${NMS_CALLBACK_META_APP_SECRET:}
nms.callbacks.meta-verify-token=${NMS_CALLBACK_META_VERIFY_TOKEN:}
nms.callbacks.mailgun-signing-key=${NMS_CALLBACK_MAILGUN_SIGNING_KEY:}
# Voice-only secret for /api/v1/nms/callbacks/voice/exotel (sent to Exotel inside the callback URL, so never the shared secret above).
nms.callbacks.voice-shared-secret=${NMS_VOICE_CALLBACK_SECRET:}
