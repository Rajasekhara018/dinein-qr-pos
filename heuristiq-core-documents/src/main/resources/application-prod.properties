spring.application.name=RealBoom-DMS
server.port=${DMS_PORT:9104}

spring.data.mongodb.uri=${DMS_MONGO_URI}
spring.data.mongodb.auto-index-creation=true

gateway-forward-key=${GATEWAY_FORWARD_KEY:railcab-gateway-forward-secret-change-in-production}

railcab.dms.security.enforce-owner-access=${DMS_ENFORCE_OWNER_ACCESS:true}
railcab.dms.security.download-token-secret=${DMS_DOWNLOAD_TOKEN_SECRET:railcab-dms-download-token-secret-change-in-production}
railcab.dms.security.download-token-ttl-seconds=${DMS_DOWNLOAD_TOKEN_TTL_SECONDS:300}

railcab.dms.storage.provider=${DMS_STORAGE_PROVIDER:local}
railcab.dms.storage.local-root=${DMS_LOCAL_ROOT:uploads/documents}
railcab.dms.storage.public-base-url=${DMS_PUBLIC_BASE_URL:/api/v1/dms/documents}
railcab.dms.storage.operation-timeout-seconds=${DMS_STORAGE_OPERATION_TIMEOUT_SECONDS:30}
railcab.dms.storage.attempt-timeout-seconds=${DMS_STORAGE_ATTEMPT_TIMEOUT_SECONDS:10}
# Encryption at rest (server-side). mode: NONE | SSE_S3 | SSE_KMS. SSE_KMS needs kms-key-id (S3/MinIO key id or ARN; GCP full
# key resource name). The local provider stores plaintext, so any mode other than NONE fails startup there; Azure encrypts
# with provider-managed keys and rejects SSE_KMS. require-encryption=true fails startup unless the provider is not local
# and mode is not NONE (on by default in the prod profile).
railcab.dms.storage.encryption.mode=${DMS_STORAGE_ENCRYPTION_MODE:NONE}
railcab.dms.storage.encryption.kms-key-id=${DMS_STORAGE_KMS_KEY_ID:}
railcab.dms.storage.require-encryption=${DMS_STORAGE_REQUIRE_ENCRYPTION:true}

railcab.dms.scan.enabled=${DMS_SCAN_ENABLED:true}
railcab.dms.scan.provider=${DMS_SCAN_PROVIDER:basic}
railcab.dms.scan.blocked-extensions=.exe,.dll,.bat,.cmd,.js,.sh,.jar
railcab.dms.scan.blocked-content-types=application/x-msdownload,application/x-sh,application/java-archive
railcab.dms.scan.metadefender.api-key=${DMS_METADEFENDER_API_KEY:}
railcab.dms.scan.metadefender.fail-open=${DMS_METADEFENDER_FAIL_OPEN:false}

railcab.dms.lifecycle.default-retention-days=${DMS_DEFAULT_RETENTION_DAYS:0}
railcab.dms.lifecycle.purge-job-enabled=${DMS_PURGE_JOB_ENABLED:true}
railcab.dms.lifecycle.purge-job-cron=${DMS_PURGE_JOB_CRON:0 0 2 * * *}
railcab.dms.lifecycle.purge-deleted-after-days=${DMS_PURGE_DELETED_AFTER_DAYS:30}

railcab.dms.storage.aws-s3.region=${DMS_AWS_REGION:ap-south-1}
railcab.dms.storage.aws-s3.bucket-name=${DMS_AWS_BUCKET:railcab-documents}
railcab.dms.storage.aws-s3.access-key=${DMS_AWS_ACCESS_KEY:}
railcab.dms.storage.aws-s3.secret-key=${DMS_AWS_SECRET_KEY:}

railcab.dms.storage.minio.endpoint=${DMS_MINIO_ENDPOINT:}
railcab.dms.storage.minio.region=${DMS_MINIO_REGION:us-east-1}
railcab.dms.storage.minio.bucket-name=${DMS_MINIO_BUCKET:railcab-documents}
railcab.dms.storage.minio.access-key=${DMS_MINIO_ACCESS_KEY:}
railcab.dms.storage.minio.secret-key=${DMS_MINIO_SECRET_KEY:}

railcab.dms.storage.azure-blob.connection-string=${DMS_AZURE_CONNECTION_STRING:}
railcab.dms.storage.azure-blob.container-name=${DMS_AZURE_CONTAINER:documents}

railcab.dms.storage.gcp.bucket-name=${DMS_GCP_BUCKET:railcab-documents}

railcab.dms.validation.max-file-size-bytes=${DMS_MAX_FILE_SIZE_BYTES:10485760}
railcab.dms.validation.allowed-extensions=.pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.csv,.txt
railcab.dms.validation.allowed-content-types=application/pdf,image/png,image/jpeg,image/webp,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/plain

spring.servlet.multipart.max-file-size=${DMS_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${DMS_MULTIPART_MAX_REQUEST_SIZE:25MB}

# Only health/info/prometheus are exposed: heapdump/env/threaddump/configprops etc. reveal
# secrets (JWT secret, DB passwords, tokens) and a heap dump needs about the heap's size in
# extra memory, enough to get a 512m container OOM-killed. Take dumps from inside the host.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.prometheus.metrics.export.enabled=true

logging.pattern.level=%5p correlationId=%X{correlationId:-}

# ── Central audit (document events -> Rider_AuditService, DOMAIN events) ──────────────────────────────────────────────
# Every upload, rejected upload, scan result, download link, delete, legal hold and purge is queued in the dms_audit_outbox
# collection/table and pushed to Rider_AuditService by a scheduled drain (leased per event, retried with backoff, dropped
# after the retention). Publishing never fails or slows the request. The audit service is idempotent on eventId.
# Found through Eureka (discovery-url) unless base-url is given. Events stay queued while the service token is blank.
railcab.dms.audit.publish.enabled=${DMS_AUDIT_PUBLISH_ENABLED:true}
railcab.dms.audit.publish.base-url=${DMS_AUDIT_PUBLISH_URL:}
railcab.dms.audit.publish.discovery-url=${DMS_AUDIT_DISCOVERY_URL:http://RealBoom-AuditService}
railcab.dms.audit.publish.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}
railcab.dms.audit.publish.batch-size=${DMS_AUDIT_PUBLISH_BATCH_SIZE:100}
railcab.dms.audit.publish.interval-ms=${DMS_AUDIT_PUBLISH_INTERVAL_MS:5000}
railcab.dms.audit.publish.lease-seconds=${DMS_AUDIT_PUBLISH_LEASE_SECONDS:60}
railcab.dms.audit.publish.max-attempts=${DMS_AUDIT_PUBLISH_MAX_ATTEMPTS:20}
railcab.dms.audit.publish.retry-initial-backoff-seconds=${DMS_AUDIT_PUBLISH_RETRY_INITIAL_SECONDS:15}
railcab.dms.audit.publish.retry-max-backoff-seconds=${DMS_AUDIT_PUBLISH_RETRY_MAX_SECONDS:900}
railcab.dms.audit.publish.outbox-retention-days=${DMS_AUDIT_PUBLISH_OUTBOX_RETENTION_DAYS:7}
railcab.dms.audit.publish.call-timeout-ms=${DMS_AUDIT_PUBLISH_CALL_TIMEOUT_MS:3000}
railcab.dms.audit.publish.call-max-attempts=${DMS_AUDIT_PUBLISH_CALL_MAX_ATTEMPTS:3}
