spring.application.name=RealBoom-DMS
# Written to a shared repo-root logs/ directory so Promtail (docker-compose.logging.yml) can
# tail it and ship every line to Loki -- centralized logging.
logging.file.name=${LOG_FILE:../logs/dms.log}
server.port=${DMS_PORT:9104}
# Versioning now applied per-@RestController via ApiVersionConfig instead of a servlet
# context-path (see that class's javadoc for why) -- see ApiGateway's dms-docs route for the
# swagger-docs implication of this change.
# Trusts X-Forwarded-* headers from the ApiGateway (X-Forwarded-Prefix specifically) so springdoc
# computes the correct externally-reachable server URL in this service's OpenAPI spec -- see the
# centralized Swagger aggregator in ApiGateway's application.properties (springdoc.swagger-ui.urls).
server.forward-headers-strategy=framework

# Service discovery (Eureka) -- registers with realboom-service-registry so the ApiGateway can
# route by service ID instead of a hardcoded URL.
# EUREKA_URL, if set, overrides this entirely (include your own credentials in it). Otherwise
# the default embeds the shared Eureka Basic-Auth credentials (see EurekaSecurityConfig in
# 2026_RailCab_ServiceRegistry) via the same Vault-priority chain used elsewhere in this file.
# Defaults to ON -- registers with ServiceRegistry at startup; Eureka registration failure is
# non-fatal (the service still starts even if no registry is reachable), so expect
# connection-refused log noise if ServiceRegistry isn't running. Set SERVICE_DISCOVERY_ENABLED=false
# to disable the Eureka client entirely.
railcab.service.discovery.enabled=${SERVICE_DISCOVERY_ENABLED:true}
eureka.client.enabled=${railcab.service.discovery.enabled}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${eureka-username:${EUREKA_USERNAME}}:${eureka-password:${EUREKA_PASSWORD}}@localhost:9100/eureka/}
eureka.instance.prefer-ip-address=true

# Deploy resilience: a restarted or stopped instance must leave and join the registry within seconds, not minutes
# (the defaults are a 30 s renewal, a 90 s expiry and a 30 s registry fetch). Shared by every service that registers.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5

# Finish in-flight requests, and deregister, before stopping on a deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
eureka.instance.metadata-map.zone=${SERVICE_ZONE:region1}

# Virtual threads for request handling (Tomcat) -- document upload/download requests spend most
# of their time blocked on S3/Azure/GCS/MinIO storage I/O, which is what virtual threads are for.
spring.threads.virtual.enabled=true

spring.data.mongodb.uri=${DMS_MONGO_URI:mongodb://localhost:27017/railcab_dms}
spring.data.mongodb.auto-index-creation=true

# railcab.dms.persistence.provider selects the metadata/audit backend: mongo (default) or postgres.
# Only the selected backend's infrastructure is wired at startup (see PostgresPersistenceConfig).
railcab.dms.persistence.provider=${DMS_PERSISTENCE_PROVIDER:mongo}
railcab.dms.persistence.postgres.jdbc-url=${DMS_POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/railcab_dms}
railcab.dms.persistence.postgres.username=${DMS_POSTGRES_USERNAME:railcab_dms}
railcab.dms.persistence.postgres.password=${DMS_POSTGRES_PASSWORD:}
railcab.dms.persistence.postgres.maximum-pool-size=${DMS_POSTGRES_MAX_POOL_SIZE:20}
railcab.dms.persistence.postgres.minimum-idle=${DMS_POSTGRES_MIN_IDLE:5}
railcab.dms.persistence.postgres.connection-timeout-ms=${DMS_POSTGRES_CONNECTION_TIMEOUT_MS:10000}
railcab.dms.persistence.postgres.idle-timeout-ms=${DMS_POSTGRES_IDLE_TIMEOUT_MS:300000}
railcab.dms.persistence.postgres.max-lifetime-ms=${DMS_POSTGRES_MAX_LIFETIME_MS:1500000}
railcab.dms.persistence.postgres.leak-detection-threshold-ms=${DMS_POSTGRES_LEAK_DETECTION_MS:30000}

# Mongo driver connection-pool sizing -- see MongoPoolConfig. Applies only when
# railcab.dms.persistence.provider=mongo (the default).
railcab.dms.mongo.pool.min-size=${DMS_MONGO_POOL_MIN_SIZE:10}
railcab.dms.mongo.pool.max-size=${DMS_MONGO_POOL_MAX_SIZE:100}
railcab.dms.mongo.pool.wait-queue-timeout-ms=${DMS_MONGO_POOL_WAIT_TIMEOUT_MS:5000}

# GatewayAuthFilter reads gateway-forward-key directly (@Value("${gateway-forward-key}"), no
# nested default). When the "vault" profile is active, Vault's config-data-imported
# PropertySource defines this same key at higher precedence and wins outright; this line is only
# the fallback used when Vault isn't in play.
#
# NOTE: do NOT rewrite this as a nested placeholder like "gateway-forward-key=${GATEWAY_FORWARD_KEY}"
# feeding into "${gateway-forward-key:${OTHER}}" elsewhere, or as "${gateway-forward-key:${GATEWAY_FORWARD_KEY}}"
# directly in the @Value. On this service's Boot 3.3.5 / Spring Cloud 2023.0.3 line, resolving a
# two-level nested placeholder (default-value-is-itself-a-placeholder) throws "Could not resolve
# placeholder 'GATEWAY_FORWARD_KEY'" instead of falling through to the Vault-contributed
# PropertySource for the outer key -- confirmed this only reproduces with the ${a:${b}} nesting
# itself, independent of any name collision between the outer and inner placeholder names.
# Relying on plain PropertySource precedence (as below) sidesteps the bug entirely.
gateway-forward-key=${GATEWAY_FORWARD_KEY}

railcab.dms.security.enforce-owner-access=${DMS_ENFORCE_OWNER_ACCESS:true}
# Vault-contributed property (see spring.cloud.vault.* below) takes priority; falls back to the
# plain env var so this still works in an environment where Vault isn't configured yet.
railcab.dms.security.download-token-secret=${download-token-secret:${DMS_DOWNLOAD_TOKEN_SECRET}}

# Secrets management (see docs/design/Platform/SecretsManagement.md). Vault connection + config-
# import now live in application-vault.properties, an opt-in profile -- activate with
# --spring.profiles.active=<env>,vault to source secrets from Vault; omit it to use plain env vars
# (e.g. Kubernetes Secrets via secretKeyRef) instead.
# spring.cloud.vault.enabled gates ALL of Spring Cloud Vault's autoconfiguration (config-import,
# health indicator, everything) and defaults to true when absent -- without setting it false here,
# VaultAutoConfiguration still tries to build a VaultTemplate with no host/token configured at all
# and fails hard at startup whenever the vault profile is NOT active. application-vault.properties
# flips this back to true when that profile IS active.
spring.cloud.vault.enabled=false
railcab.dms.security.download-token-ttl-seconds=${DMS_DOWNLOAD_TOKEN_TTL_SECONDS:300}

railcab.dms.storage.provider=${DMS_STORAGE_PROVIDER:local}
railcab.dms.storage.local-root=${DMS_LOCAL_ROOT:uploads/documents}
railcab.dms.storage.public-base-url=${DMS_PUBLIC_BASE_URL:/api/v1/dms/documents}
railcab.dms.storage.operation-timeout-seconds=${DMS_STORAGE_OPERATION_TIMEOUT_SECONDS:30}
railcab.dms.storage.attempt-timeout-seconds=${DMS_STORAGE_ATTEMPT_TIMEOUT_SECONDS:10}
# Encryption at rest (server-side). mode: NONE | SSE_S3 | SSE_KMS. SSE_KMS needs kms-key-id (S3/MinIO key id or ARN; GCP full
# key resource name). The local provider stores plaintext, so any mode other than NONE fails startup there; Azure encrypts
# with provider-managed keys and rejects SSE_KMS. require-encryption=true fails startup unless the provider is not local
# and mode is not NONE (on by default in the prod profile).
railcab.dms.storage.encryption.mode=${DMS_STORAGE_ENCRYPTION_MODE:NONE}
railcab.dms.storage.encryption.kms-key-id=${DMS_STORAGE_KMS_KEY_ID:}
railcab.dms.storage.require-encryption=${DMS_STORAGE_REQUIRE_ENCRYPTION:false}

railcab.dms.scan.enabled=${DMS_SCAN_ENABLED:true}
railcab.dms.scan.provider=${DMS_SCAN_PROVIDER:basic}
railcab.dms.scan.blocked-extensions=.exe,.dll,.bat,.cmd,.js,.sh,.jar
railcab.dms.scan.blocked-content-types=application/x-msdownload,application/x-sh,application/java-archive
railcab.dms.scan.metadefender.api-key=${DMS_METADEFENDER_API_KEY:}
railcab.dms.scan.metadefender.fail-open=${DMS_METADEFENDER_FAIL_OPEN:false}

# The built-in DEFAULT document type every organization gets (all supported formats, scanned). Created on first use, without
# maker-checker; also the fallback when an upload names a document type the organization does not have.
railcab.dms.default-document-type.enabled=${DMS_DEFAULT_DOCUMENT_TYPE_ENABLED:true}
railcab.dms.default-document-type.max-file-size-mb=${DMS_DEFAULT_DOCUMENT_TYPE_MAX_FILE_SIZE_MB:10}
railcab.dms.default-document-type.retention-days=${DMS_DEFAULT_DOCUMENT_TYPE_RETENTION_DAYS:0}
# Also create the prebuilt customer/driver/franchise onboarding types for every organization (sizes capped by max-file-size-mb).
railcab.dms.default-document-type.prebuilt-catalog-enabled=${DMS_PREBUILT_DOCUMENT_TYPES_ENABLED:true}
railcab.dms.lifecycle.default-retention-days=${DMS_DEFAULT_RETENTION_DAYS:0}
railcab.dms.lifecycle.purge-job-enabled=${DMS_PURGE_JOB_ENABLED:true}
railcab.dms.lifecycle.purge-job-cron=${DMS_PURGE_JOB_CRON:0 0 2 * * *}
railcab.dms.lifecycle.purge-deleted-after-days=${DMS_PURGE_DELETED_AFTER_DAYS:30}
# D12: driver document expiry. Reminders go out these many days before (plus one when it lapses), counted in the zone below;
# Rider_DispatchService asks /api/v1/dms/internal/document-validity/lapsed and blocks drivers with a lapsed document.
railcab.dms.expiry.job-enabled=${DMS_EXPIRY_JOB_ENABLED:true}
railcab.dms.expiry.job-cron=${DMS_EXPIRY_JOB_CRON:0 30 7 * * *}
railcab.dms.expiry.zone=${DMS_EXPIRY_ZONE:Asia/Kolkata}
railcab.dms.expiry.reminder-days=${DMS_EXPIRY_REMINDER_DAYS:30,15,7,1}
railcab.dms.expiry.nms.base-url=${DMS_NMS_BASE_URL:http://RealBoom-NMS}
railcab.dms.expiry.nms.internal-api-key=${NMS_INTERNAL_API_KEY:}

railcab.dms.storage.aws-s3.region=${DMS_AWS_REGION:ap-south-1}
railcab.dms.storage.aws-s3.bucket-name=${DMS_AWS_BUCKET:railcab-documents}
railcab.dms.storage.aws-s3.access-key=${DMS_AWS_ACCESS_KEY:}
railcab.dms.storage.aws-s3.secret-key=${DMS_AWS_SECRET_KEY:}

railcab.dms.storage.minio.endpoint=${DMS_MINIO_ENDPOINT:}
railcab.dms.storage.minio.region=${DMS_MINIO_REGION:us-east-1}
railcab.dms.storage.minio.bucket-name=${DMS_MINIO_BUCKET:railcab-documents}
railcab.dms.storage.minio.access-key=${DMS_MINIO_ACCESS_KEY:}
railcab.dms.storage.minio.secret-key=${DMS_MINIO_SECRET_KEY:}

railcab.dms.storage.azure-blob.connection-string=${DMS_AZURE_CONNECTION_STRING:}
railcab.dms.storage.azure-blob.container-name=${DMS_AZURE_CONTAINER:documents}

railcab.dms.storage.gcp.bucket-name=${DMS_GCP_BUCKET:railcab-documents}

railcab.dms.validation.max-file-size-bytes=${DMS_MAX_FILE_SIZE_BYTES:10485760}
railcab.dms.validation.allowed-extensions=.pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.csv,.txt
railcab.dms.validation.allowed-content-types=application/pdf,image/png,image/jpeg,image/webp,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/plain

spring.servlet.multipart.max-file-size=${DMS_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${DMS_MULTIPART_MAX_REQUEST_SIZE:25MB}

# Only health/info/prometheus are exposed: heapdump/env/threaddump/configprops etc. reveal
# secrets (JWT secret, DB passwords, tokens) and a heap dump needs about the heap's size in
# extra memory, enough to get a 512m container OOM-killed. Take dumps from inside the host.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.prometheus.metrics.export.enabled=true

# Distributed tracing — OTLP endpoint, matching PaymentAPI/NMS's convention. Non-fatal if no
# collector is listening (spans just drop); see docker-compose.tracing.yml at the repo root.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics: Prometheus scrape only (/actuator/prometheus) -- OTLP metrics push disabled. This is a
# defensive no-op today (DMS's OTel stack is tracing-only: micrometer-tracing-bridge-otel +
# opentelemetry-exporter-otlp, no micrometer-registry-otlp), kept for uniformity with other services.
management.otlp.metrics.export.enabled=false

# Resilience4j — outbound Metadefender scan call
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.metadefender.base-config=default
resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=300ms
resilience4j.retry.instances.metadefender.base-config=default

# ── OpenAPI ───────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.pattern.level=%5p correlationId=%X{correlationId:-}

# Search indexing -- publishes document metadata snapshots onto a Redis Stream consumed by
# 2026_RailCab_SearchAPI (see search.SearchEventPublisher/SearchIndexAspect). This Redis
# connection is the shared cross-service stream bus, not a cache -- in any environment where
# BookingsAPI/AdminAPI/UAM/SearchAPI also publish/consume this stream, point ALL of their Redis
# configs at the same broker.
railcab.search.redis.host=${SEARCH_REDIS_HOST:localhost}
railcab.search.redis.port=${SEARCH_REDIS_PORT:6379}
railcab.search.stream.name=${SEARCH_INDEX_STREAM_NAME:railcab:search:index-stream}

# Web models DMS fills in the search index (WEB_DMS_DOCUMENT_TYPE, WEB_DMS_LIFECYCLE_DOCUMENT): published through
# Rider_SearchAPI's projection ingress by POST /api/v1/dms/search/reindex, for the signed-in organization.
# Found through Eureka (discovery-url) unless base-url is given. While the service token is blank a run reports FAILED
# and sends nothing.
railcab.dms.search.projection.base-url=${SEARCH_API_BASE_URL:}
railcab.dms.search.projection.discovery-url=${SEARCH_API_DISCOVERY_URL:http://RealBoom-Search-API}
railcab.dms.search.projection.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}
railcab.dms.search.projection.timeout-ms=${SEARCH_API_PROJECTION_TIMEOUT_MS:10000}

# ── Organization document types (maker-checker through Rider_WorkflowService) ──────────────────────────────────────
# Workflow is found through Eureka (discovery-url) unless base-url is given.
railcab.dms.workflow.base-url=${WORKFLOW_BASE_URL:}
railcab.dms.workflow.discovery-url=${WORKFLOW_DISCOVERY_URL:http://RealBoom-WorkflowService}
railcab.dms.workflow.timeout-ms=${WORKFLOW_TIMEOUT_MS:3000}
# Externally reachable base URL of THIS service (host:port, no path) that Workflow calls to apply an approved change;
# /api/v1/dms/internal/document-types/apply is appended. Empty = changes cannot be submitted (503, nothing changed).
railcab.dms.workflow.callback-base-url=${DMS_CALLBACK_BASE_URL:}
# Credentials accepted on /api/v1/dms/internal/** (service-to-service only; both empty = those paths answer 401).
# jwt-secret must equal the platform JWT secret (Workflow's jwt.secret); service-token the shared service token.
railcab.dms.internal.jwt-secret=${JWT_SECRET:}
railcab.dms.internal.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}

# ── Central audit (document events -> Rider_AuditService, DOMAIN events) ──────────────────────────────────────────────
# Every upload, rejected upload, scan result, download link, delete, legal hold and purge is queued in the dms_audit_outbox
# collection/table and pushed to Rider_AuditService by a scheduled drain (leased per event, retried with backoff, dropped
# after the retention). Publishing never fails or slows the request. The audit service is idempotent on eventId.
# Found through Eureka (discovery-url) unless base-url is given. Events stay queued while the service token is blank.
railcab.dms.audit.publish.enabled=${DMS_AUDIT_PUBLISH_ENABLED:true}
railcab.dms.audit.publish.base-url=${DMS_AUDIT_PUBLISH_URL:}
railcab.dms.audit.publish.discovery-url=${DMS_AUDIT_DISCOVERY_URL:http://RealBoom-AuditService}
railcab.dms.audit.publish.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}
railcab.dms.audit.publish.batch-size=${DMS_AUDIT_PUBLISH_BATCH_SIZE:100}
railcab.dms.audit.publish.interval-ms=${DMS_AUDIT_PUBLISH_INTERVAL_MS:5000}
railcab.dms.audit.publish.lease-seconds=${DMS_AUDIT_PUBLISH_LEASE_SECONDS:60}
railcab.dms.audit.publish.max-attempts=${DMS_AUDIT_PUBLISH_MAX_ATTEMPTS:20}
railcab.dms.audit.publish.retry-initial-backoff-seconds=${DMS_AUDIT_PUBLISH_RETRY_INITIAL_SECONDS:15}
railcab.dms.audit.publish.retry-max-backoff-seconds=${DMS_AUDIT_PUBLISH_RETRY_MAX_SECONDS:900}
railcab.dms.audit.publish.outbox-retention-days=${DMS_AUDIT_PUBLISH_OUTBOX_RETENTION_DAYS:7}
railcab.dms.audit.publish.call-timeout-ms=${DMS_AUDIT_PUBLISH_CALL_TIMEOUT_MS:3000}
railcab.dms.audit.publish.call-max-attempts=${DMS_AUDIT_PUBLISH_CALL_MAX_ATTEMPTS:3}

# ── Read caches (see docs/CACHING.md) ─────────────────────────────────────────────────────────────────────────────
# In-process Caffeine caches. DMS_CACHE_ENABLED=false (or a per-cache switch) = every lookup goes to the database as before.
# document-type-rule: the effective rule of an (organization, type code) used by every upload that names a type.
# Another instance sees a type change within ttl-seconds; this instance sees it at once (the apply path evicts).
railcab.dms.cache.enabled=${DMS_CACHE_ENABLED:true}
railcab.dms.cache.document-type-rule.enabled=${DMS_CACHE_DOCUMENT_TYPE_RULE_ENABLED:true}
railcab.dms.cache.document-type-rule.ttl-seconds=${DMS_CACHE_DOCUMENT_TYPE_RULE_TTL_SECONDS:60}
railcab.dms.cache.document-type-rule.max-size=${DMS_CACHE_DOCUMENT_TYPE_RULE_MAX_SIZE:5000}
