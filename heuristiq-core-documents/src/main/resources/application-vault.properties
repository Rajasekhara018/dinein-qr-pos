# Activate with: --spring.profiles.active=<env>,vault (e.g. local,vault or prod,vault) to source
# secrets from HashiCorp Vault. Omit this profile entirely to fall back to plain env vars instead
# (e.g. Kubernetes Secret-populated env vars via secretKeyRef) -- see
# docs/design/Platform/SecretsManagement.md, "Choosing a secrets provider".
#
# NOTE: these spring.cloud.vault.* connection properties must appear BEFORE spring.config.import=
# vault:// in this file -- the import is resolved as this file is parsed.
# Overrides the base application.properties's spring.cloud.vault.enabled=false -- re-enables
# Spring Cloud Vault's autoconfiguration now that this profile is active.
spring.cloud.vault.enabled=true
spring.cloud.vault.host=${VAULT_HOST:localhost}
spring.cloud.vault.port=${VAULT_PORT:8200}
spring.cloud.vault.scheme=${VAULT_SCHEME:http}
spring.cloud.vault.token=${VAULT_TOKEN:}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.backend-version=2
spring.config.import=optional:vault://secret/railcab/dms
