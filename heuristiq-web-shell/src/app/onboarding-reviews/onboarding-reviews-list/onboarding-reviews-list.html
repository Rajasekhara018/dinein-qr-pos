<hq-page-header
  [kicker]="'nav.sections.admin' | translate"
  [title]="'onboardingReviews.title' | translate"
  [subtitle]="'onboardingReviews.subtitle' | translate">
</hq-page-header>

<hq-screen-help screen="onboardingReviews"></hq-screen-help>

<div class="table-surface">
  <div class="table-surface__header">
    <div class="table-heading">
      <span class="table-kicker">{{ 'shared.listPage.total' | translate: { count: rows.length } }}</span>
    </div>
    <button type="button" class="table-create-btn" (click)="load()" [disabled]="isLoading">
      <i class="bi bi-arrow-clockwise"></i> {{ 'onboardingSubmissions.refresh' | translate }}
    </button>
  </div>

  <div class="table-surface__body">
    <hq-common-table
      [columns]="columns"
      [rows]="rows"
      [isLoading]="isLoading"
      [hasError]="hasError"
      [emptyMessage]="'onboardingReviews.empty' | translate"
      [errorMessage]="'onboardingReviews.loadFailed' | translate">
      <ng-template #rowActions let-row>
        <button type="button" class="row-action-btn" [title]="'shared.listPage.rowActions.viewDetail' | translate" (click)="viewDetail(row)">
          <i class="bi bi-eye"></i>
        </button>
        <button type="button" class="row-action-btn" *ngIf="row.workflowInstanceId" [title]="'onboardingReviews.history' | translate" (click)="history(row)">
          <i class="bi bi-clock-history"></i>
        </button>
        <ng-container *hqHasPrivilege="['ONBOARDING_ADMIN_REVIEW_APPROVE', 'RIDER_ONBOARDING_ADMIN_ACCESS']">
          <button type="button" class="row-action-btn" [title]="'onboardingReviews.approve' | translate" [disabled]="busySubmissionId === row.submissionId" (click)="approve(row)">
            <i class="bi bi-check-circle"></i>
          </button>
        </ng-container>
        <ng-container *hqHasPrivilege="'RIDER_ONBOARDING_ADMIN_ACCESS'">
          <button type="button" class="row-action-btn" [title]="'onboardingReviews.return' | translate" [disabled]="busySubmissionId === row.submissionId" (click)="returnForCorrection(row)">
            <i class="bi bi-arrow-return-left"></i>
          </button>
        </ng-container>
        <ng-container *hqHasPrivilege="['ONBOARDING_ADMIN_REVIEW_REJECT', 'RIDER_ONBOARDING_ADMIN_ACCESS']">
          <button type="button" class="row-action-btn danger" [title]="'onboardingReviews.reject' | translate" [disabled]="busySubmissionId === row.submissionId" (click)="reject(row)">
            <i class="bi bi-x-circle"></i>
          </button>
        </ng-container>
      </ng-template>
    </hq-common-table>
  </div>
</div>
