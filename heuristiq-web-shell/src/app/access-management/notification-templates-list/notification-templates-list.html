<hq-page-header
  [kicker]="'nav.sections.accessManagement' | translate"
  [title]="'nav.items.notificationTemplates' | translate"
  [subtitle]="'accessManagement.notificationTemplates.subtitle' | translate">
</hq-page-header>

<hq-screen-help screen="notificationTemplates"></hq-screen-help>

<div class="table-surface">
  <div class="table-surface__header">
    <div class="table-heading">
      <span class="table-kicker">{{ 'shared.listPage.total' | translate: { count: totalElements } }}</span>
    </div>
    <div class="search-box">
      <hq-field icon="bi bi-search"
        type="text"
        class="search-input"
        [placeholder]="'accessManagement.notificationTemplates.searchPlaceholder' | translate"
        [(ngModel)]="searchText"
        (ngModelChange)="onSearchInput()"></hq-field>
      <button type="button" class="row-action-btn" [title]="'shared.listPage.clear' | translate" (click)="clearSearch()" *ngIf="searchText">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <ng-container *hqHasPrivilege="'NOTIFICATION_TEMPLATE_CREATE'">
      <button type="button" class="table-create-btn" (click)="openCreate()">
        <i class="bi bi-plus-lg"></i> {{ 'accessManagement.notificationTemplates.newButton' | translate }}
      </button>
    </ng-container>
  </div>

  <div class="table-surface__body">
    <hq-common-table
      [columns]="columns"
      [rows]="rows"
      [isLoading]="isLoading"
      [hasError]="hasError"
      [emptyMessage]="'accessManagement.notificationTemplates.emptyMessage' | translate"
      [errorMessage]="'accessManagement.notificationTemplates.errorMessage' | translate">
      <ng-template #rowActions let-row>
        <ng-container *hqHasPrivilege="'NOTIFICATION_TEMPLATE_UPDATE'">
          <button type="button" class="row-action-btn" [title]="'shared.listPage.rowActions.edit' | translate" (click)="openEdit(row)">
            <i class="bi bi-pencil"></i>
          </button>
        </ng-container>
        <ng-container *hqHasPrivilege="'NOTIFICATION_TEMPLATE_DELETE'">
          <button type="button" class="row-action-btn danger" [title]="'shared.listPage.rowActions.delete' | translate" (click)="confirmDelete(row)">
            <i class="bi bi-trash3"></i>
          </button>
        </ng-container>
      </ng-template>
    </hq-common-table>

    <hq-table-footer
      [page]="page"
      [size]="pageSize"
      [itemCount]="rows.length"
      [hasMore]="page + 1 < totalPages"
      [totalItems]="totalElements"
      [loading]="isLoading"
      [sizeOptions]="pageSizeOptions"
      (pageChange)="goToPage($event)"
      (sizeChange)="onPageSizeChange($event)">
    </hq-table-footer>
  </div>
</div>
