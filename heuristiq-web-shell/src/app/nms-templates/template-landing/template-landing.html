<div class="page-wrapper">
  <div class="page-header">
    <div>
      <h1 class="page-title">{{ 'pageMeta.nmsTemplates.title' | translate }}</h1>
      <nav class="breadcrumb-nav">
        <span class="breadcrumb-item">{{ 'pageMeta.home.title' | translate }}</span>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-item active">{{ 'pageMeta.nmsTemplates.breadcrumb' | translate }}</span>
      </nav>
    </div>
    <ng-container *hqHasPrivilege="['NMS_EVENT_LIST', 'NMS_MANAGE']">
      <button hqButton="primary" appearance="outline" type="button" (click)="openEvents()">
        <i class="bi bi-braces me-1"></i> {{ 'nmsTemplates.landing.manageEvents' | translate }}
      </button>
    </ng-container>
  </div>

  <hq-tabs class="channel-tabs" [value]="selected" (valueChange)="selectChannel($any($event))" [ariaLabel]="'pageMeta.nmsTemplates.title' | translate">
    <hq-tab *ngFor="let ch of channels" [value]="ch.value" [icon]="ch.icon" [attr.data-testid]="'nms-tab-' + ch.value" [label]="ch.label | translate"></hq-tab>
  </hq-tabs>

  <div id="nms-channel-panel" role="tabpanel">
    <app-template-list [embedded]="true" [channel]="selected"></app-template-list>
  </div>
</div>
