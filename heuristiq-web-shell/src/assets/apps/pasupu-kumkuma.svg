    d="M64 10a54 54 0 1 1 0 108A54 54 0 0 1 64 10zm0 7a47 47 0 1 0 0 94a47 47 0 0 0 0-94z" />
  <path fill="#000" d="M64 2l4 9-4 6-4-6z" />
  <circle cx="50" cy="64" r="28" fill="#000" />
  <circle cx="78" cy="64" r="28" fill="#000" fill-opacity=".55" />
</svg>
