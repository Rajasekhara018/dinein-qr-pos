server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Drops the nginx version number from the Server response header (e.g. "nginx/1.25.3" ->
    # "nginx"). Can't remove the "nginx" string itself without the third-party
    # headers-more-nginx-module, which isn't in the stock nginx:alpine image this Dockerfile uses.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # ─── Gzip compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Static asset caching ────────────────────────────────────────────────────
    # Entry files keep the same name on every build (main.js, polyfills.js, scripts.js, styles.css), so they must never be
    # cached as immutable: a browser holding last deploy's main.js asks for chunks that no longer exist and the screens go
    # blank. "no-cache" lets the browser keep a copy but revalidate it (ETag) on every load. Must stay above the generic
    # .js/.css rule below, since nginx uses the first matching regex location.
    location ~* ^/(main|polyfills|scripts|styles)\.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Hashed JS/CSS bundles — cache 1 year (filename changes on every build)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Images / fonts / icons — cache 30 days
    location ~* \.(webp|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ─── sitemap.xml and robots.txt — no cache so crawlers always get fresh ──────
    location = /sitemap.xml {
        add_header Content-Type application/xml;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ─── Public live-trip page (/track#<token>, shared by riders) ─────────────────
    # Must not be indexed, and must never pass a Referer onwards. The page also sets <meta name="robots"> and
    # <meta name="referrer"> itself, but crawlers that do not run scripts only see these headers. The share token is
    # in the URL fragment, which browsers never send to a server. The shared include sends
    # "Referrer-Policy: strict-origin-when-cross-origin"; the "no-referrer" below comes after it, and browsers apply
    # the last policy listed. Any other web server or CDN in front of this site needs the same two headers on /track.
    location = /track {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/security-headers.conf;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────────────
    # For every route Angular handles, if no real file exists → serve index.html → Angular
    # router takes over.
    location / {
        # This always resolves to index.html for any non-file/non-directory route (the SPA
        # fallback), so index.html must never be cached -- otherwise a browser can keep serving a
        # stale entry point that references JS/CSS bundle hashes from a previous deploy.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
