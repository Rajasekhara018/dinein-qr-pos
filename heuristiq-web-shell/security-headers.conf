# Shared security headers -- `include`d in the server block AND in every `location` block that
# sets its own `add_header` (Cache-Control etc.), because nginx's add_header directive is NOT
# inherited into a location block that defines any add_header of its own. Skipping this include
# in a location silently drops every header below for that location's responses.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(self), usb=(), fullscreen=(self)" always;
# Was frame-ancestors only (clickjacking protection alone). Expanded to a real policy now that
# every actual external dependency is enumerated below: Google Fonts and the deployed backend
# origins from environment.ts. 'unsafe-inline' is scoped to style-src only (not script-src) --
# Angular's esbuild builder extracts component styles into external files, so this is a safety
# margin for any inline style attribute that does slip through a third-party widget (e.g.
# ngx-quill), not a requirement confirmed necessary -- narrow further if nothing needs it.
#
# script-src needs 'unsafe-inline' and blob: (confirmed by testing a live build in-browser: a
# strict 'self' broke the app). Root cause is es-module-shims (Angular Native Federation's
# import-map polyfill, see federation.config.mjs) -- it dynamically injects and executes inline
# <script> tags to shim remote-module loading, uses a hidden srcdoc iframe for feature
# detection, and rewrites shimmed modules into blob: URLs that it then dynamically imports.
# Those are all generated at runtime from the federation manifest, so a fixed hash/nonce can't
# cover them; 'unsafe-inline'/blob: are structural here, not a shortcut.
#
# frame-src starts with 'self' because the portal embeds its own API documentation (Swagger UI and Javadoc, served from this
# same address through the gateway) in an iframe; without it the browser blocks those frames.
# blob: is there so the portal can show a generated document (the QA automation PDF, report previews) in an iframe from a
# temporary in-memory address; without it the viewer stays blank with 'violates ... frame-src' in the console.
#
# The *.s3.ap-south-1.amazonaws.com host in connect-src and img-src is where DMS stores documents in production: the portal opens a
# document through a short-lived signed link straight to the bucket (the bucket needs a CORS rule for this site, see runbook.md).
#
# Maps (admin fleet, fare-engine and analytics maps): maps.googleapis.com / maps.gstatic.com in script-src load the Maps JavaScript API,
# maps.googleapis.com in connect-src is its data calls, the Google hosts in img-src are its tiles and icons, and worker-src blob: is the
# worker it starts. tile.openstreetmap.org and *.basemaps.cartocdn.com in img-src are the OpenStreetMap tiles used by the dev profiles and by
# the fallback when Google cannot load; unpkg.com in style-src is Leaflet's stylesheet for those maps.
#
# apis.google.com/www.gstatic.com in script-src, accounts.google.com/the Firebase authDomain in
# frame-src, and the googleapis.com hosts in connect-src are all required by Firebase Auth's
# Google sign-in popup (google-auth-service.ts) and Firebase Cloud Messaging (fcm-service.ts) --
# confirmed by testing in-browser, same as the es-module-shims entries above.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://apis.google.com https://www.gstatic.com https://checkout.razorpay.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' blob: https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com https://*.razorpay.com https://*.s3.ap-south-1.amazonaws.com https://maps.gstatic.com https://*.googleapis.com https://*.ggpht.com https://*.google.com https://tile.openstreetmap.org https://*.basemaps.cartocdn.com; frame-src 'self' blob: https://accounts.google.com https://gateway-2a04c.firebaseapp.com https://rider.thebridaldesire.com https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' blob: https://maps.googleapis.com https://*.s3.ap-south-1.amazonaws.com https://rider.thebridaldesire.com ws://35.154.15.238:8999 http://35.154.15.238:9001 http://35.154.15.238:99 https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://fcm.googleapis.com https://api.razorpay.com https://lumberjack.razorpay.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.payu.in; frame-ancestors 'self' *.novelskidev.online" always;
