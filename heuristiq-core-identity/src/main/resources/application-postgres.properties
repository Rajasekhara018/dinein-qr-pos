# Activate with SPRING_PROFILES_ACTIVE=postgres (can be combined with dev/local/prod, e.g. "dev,postgres").
# Switches every UAM domain module's repository adapter to the JPA/PostgreSQL implementation
# (users, roles, groups, tenants, applications, permissions, audit, mfa, lockout, sessions,
# refresh tokens, user credentials, preferences, password history, devices, security policies,
# api clients), plus OTP challenges, login-attempt lockout counters and auth audit events
# (V3 migration). Nothing is left on MongoDB in this profile, so Mongo autoconfiguration is
# excluded and UAM needs no UAM_MONGODB_URI.

railcab.uam.persistence.type=postgres

# Un-exclude JPA/DataSource autoconfiguration (excluded by default in application.properties for mongo mode)
# and exclude MongoDB instead -- every Mongo-backed bean is conditional on persistence.type=mongo.
spring.autoconfigure.exclude=\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.MongoReactiveAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.health.MongoReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.metrics.MongoMetricsAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveRepositoriesAutoConfiguration

spring.datasource.url=${UAM_POSTGRES_URL:jdbc:postgresql://localhost:5432/railcab_uam}
spring.datasource.username=${UAM_POSTGRES_USERNAME:railcab_uam}
spring.datasource.password=${UAM_POSTGRES_PASSWORD:railcab_uam}

# HikariCP tuning -- Boot's defaults (pool size 10, no leak detection) are conservative and
# opaque under real load. These are still a single instance's pool: scaling past this means
# adding instances/read-replicas, not raising these numbers further.
spring.datasource.hikari.pool-name=uam-postgres-pool
spring.datasource.hikari.maximum-pool-size=${UAM_POSTGRES_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${UAM_POSTGRES_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${UAM_POSTGRES_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${UAM_POSTGRES_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${UAM_POSTGRES_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.leak-detection-threshold=${UAM_POSTGRES_LEAK_DETECTION_MS:30000}

# Schema is now Flyway-managed (see src/main/resources/db/migration) -- Hibernate only validates
# the mapped entities match the migrated schema, it never generates/alters DDL itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Index migrations use CREATE INDEX CONCURRENTLY, which Flyway runs outside a transaction; with the default
# transaction-scoped Flyway lock that build would wait forever on Flyway's own open transaction.
spring.flyway.postgresql.transactional-lock=false
