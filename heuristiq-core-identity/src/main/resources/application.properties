spring.application.name=RealBoom-UAM
# Written to a shared repo-root logs/ directory (resolved relative to this service's own working
# directory when run via ./gradlew bootRun) so Promtail (docker-compose.logging.yml) can tail it
# and ship every line to Loki -- centralized logging, since these services run on the host, not
# in their own containers, so Docker-log-scraping doesn't reach them.
logging.file.name=${LOG_FILE:../logs/uam.log}
server.port=${UAM_PORT:9103}
# Versioning moved off context-path onto a per-@RestController prefix — see
# com.heuristiq.identity.config.ApiVersionConfig's javadoc for why (a context-path is server-wide
# and can't let a future v2 controller run alongside v1 during a migration window, unlike
# every other Rider_* service's own ApiVersionConfig). The external URL is unchanged
# (still /api/v1/uam/**) since ApiVersionConfig prefixes with that exact same value.
#
# Actuator is NOT @RestController-annotated, so it is untouched by that prefix — its base
# path is set explicitly below to keep serving at the same /api/v1/uam/actuator/** path the
# k8s liveness/readiness probes and Prometheus scrape annotation (ops/k8s/deployment.yaml)
# already depend on.
management.endpoints.web.base-path=/api/v1/uam/actuator
# Trusts X-Forwarded-* headers from the ApiGateway (X-Forwarded-Prefix specifically) so springdoc
# computes the correct externally-reachable server URL in this service's OpenAPI spec -- see the
# centralized Swagger aggregator in ApiGateway's application.properties (springdoc.swagger-ui.urls).
server.forward-headers-strategy=framework

# CorrelationIdFilter already puts X-Correlation-ID into MDC, but nothing rendered it into log
# output until now -- matches DMS/PaymentAPI/NMS's pattern.
logging.pattern.level=%5p [%X{correlationId:-}]

# Service discovery (Eureka) -- registers with realboom-service-registry so the ApiGateway can
# route by service ID instead of a hardcoded URL. Required because this service is on Spring Boot
# 4.1.0 while Spring Cloud 2025.1.0's CompatibilityVerifier only officially supports 4.0.x.
spring.cloud.compatibility-verifier.enabled=false
# EUREKA_URL, if set, overrides this entirely (include your own credentials in it). Otherwise
# the default embeds the shared Eureka Basic-Auth credentials (see EurekaSecurityConfig in
# 2026_RailCab_ServiceRegistry) via the same Vault-priority chain used elsewhere in this file.
# Defaults to ON -- registers with ServiceRegistry at startup; Eureka registration failure is
# non-fatal (the service still starts even if no registry is reachable), so expect
# connection-refused log noise if ServiceRegistry isn't running. Set SERVICE_DISCOVERY_ENABLED=false
# to disable the Eureka client entirely.
railcab.service.discovery.enabled=${SERVICE_DISCOVERY_ENABLED:true}
eureka.client.enabled=${railcab.service.discovery.enabled}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${eureka-username:${EUREKA_USERNAME}}:${eureka-password:${EUREKA_PASSWORD}}@localhost:9100/eureka/}
eureka.instance.prefer-ip-address=true

# Deploy resilience: a restarted or stopped instance must leave and join the registry within seconds, not minutes
# (the defaults are a 30 s renewal, a 90 s expiry and a 30 s registry fetch). Shared by every service that registers.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5

# Finish in-flight requests, and deregister, before stopping on a deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
eureka.instance.metadata-map.zone=${SERVICE_ZONE:region1}

# Secrets management (see docs/design/Platform/SecretsManagement.md). Vault connection + config-
# import now live in application-vault.properties, an opt-in profile -- activate with
# --spring.profiles.active=<env>,vault to source secrets from Vault; omit it to use plain env vars
# (e.g. Kubernetes Secrets via secretKeyRef) instead.
# spring.cloud.vault.enabled gates ALL of Spring Cloud Vault's autoconfiguration (config-import,
# health indicator, everything) and defaults to true when absent -- without setting it false here,
# VaultAutoConfiguration still tries to build a VaultTemplate with no host/token configured at all
# and fails hard at startup whenever the vault profile is NOT active. application-vault.properties
# flips this back to true when that profile IS active.
spring.cloud.vault.enabled=false

# Virtual threads for request handling (Tomcat) -- auth/identity calls spend most of their
# time blocked on Mongo/MySQL/Keycloak/OIDC/NMS I/O, which is exactly what virtual threads are
# for: cheap to park, no fixed platform-thread pool to size or exhaust under load.
spring.threads.virtual.enabled=true

spring.mongodb.uri=${UAM_MONGODB_URI:mongodb://localhost:27017/railcab_uam}
spring.mongodb.database=${UAM_MONGODB_DATABASE:railcab_uam}
spring.data.mongodb.auto-index-creation=true

# Mongo driver connection-pool sizing -- see MongoPoolConfig. Applies only when
# railcab.uam.persistence.type=mongo (the default).
railcab.uam.mongo.pool.min-size=${UAM_MONGO_POOL_MIN_SIZE:10}
railcab.uam.mongo.pool.max-size=${UAM_MONGO_POOL_MAX_SIZE:100}
railcab.uam.mongo.pool.wait-queue-timeout-ms=${UAM_MONGO_POOL_WAIT_TIMEOUT_MS:5000}

# Persistence backend for every UAM domain module (users, roles, groups, tenants, applications,
# permissions, audit, mfa, lockout, sessions, refresh tokens, user credentials, preferences,
# password history, devices, security policies, api clients): mongo (default) or mysql. Each
# module's repository port has both a Jpa and a Mongo adapter selected by this single flag. To
# switch to MySQL, activate the "mysql" Spring profile (e.g. SPRING_PROFILES_ACTIVE=mysql) -- see
# application-mysql.properties. Do not set railcab.uam.persistence.type directly here; it must
# stay in lockstep with the spring.autoconfigure.exclude below, which the mysql profile flips
# atomically.
railcab.uam.persistence.type=mongo
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

# Vault-contributed property (see spring.cloud.vault.* below) takes priority; falls back to the
# plain env var so this still works in an environment where Vault isn't configured yet. Must match
# the ApiGateway/BookingsAPI's gateway-forward-key so the token the Gateway injects validates here.
gateway.forward-key=${gateway-forward-key:${GATEWAY_FORWARD_KEY}}

# Vault-contributed property (see spring.cloud.vault.* below) takes priority; falls back to the
# plain env var so this still works in an environment where Vault isn't configured yet.
railcab.uam.auth.jwt-secret=${jwt-secret:${JWT_SECRET}}
# Shared service-to-service credential (header X-Rider-Service-Token) for /api/v1/uam/internal/**. Must equal the
# value the calling services (e.g. Rider_OnboardingService) use. Blank = every internal call is rejected.
rider.internal.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}
railcab.uam.auth.expiry-minutes=${UAM_JWT_EXPIRY_MINUTES:60}
railcab.uam.auth.refresh-expiry-days=${UAM_REFRESH_EXPIRY_DAYS:30}
railcab.uam.auth.issuer=${UAM_JWT_ISSUER:railcab-uam}
railcab.uam.auth.max-failed-attempts=${UAM_AUTH_MAX_FAILED_ATTEMPTS:5}
railcab.uam.auth.lockout-minutes=${UAM_AUTH_LOCKOUT_MINUTES:15}

# ── Password hashing (PasswordService) ───────────────────────────────────────
# BCrypt cost factor: was 12 (measured ~403ms/op on reference hardware), lowered to 11
# (~202ms/op, roughly 2x) -- OWASP's Password Storage Cheat Sheet floor is 10 ("as large as
# verification server performance will allow"), so 11 stays a full factor above that floor.
# Do NOT lower further without re-checking OWASP's current guidance first.
railcab.uam.auth.password.bcrypt-strength=${UAM_PASSWORD_BCRYPT_STRENGTH:11}
# BCrypt is CPU-bound, so PasswordService runs it on a small platform-thread pool sized to
# available cores minus one (auto-adapts to the pod's actual CPU limit) instead of virtual threads or
# unbounded concurrency -- see PasswordService's class comment for why. Queue capacity bounds
# how many logins can wait for a free worker before new ones are rejected with a 503 instead of
# queuing indefinitely; timeout bounds how long a single submission waits for that worker.
railcab.uam.auth.password.hash-pool-queue-capacity=${UAM_PASSWORD_POOL_QUEUE_CAPACITY:64}
railcab.uam.auth.password.hash-timeout-ms=${UAM_PASSWORD_HASH_TIMEOUT_MS:2000}
# Worker threads of that pool. 0 (the default) = one per available core, at least 1 (production: 2 CPUs = 2 workers).
# Set a number to override, for example to keep a core free for the rest of UAM on a bigger host.
railcab.uam.auth.password.hash-pool-threads=${UAM_PASSWORD_POOL_THREADS:0}
railcab.uam.otp.expiry-minutes=${UAM_OTP_EXPIRY_MINUTES:5}
railcab.uam.otp.expose-otp=${UAM_OTP_EXPOSE_OTP:false}
# Wrong OTP guesses allowed per challenge before it is invalidated (a new OTP must be requested).
railcab.uam.otp.max-verify-attempts=${UAM_OTP_MAX_VERIFY_ATTEMPTS:5}
# Minimum seconds between OTP sends to the same phone/email, and the cap per rolling hour (429 beyond either).
railcab.uam.otp.resend-cooldown-seconds=${UAM_OTP_RESEND_COOLDOWN_SECONDS:30}
railcab.uam.otp.max-sends-per-hour=${UAM_OTP_MAX_SENDS_PER_HOUR:5}
# Self-registration email check (public sign-up): kill switch, codes one client address may ask for per hour, how long the
# single-use verification token lives, domains that may not sign up (comma separated), and the bot-check provider (none = off).
railcab.uam.self-register.enabled=${UAM_SELF_REGISTER_ENABLED:true}
railcab.uam.self-register.max-sends-per-ip-per-hour=${UAM_SELF_REGISTER_MAX_SENDS_PER_IP_PER_HOUR:20}
railcab.uam.self-register.verification-ttl-minutes=${UAM_SELF_REGISTER_VERIFICATION_TTL_MINUTES:15}
railcab.uam.self-register.blocked-email-domains=${UAM_SELF_REGISTER_BLOCKED_EMAIL_DOMAINS:}
railcab.uam.self-register.bot-check=${UAM_SELF_REGISTER_BOT_CHECK:none}
railcab.uam.identity-provider.enabled=${UAM_IDENTITY_PROVIDER_ENABLED:false}
railcab.uam.identity-provider.type=${UAM_IDENTITY_PROVIDER:none}
railcab.uam.identity-provider.token-validation=${UAM_IDENTITY_TOKEN_VALIDATION:local}
railcab.uam.identity-provider.unsupported-sync-action=${UAM_IDENTITY_UNSUPPORTED_SYNC_ACTION:fail}
railcab.uam.keycloak.enabled=${UAM_KEYCLOAK_ENABLED:false}
railcab.uam.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
railcab.uam.keycloak.realm=${KEYCLOAK_REALM:railcab}
railcab.uam.keycloak.client-id=${KEYCLOAK_CLIENT_ID:railcab-uam}
railcab.uam.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
railcab.uam.keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:}
railcab.uam.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:}
railcab.uam.oidc.issuer-uri=${OIDC_ISSUER_URI:}
railcab.uam.oidc.token-uri=${OIDC_TOKEN_URI:}
railcab.uam.oidc.logout-uri=${OIDC_LOGOUT_URI:}
railcab.uam.oidc.revocation-uri=${OIDC_REVOCATION_URI:}
railcab.uam.oidc.client-id=${OIDC_CLIENT_ID:}
railcab.uam.oidc.client-secret=${OIDC_CLIENT_SECRET:}
railcab.uam.oidc.scope=${OIDC_SCOPE:openid profile email}
railcab.uam.oidc.audience=${OIDC_AUDIENCE:}
railcab.uam.bootstrap.admin-username=${UAM_BOOTSTRAP_ADMIN_USERNAME:}
railcab.uam.bootstrap.admin-password=${UAM_BOOTSTRAP_ADMIN_PASSWORD:}
railcab.uam.bootstrap.admin-email=${UAM_BOOTSTRAP_ADMIN_EMAIL:}
railcab.uam.bootstrap.admin-phone=${UAM_BOOTSTRAP_ADMIN_PHONE:+916281298823}
# The organization that owns the platform itself. It is created if missing and the bootstrap super admin belongs to it. Only
# seeding and placing an account that has no membership use this; a signed-in request always takes its organization from
# the token. Set the code of the existing organization in an environment that already has one (for example REALBOOM).
railcab.uam.platform-org.code=${UAM_PLATFORM_ORG_CODE:DEFAULT}
railcab.uam.platform-org.name=${UAM_PLATFORM_ORG_NAME:Default organization}
# One-off migration: true gives every account that has no organization to the platform organization at start-up.
railcab.uam.platform-org.adopt-unowned-users=${UAM_PLATFORM_ORG_ADOPT_UNOWNED:true}

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:railcab}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:railcab-uam}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/railcab}}

app.firebase-admin.credentials-path=${FIREBASE_ADMIN_CREDENTIALS_PATH:classpath:firebase-service-account.json}
app.firebase-admin.credentials-base64=${FIREBASE_ADMIN_CREDENTIALS_BASE64:}

# NMS notification dispatch (OTP / registration emails) -- same env vars as BookingsAPI/PaymentAPI
# so all callers share one NMS instance and one internal API key.
# Rider_NMS (port 9111). In Docker set NMS_BASE_URL to the NMS container, e.g.
# http://bestride-nms-container:9111 -- localhost is this container itself.
railcab.nms.base-url=${NMS_BASE_URL:http://localhost:9111}
railcab.nms.internal-api-key=${internal-api-key:${NMS_INTERNAL_API_KEY}}
# NMS call resilience (ResilientCaller): timeout, retry of transient errors only (exponential backoff + jitter),
# bulkhead, circuit breaker. See NmsResilienceConfig for the remaining breaker knobs.
railcab.nms.resilience.call-timeout-ms=5000
railcab.nms.resilience.max-attempts=3
railcab.nms.resilience.max-concurrent-calls=10

# Application readiness combiner (docs/APPLICATION_READINESS.md): UAM calls each service's internal readiness endpoint.
# In Docker every base URL MUST point at the service's container (localhost is this container itself): the Jenkinsfiles
# set UAM_READINESS_<SERVICE>_BASE_URL. Wallet, reports, DMS and NMS get X-Rider-Service-Token (rider.internal.service-token);
# onboarding gets a SERVICE bearer JWT signed with railcab.uam.auth.jwt-secret. A path is a property so a moved endpoint is a
# one-line fix.
# Go-live guard (refuses switching an application on while a required step fails; a SUPER_ADMIN can override with a reason) and the
# scheduled re-check: both ON by default. UAM_READINESS_GUARD_ENABLED=false is the emergency switch for the guard.
railcab.uam.readiness.governance.guard-enabled=${UAM_READINESS_GUARD_ENABLED:true}
railcab.uam.readiness.governance.recheck-enabled=${UAM_READINESS_RECHECK_ENABLED:true}
railcab.uam.readiness.budget=${UAM_READINESS_BUDGET:4s}
railcab.uam.readiness.cache-ttl=${UAM_READINESS_CACHE_TTL:30s}
railcab.uam.readiness.cache-max-size=500
railcab.uam.readiness.call-timeout=${UAM_READINESS_CALL_TIMEOUT:2s}
railcab.uam.readiness.max-attempts=2
railcab.uam.readiness.max-concurrent-calls=32
railcab.uam.readiness.queue-capacity=256
railcab.uam.readiness.services.wallet.base-url=${UAM_READINESS_WALLET_BASE_URL:http://localhost:9121}
railcab.uam.readiness.services.wallet.path=/api/v1/wallet/internal/readiness
railcab.uam.readiness.services.wallet.auth=SERVICE_TOKEN
railcab.uam.readiness.services.reports.base-url=${UAM_READINESS_REPORTS_BASE_URL:http://localhost:9122}
railcab.uam.readiness.services.reports.path=/api/v1/reports/internal/readiness
railcab.uam.readiness.services.reports.auth=SERVICE_TOKEN
railcab.uam.readiness.services.onboarding.base-url=${UAM_READINESS_ONBOARDING_BASE_URL:http://localhost:9112}
railcab.uam.readiness.services.onboarding.path=/api/v1/internal/readiness
railcab.uam.readiness.services.onboarding.auth=SERVICE_JWT
railcab.uam.readiness.services.dms.base-url=${UAM_READINESS_DMS_BASE_URL:http://localhost:9104}
railcab.uam.readiness.services.dms.path=/api/v1/dms/internal/readiness
railcab.uam.readiness.services.dms.auth=SERVICE_TOKEN
railcab.uam.readiness.services.nms.base-url=${UAM_READINESS_NMS_BASE_URL:http://localhost:9111}
railcab.uam.readiness.services.nms.path=/api/v1/nms/internal/readiness
railcab.uam.readiness.services.nms.auth=SERVICE_TOKEN

# Outbound WebClient pool/timeouts shared by every WebClient.Builder injection (NMS, Keycloak,
# OIDC) -- see OutboundWebClientConfig.
railcab.webclient.connect-timeout-ms=${WEBCLIENT_CONNECT_TIMEOUT_MS:5000}
railcab.webclient.read-timeout-ms=${WEBCLIENT_READ_TIMEOUT_MS:10000}
railcab.webclient.max-connections=${WEBCLIENT_MAX_CONNECTIONS:100}

# Only health/info/prometheus are exposed: heapdump/env/threaddump/configprops etc. reveal
# secrets (JWT secret, DB passwords, tokens) and a heap dump needs about the heap's size in
# extra memory, enough to get a 512m container OOM-killed. Take dumps from inside the host.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.heapdump.access=none
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Distributed tracing — OTLP endpoint, matching PaymentAPI/NMS's convention. Non-fatal if no
# collector is listening (spans just drop); see docker-compose.tracing.yml at the repo root.
# NOTE: management.otlp.tracing.endpoint (the property every service in this repo was using) is
# deprecated at error level since Boot 4.0 -- it silently does nothing on Boot 4.x, meaning no
# service's spans were ever actually reaching the collector despite tracing "being configured".
# management.opentelemetry.tracing.export.otlp.endpoint is the real, current property name.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics: Prometheus scrape only (/actuator/prometheus) -- OTLP metrics push disabled. Tracing
# still goes over OTLP above; spring-boot-starter-opentelemetry pulls in micrometer-registry-otlp
# and defaults this to true, which was never an intentional metrics path.
management.otlp.metrics.export.enabled=false
# Histogram buckets for http.server.requests -- needed so Prometheus's histogram_quantile() can
# compute p95/p99 latency per endpoint (Grafana golden-signals dashboard/alerts); a plain Timer
# alone only exports count/sum, no distribution.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Explicit SLO buckets so the latency alerts/panels have exact boundaries (p95 under 500ms, 1s...) on top of
# the exponential histogram buckets; the min/max bound how many buckets each endpoint series carries
# (fewer buckets = less Prometheus memory per instance). Guidance, tune after the load test.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=30s
# Spring Data repository invocation timers (spring_data_repository_invocations_seconds_*): per repository
# method latency for the database-bound paths, no code needed. Bounded by the number of repository methods.
management.metrics.data.repository.autotime.enabled=true
# Hikari pool gauges/timers (hikaricp_connections_*) are bound automatically by Boot when the JDBC pool is used
# (postgres/mysql profiles); the pool name tag comes from spring.datasource.hikari.pool-name.

# Resilience4j — outbound calls to Keycloak, a generic OIDC provider, NMS, and Firebase/Google
# sign-in verification
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.keycloak.base-config=default
resilience4j.circuitbreaker.instances.oidc-provider.base-config=default
resilience4j.circuitbreaker.instances.google-identity.base-config=default
# Rejected/invalid tokens are a verdict, not a Firebase outage -- don't let them open the circuit.
resilience4j.circuitbreaker.instances.google-identity.ignore-exceptions=com.heuristiq.identity.google.GoogleAuthException
resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=300ms
resilience4j.retry.instances.keycloak.base-config=default
resilience4j.retry.instances.oidc-provider.base-config=default
resilience4j.retry.instances.google-identity.base-config=default
resilience4j.retry.instances.google-identity.ignore-exceptions=com.heuristiq.identity.google.GoogleAuthException
# Bulkhead -- caps concurrent in-flight calls per outbound dependency, independent of the circuit
# breaker (which reacts to failure rate, not concurrency). Matches PaymentAPI's per-gateway convention.
resilience4j.bulkhead.configs.default.max-concurrent-calls=10
resilience4j.bulkhead.instances.keycloak.base-config=default
resilience4j.bulkhead.instances.oidc-provider.base-config=default
resilience4j.bulkhead.instances.google-identity.base-config=default

# ── OpenAPI ───────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Search indexing -- publishes UamUser snapshots onto a Redis Stream consumed by
# 2026_RailCab_SearchAPI (see search.SearchEventPublisher/SearchIndexAspect). This Redis
# connection is the shared cross-service stream bus, not a cache -- in any environment where
# BookingsAPI/AdminAPI/SearchAPI also publish/consume this stream, point ALL of their Redis
# configs at the same broker.
railcab.search.redis.host=${SEARCH_REDIS_HOST:localhost}
railcab.search.redis.port=${SEARCH_REDIS_PORT:6379}
railcab.search.stream.name=${SEARCH_INDEX_STREAM_NAME:railcab:search:index-stream}
# SearchIndexAspect dispatches its Redis Stream publish here instead of running it inline on the
# write-path request thread (see SearchIndexExecutorConfig) -- a Redis XADD is normally sub-ms, so
# a small fixed pool keeps up easily; queue-capacity bounds how much pending work backs up if
# Redis is genuinely slow/unreachable before new events are logged-and-dropped.
railcab.search.executor.pool-size=${SEARCH_INDEX_EXECUTOR_POOL_SIZE:4}
railcab.search.executor.queue-capacity=${SEARCH_INDEX_EXECUTOR_QUEUE_CAPACITY:500}
# jersey-client is on the classpath for KeycloakAuthProvider (see build.gradle), which makes
# Spring Cloud Netflix's OnJerseyClientPresentAndEnabledCondition true and commits Eureka to a
# Jersey-based TransportClientFactories -- but eureka-client-jersey3 (the artifact that actually
# implements it) isn't a dependency, so no bean is ever produced and registration fails with
# "No qualifying bean of type TransportClientFactories". Force the WebClient-based transport
# instead, which fits this reactive gateway anyway.
eureka.client.jersey.enabled=false

# ── Organization structure: bulk employee import ────────────────────────────────────────────
# The employee file is uploaded to Rider_DMS by the browser (scanned, filed, size-limited there); UAM only
# reads it back by document id. DMS's own limit (railcab.dms.validation.max-file-size-bytes, 10 MB by default)
# is the effective upload cap -- raise it there for very large files.
railcab.uam.org-import.max-rows=${UAM_ORG_IMPORT_MAX_ROWS:200000}
railcab.uam.org-import.chunk-size=${UAM_ORG_IMPORT_CHUNK_SIZE:500}
railcab.uam.org-import.queue-size=${UAM_ORG_IMPORT_QUEUE_SIZE:5}
railcab.dms.base-url=${DMS_BASE_URL:http://localhost:9104}
railcab.dms.call-timeout-ms=${DMS_CALL_TIMEOUT_MS:20000}
railcab.dms.max-attempts=3
railcab.dms.max-concurrent-calls=5
railcab.dms.max-file-bytes=${DMS_MAX_FILE_BYTES:26214400}
# Optional fixed id of the organization used for internal work with no signed-in person. Blank: the organization whose code is
# railcab.uam.platform-org.code (DEFAULT) is looked up, so it works in Mongo mode where its id is generated.
railcab.uam.org-structure.default-tenant-id=${UAM_ORG_DEFAULT_TENANT_ID:}

# --- Read caches (see docs/CACHING.md). UAM_CACHE_ENABLED=false makes every cache a pass-through. ---
railcab.uam.cache.enabled=${UAM_CACHE_ENABLED:true}
railcab.uam.cache.my-privileges.enabled=${UAM_CACHE_MY_PRIVILEGES_ENABLED:true}
railcab.uam.cache.my-privileges.ttl-seconds=${UAM_CACHE_MY_PRIVILEGES_TTL:30}
railcab.uam.cache.my-privileges.max-size=${UAM_CACHE_MY_PRIVILEGES_MAX_SIZE:10000}
railcab.uam.cache.my-organizations.enabled=${UAM_CACHE_MY_ORGANIZATIONS_ENABLED:true}
railcab.uam.cache.my-organizations.ttl-seconds=${UAM_CACHE_MY_ORGANIZATIONS_TTL:30}
railcab.uam.cache.my-organizations.max-size=${UAM_CACHE_MY_ORGANIZATIONS_MAX_SIZE:10000}
railcab.uam.cache.tenants.enabled=${UAM_CACHE_TENANTS_ENABLED:true}
railcab.uam.cache.tenants.ttl-seconds=${UAM_CACHE_TENANTS_TTL:120}
railcab.uam.cache.tenants.max-size=${UAM_CACHE_TENANTS_MAX_SIZE:2000}
railcab.uam.cache.tenant-applications.enabled=${UAM_CACHE_TENANT_APPLICATIONS_ENABLED:true}
railcab.uam.cache.tenant-applications.ttl-seconds=${UAM_CACHE_TENANT_APPLICATIONS_TTL:120}
railcab.uam.cache.tenant-applications.max-size=${UAM_CACHE_TENANT_APPLICATIONS_MAX_SIZE:2000}

# ── Operating model ───────────────────────────────────────────────────────────────────────────────────────
# Whether an organization runs its sales itself (DIRECT), through franchises (FRANCHISE) or per place (HYBRID); see docs/OPERATING_MODEL_DESIGN.md.
# The schedule lives in its own store (organization_operating_model_changes); this is only the time zone used for an organization that has none of its own.
railcab.uam.operating-model.default-time-zone=${UAM_DEFAULT_TIME_ZONE:Asia/Kolkata}

# ── Biometric sign-in (fingerprint / Face ID, device key) ─────────────────────────────────────────────────
# Enrolling a device without the current password needs an interactive sign-in (password, one-time code, Google) this recent.
railcab.uam.biometric.reauth-window=${UAM_BIOMETRIC_REAUTH_WINDOW:5m}
# How long a sign-in challenge may be answered (each one is accepted once).
railcab.uam.biometric.challenge-ttl=${UAM_BIOMETRIC_CHALLENGE_TTL:60s}
# An enrolled device not used for this long expires and must be enrolled again; every biometric sign-in moves it.
railcab.uam.biometric.inactivity-expiry=${UAM_BIOMETRIC_INACTIVITY_EXPIRY:90d}
# Failed biometric sign-ins allowed per installation within the window; further ones get 429 TOO_MANY_ATTEMPTS.
railcab.uam.biometric.max-failed-attempts=${UAM_BIOMETRIC_MAX_FAILED_ATTEMPTS:5}
railcab.uam.biometric.attempt-window=${UAM_BIOMETRIC_ATTEMPT_WINDOW:15m}

# ── Franchises ────────────────────────────────────────────────────────────────────────────────────────────
# Franchises moved to Rider_FranchiseService (see docs/FRANCHISE_SERVICE_EXTRACTION.md); its settings live there.
# UAM only fetches the franchiseIds token claim from it (fail-closed) and offers /api/v1/uam/internal/franchise-access.
railcab.uam.franchise.service.enabled=${UAM_FRANCHISE_SERVICE_ENABLED:true}
# Only holders of a role matching one of these prefixes trigger the claims lookup at sign-in; everyone else has no lookup and no dependency.
# A role matches a prefix when it is that code or that code + "_" + a suffix, case-insensitive: FRANCHISE_OWNER matches FRANCHISE_OWNER and
# FRANCHISE_OWNER_MATRIMONY (the fixed per-application roles), not FRANCHISE_OWNERSHIP_AUDITOR. (The environment variable keeps its old name.)
railcab.uam.franchise.service.lookup-role-prefixes=${UAM_FRANCHISE_LOOKUP_ROLES:FRANCHISE_OWNER,FRANCHISE_AGENT}
# On: also look the franchiseIds claim up for everyone signing in to an organization that is FRANCHISE or HYBRID today (its time zone),
# whatever their roles; role-prefix holders above are always looked up. Off by default: turn it on only once every organization that has
# franchises has been set to FRANCHISE or HYBRID (docs/OPERATING_MODEL_DESIGN.md, section 3). Lookup failures still fail the sign-in.
railcab.uam.franchise.claims-by-model=${UAM_FRANCHISE_CLAIMS_BY_MODEL:true}
railcab.uam.franchise.service.base-url=${UAM_FRANCHISE_SERVICE_BASE_URL:http://localhost:9124}
railcab.uam.franchise.service.call-timeout-ms=${UAM_FRANCHISE_SERVICE_CALL_TIMEOUT_MS:3000}
railcab.uam.franchise.service.max-attempts=${UAM_FRANCHISE_SERVICE_MAX_ATTEMPTS:2}
railcab.uam.franchise.service.max-concurrent-calls=${UAM_FRANCHISE_SERVICE_MAX_CONCURRENT_CALLS:20}

# Domain audit events go to the central audit service (Rider_AuditService) only; UAM keeps no audit store and serves no
# audit query. Events are written to a database outbox (central_audit_outbox, V28; a Mongo collection in mongo mode) in the
# transaction of the business action and drained in batches by a leased scheduler (safe with several instances), deleted only
# after a 2xx and retried with exponential backoff. The table is bounded by max-rows: over it only rows older than
# retention-hours are dropped (ERROR log + metric); fresh events are never dropped. Pushes use the shared service token
# (rider.internal.service-token above, sent as X-Rider-Service-Token). A push failure never fails a request.
railcab.uam.audit.publish.enabled=${UAM_AUDIT_PUBLISH_ENABLED:true}
railcab.uam.audit.publish.base-url=${UAM_AUDIT_SERVICE_BASE_URL:${AUDIT_SERVICE_URL:http://localhost:9106}}
railcab.uam.audit.publish.service-token=${RIDER_INTERNAL_SERVICE_TOKEN:}
railcab.uam.audit.publish.max-rows=${UAM_AUDIT_OUTBOX_MAX_ROWS:100000}
railcab.uam.audit.publish.retention-hours=${UAM_AUDIT_OUTBOX_RETENTION_HOURS:168}
railcab.uam.audit.publish.lease-ms=${UAM_AUDIT_LEASE_MS:60000}
railcab.uam.audit.publish.backoff-initial-ms=${UAM_AUDIT_BACKOFF_INITIAL_MS:2000}
railcab.uam.audit.publish.backoff-max-ms=${UAM_AUDIT_BACKOFF_MAX_MS:300000}
railcab.uam.audit.publish.batch-size=${UAM_AUDIT_BATCH_SIZE:100}
railcab.uam.audit.publish.interval-ms=${UAM_AUDIT_INTERVAL_MS:2000}
railcab.uam.audit.publish.call-timeout-ms=${UAM_AUDIT_CALL_TIMEOUT_MS:3000}
railcab.uam.audit.publish.max-attempts=${UAM_AUDIT_MAX_ATTEMPTS:2}
railcab.uam.audit.publish.max-concurrent-calls=${UAM_AUDIT_MAX_CONCURRENT_CALLS:5}

# Limits on the franchise-access internal API (service-token holders): roles it may never hand out (SUPER_ADMIN, ADMIN and any *_ADMIN
# are always denied); the exact privilege names a franchise role may carry (default: the union of the franchise owner and agent sets, no
# wildcard); and the base codes of the fixed franchise roles (must match franchise.owner-role / franchise.agent-role of Rider_FranchiseService).
# Roles ensured through the API are created when missing and only ever gain the missing privileges, never lose one.
railcab.uam.franchise-access.denied-roles=${UAM_FRANCHISE_ACCESS_DENIED_ROLES:SUPER_ADMIN,ADMIN}
railcab.uam.franchise-access.allowed-privilege-prefixes=${UAM_FRANCHISE_ACCESS_ALLOWED_PRIVILEGE_PREFIXES:FRANCHISE_MINE_LIST,FRANCHISE_AGENT_LIST,FRANCHISE_AGENT_CREATE,FRANCHISE_AGENT_REQUEST_CREATE,FRANCHISE_MEMBER_LIST,LEDGER_ENTRY_MINE_LIST,COMMISSION_STATEMENT_MINE_READ,PAYOUT_REQUEST_CREATE,PAYOUT_REQUEST_MINE_LIST,WALLET_SELF_STATEMENT_READ,WALLET_SELF_STATEMENT_MONTH_LIST,WALLET_SELF_STATEMENT_SUMMARY_READ,WALLET_SELF_STATEMENT_EXPORT_READ,FRANCHISE_AGENT_DEAL_UPDATE,FRANCHISE_AGENT_DEAL_READ,FRANCHISE_AGENT_DEAL_MINE_READ,NMS_IN_APP_NOTIFICATION_LIST,NMS_IN_APP_NOTIFICATION_UNREAD_COUNT,NMS_IN_APP_NOTIFICATION_MARK_READ,NMS_IN_APP_NOTIFICATION_MARK_ALL_READ,NMS_IN_APP_WS_CONNECT,FRANCHISE_DRIVER_LIST,FRANCHISE_DRIVER_ONBOARDING_CREATE,FRANCHISE_DRIVER_SUBSCRIPTION_OFFER_LIST,FRANCHISE_DRIVER_SUBSCRIPTION_CREATE,USER_SELF_PROFILE_READ,USER_SELF_PREFERENCE_READ,USER_SELF_SESSION_LIST,USER_SELF_DEVICE_LIST,USER_SELF_MFA_LIST,USER_SELF_LOGIN_SECURITY_READ,WORKFLOW_TASK_LIST,WALLET_FRANCHISE_ACCOUNTING_MINE_READ,MATRIMONY_AGENT_PROFILE_READ,MATRIMONY_AGENT_DASHBOARD_READ,MATRIMONY_AGENT_ONBOARDING_FEE_READ,MATRIMONY_AGENT_REFERRAL_LIST,MATRIMONY_AGENT_CUSTOMER_CREATE,MATRIMONY_AGENT_CUSTOMER_FEE_CREATE,MATRIMONY_AGENT_CUSTOMER_CONSENT_OTP_CREATE,MATRIMONY_AGENT_CUSTOMER_CONSENT_OTP_VERIFY_CREATE,MATRIMONY_AGENT_CUSTOMER_CONSENT_SIGNED_FORM_CREATE,MATRIMONY_AGENT_CUSTOMER_CONSENT_LIST,MATRIMONY_AGENT_CUSTOMER_CONSENT_DELETE,MATRIMONY_AGENT_CUSTOMER_PHOTO_CREATE,MATRIMONY_AGENT_CUSTOMER_PHOTO_LIST,MATRIMONY_AGENT_CUSTOMER_PHOTO_READ,MATRIMONY_AGENT_CUSTOMER_PHOTO_DELETE,MATRIMONY_AGENT_CUSTOMER_HOROSCOPE_READ,MATRIMONY_AGENT_CUSTOMER_HOROSCOPE_CREATE,MATRIMONY_AGENT_CUSTOMER_PREFERENCE_UPDATE,MATRIMONY_AGENT_CUSTOMER_ACTIVATE,MATRIMONY_AGENT_CUSTOMER_PENDING_ACTIVATION_LIST,MATRIMONY_FRANCHISE_BIODATA_READ,MATRIMONY_FRANCHISE_BIODATA_UPDATE,MATRIMONY_FRANCHISE_CONSENT_CREATE,MATRIMONY_FRANCHISE_CUSTOMER_LOOKUP_LIST,MATRIMONY_FRANCHISE_PROPOSAL_CREATE,MATRIMONY_FRANCHISE_PROPOSAL_LIST,MATRIMONY_FRANCHISE_PROPOSAL_READ,MATRIMONY_FRANCHISE_PROPOSAL_PHOTO_READ,MATRIMONY_FRANCHISE_PROPOSAL_STEP_CREATE,MATRIMONY_FRANCHISE_PROPOSAL_CONFIRMATION_CREATE,MATRIMONY_FRANCHISE_PROPOSAL_SUCCESS_STORY_CREATE,MATRIMONY_FRANCHISE_FUNNEL_READ,MATRIMONY_FRANCHISE_COMPLAINT_LIST,MATRIMONY_FRANCHISE_COMPLAINT_UPDATE,MATRIMONY_FRANCHISE_AGENT_RATING_LIST,MATRIMONY_AGENT_RATINGS_DIRECTORY_LIST,MATRIMONY_FRANCHISE_CUSTOMER_AGENT_UPDATE,MATRIMONY_FRANCHISE_AGENT_CUSTOMER_REASSIGN_CREATE,MATRIMONY_REASSIGNMENT_AGENT_LIST,MATRIMONY_REASSIGNMENT_CUSTOMER_LIST}
railcab.uam.franchise-access.fixed-role-bases=${UAM_FRANCHISE_ACCESS_FIXED_ROLE_BASES:FRANCHISE_OWNER,FRANCHISE_AGENT}
