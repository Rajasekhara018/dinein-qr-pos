spring.application.name=RealBoom-UAM
server.port=${UAM_PORT:9103}
# No server.servlet.context-path -- the /api/v1/uam prefix now lives on each @RestController
# (see application.properties); setting it here doubled every path to /api/v1/uam/api/v1/uam/**.

spring.mongodb.uri=${UAM_MONGODB_URI:mongodb://localhost:27017/railcab_uam}
spring.mongodb.database=${UAM_MONGODB_DATABASE:railcab_uam}
spring.data.mongodb.auto-index-creation=true

gateway.forward-key=${GATEWAY_FORWARD_KEY:railcab-gateway-forward-secret-change-in-production}

railcab.uam.auth.jwt-secret=${JWT_SECRET:railcab-admin-super-secret-key-change-in-production-min-256bit}
railcab.uam.auth.expiry-minutes=${UAM_JWT_EXPIRY_MINUTES:60}
railcab.uam.auth.issuer=${UAM_JWT_ISSUER:railcab-uam}
railcab.uam.auth.max-failed-attempts=${UAM_AUTH_MAX_FAILED_ATTEMPTS:5}
railcab.uam.auth.lockout-minutes=${UAM_AUTH_LOCKOUT_MINUTES:15}
railcab.uam.otp.expiry-minutes=${UAM_OTP_EXPIRY_MINUTES:5}
railcab.uam.otp.expose-otp=${UAM_OTP_EXPOSE_OTP:false}
railcab.uam.identity-provider.enabled=${UAM_IDENTITY_PROVIDER_ENABLED:false}
railcab.uam.identity-provider.type=${UAM_IDENTITY_PROVIDER:none}
railcab.uam.identity-provider.token-validation=${UAM_IDENTITY_TOKEN_VALIDATION:local}
railcab.uam.identity-provider.unsupported-sync-action=${UAM_IDENTITY_UNSUPPORTED_SYNC_ACTION:fail}
railcab.uam.keycloak.enabled=${UAM_KEYCLOAK_ENABLED:false}
railcab.uam.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
railcab.uam.keycloak.realm=${KEYCLOAK_REALM:railcab}
railcab.uam.keycloak.client-id=${KEYCLOAK_CLIENT_ID:railcab-uam}
railcab.uam.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
railcab.uam.keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:}
railcab.uam.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:}
railcab.uam.oidc.issuer-uri=${OIDC_ISSUER_URI:}
railcab.uam.oidc.token-uri=${OIDC_TOKEN_URI:}
railcab.uam.oidc.logout-uri=${OIDC_LOGOUT_URI:}
railcab.uam.oidc.revocation-uri=${OIDC_REVOCATION_URI:}
railcab.uam.oidc.client-id=${OIDC_CLIENT_ID:}
railcab.uam.oidc.client-secret=${OIDC_CLIENT_SECRET:}
railcab.uam.oidc.scope=${OIDC_SCOPE:openid profile email}
railcab.uam.oidc.audience=${OIDC_AUDIENCE:}
railcab.uam.bootstrap.admin-username=${UAM_BOOTSTRAP_ADMIN_USERNAME:}
railcab.uam.bootstrap.admin-password=${UAM_BOOTSTRAP_ADMIN_PASSWORD:}
railcab.uam.bootstrap.admin-email=${UAM_BOOTSTRAP_ADMIN_EMAIL:}
railcab.uam.bootstrap.admin-phone=${UAM_BOOTSTRAP_ADMIN_PHONE:+916281298823}

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:railcab}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:railcab-uam}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/railcab}}

app.firebase-admin.credentials-path=${FIREBASE_ADMIN_CREDENTIALS_PATH:classpath:firebase-service-account.json}
app.firebase-admin.credentials-base64=${FIREBASE_ADMIN_CREDENTIALS_BASE64:}

# Only health/info/prometheus are exposed: heapdump/env/threaddump/configprops etc. reveal
# secrets (JWT secret, DB passwords, tokens) and a heap dump needs about the heap's size in
# extra memory, enough to get a 512m container OOM-killed. Take dumps from inside the host.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.heapdump.access=none
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
