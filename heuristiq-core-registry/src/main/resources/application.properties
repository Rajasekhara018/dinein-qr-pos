spring.application.name=realboom-service-registry
# Written to a shared repo-root logs/ directory so Promtail (docker-compose.logging.yml) can
# tail it and ship every line to Loki -- centralized logging.
logging.file.name=${LOG_FILE:../logs/service-registry.log}

server.port=${REGISTRY_PORT:9100}

eureka.instance.hostname=${REGISTRY_HOSTNAME:localhost}
eureka.instance.metadata-map.zone=${REGISTRY_ZONE:region1}

# Peer registry URLs. Single-node/dev default points at itself, which is harmless because
# register-with-eureka/fetch-registry default to false below (a lone node never needs to peer
# with itself). defaultZone is Eureka's catch-all bucket -- it works regardless of this node's
# own zone name, so REGISTRY_ZONE doesn't need to be repeated as a property KEY here (Spring
# does not resolve placeholders used as YAML map keys, only as values, which is why this isn't
# written as a per-zone `${REGISTRY_ZONE:...}: <url>` map).
#
# For multi-region: run one registry per region (each with its own REGISTRY_ZONE identity via
# eureka.instance.metadata-map.zone above), and set REGISTRY_PEER_AWARE=true +
# REGISTRY_PEER_URLS to the OTHER regions' registry URLs (comma-separated, e.g.
# http://registry-us:9100/eureka/,http://registry-eu:9100/eureka/). Peer nodes then replicate
# registrations to each other, so a service that registers with its local/regional registry
# becomes visible to clients querying any peer. For true zone-affinity routing (clients
# preferring same-zone instances), add a literal-keyed `availability-zones.<region-name>=
# <zone-name>` override in a per-region profile file -- the zone name has to be a literal
# in that key, not a templated env var, for the same key-resolution reason as above.
eureka.client.service-url.defaultZone=${REGISTRY_PEER_URLS:http://localhost:9100/eureka/}
eureka.client.register-with-eureka=${REGISTRY_PEER_AWARE:false}
eureka.client.fetch-registry=${REGISTRY_PEER_AWARE:false}

# Self-preservation assumes a much larger fleet than this platform runs; the stock threshold
# would keep the registry permanently in self-preservation mode (never evicting stale
# instances) with only a handful of registered services.
eureka.server.renewal-percent-threshold=0.49
# Dead instances are dropped within seconds of missing their renewals: with self-preservation on, the registry keeps
# serving instances that stopped during a deploy, and the gateway keeps routing to them.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=5000
eureka.server.response-cache-auto-expiration-in-seconds=15
server.shutdown=graceful

# Only health/info/prometheus are exposed: heapdump/env/threaddump/configprops etc. reveal
# secrets (JWT secret, DB passwords, tokens) and a heap dump needs about the heap's size in
# extra memory, enough to get a 512m container OOM-killed. Take dumps from inside the host.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.heapdump.access=none
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Distributed tracing (OpenTelemetry via OTLP) -- matches every other backend service. A
# missing/unreachable collector only drops exported spans; it never blocks a request or boot.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
# management.otlp.tracing.endpoint is deprecated at error level since Boot 4.0 (silently does
# nothing) -- management.opentelemetry.tracing.export.otlp.endpoint is the real property name.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics: Prometheus scrape only (/actuator/prometheus) -- OTLP metrics push disabled. Tracing
# still goes over OTLP above; spring-boot-starter-opentelemetry pulls in micrometer-registry-otlp
# and defaults this to true, which was never an intentional metrics path.
management.otlp.metrics.export.enabled=false
# Histogram buckets for http.server.requests -- needed so Prometheus's histogram_quantile() can
# compute p95/p99 latency per endpoint (Grafana golden-signals dashboard/alerts); a plain Timer
# alone only exports count/sum, no distribution.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# HTTP Basic credentials for the whole app (see EurekaSecurityConfig) -- the SAME shared
# username/password every client service embeds in its own eureka.client.service-url.defaultZone.
# Vault-contributed properties (see spring.cloud.vault.* below) take priority; fall back to the
# plain env var so this still works without Vault configured.
spring.security.user.name=${eureka-username:${EUREKA_USERNAME}}
spring.security.user.password=${eureka-password:${EUREKA_PASSWORD}}

# Secrets management (see docs/design/Platform/SecretsManagement.md). Vault connection + config-
# import now live in application-vault.properties, an opt-in profile -- activate with
# --spring.profiles.active=<env>,vault to source secrets from Vault; omit it to use plain env vars
# (e.g. Kubernetes Secrets via secretKeyRef) instead.
# spring.cloud.vault.enabled gates ALL of Spring Cloud Vault's autoconfiguration (config-import,
# health indicator, everything) and defaults to true when absent -- without setting it false here,
# VaultAutoConfiguration still tries to build a VaultTemplate with no host/token configured at all
# and fails hard at startup whenever the vault profile is NOT active. application-vault.properties
# flips this back to true when that profile IS active.
spring.cloud.vault.enabled=false

logging.level.root=INFO
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
# CorrelationIdFilter puts X-Correlation-Id into MDC; this renders it into every log line --
# previously absent, matching DMS/PaymentAPI/NMS's pattern.
logging.pattern.level=%5p [%X{correlationId:-}]
