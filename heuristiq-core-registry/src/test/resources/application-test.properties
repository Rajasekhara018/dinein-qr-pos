# The registry under test does not register with anyone, and no secrets come from the environment.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.security.user.name=registry-test
spring.security.user.password=registry-test-secret
management.opentelemetry.tracing.export.otlp.enabled=false
management.tracing.enabled=false
logging.file.name=build/test-logs/service-registry.log
