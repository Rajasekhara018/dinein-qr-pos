# Local development: seed data, Swagger UI, relaxed cookies (http://localhost).
app.cookies.secure=false
app.security.jwt-secret=${APP_JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
app.security.guest-session-secret=${APP_GUEST_SESSION_SECRET:dev-only-guest-secret-change-me-0123456789}
app.security.bootstrap-owner-password=${BOOTSTRAP_OWNER_PASSWORD:ChangeMe@123}
app.seed.sample-data=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.heuristq.dinein=DEBUG
