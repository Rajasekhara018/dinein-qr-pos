spring.application.name=dinein-backend
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

# --- Database -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dinein}
spring.datasource.username=${DB_USERNAME:dinein}
spring.datasource.password=${DB_PASSWORD:dinein}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Uploads --------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Jackson --------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# --- Actuator -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- OpenAPI (enabled in dev only) ---------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Application ----------------------------------------------------------
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cookies.secure=${APP_COOKIES_SECURE:true}

app.security.jwt-secret=${APP_JWT_SECRET}
app.security.access-token-ttl=PT15M
app.security.refresh-token-ttl=P7D
app.security.device-token-ttl=P30D
app.security.guest-session-secret=${APP_GUEST_SESSION_SECRET}
app.security.guest-session-ttl=PT12H
app.security.max-failed-logins=5
app.security.lockout-duration=PT15M
app.security.bootstrap-owner-username=${BOOTSTRAP_OWNER_USERNAME:owner}
app.security.bootstrap-owner-password=${BOOTSTRAP_OWNER_PASSWORD:}

app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.login.limit=5
app.rate-limit.login.window-seconds=60
app.rate-limit.order.limit=10
app.rate-limit.order.window-seconds=60
app.rate-limit.upload.limit=30
app.rate-limit.upload.window-seconds=60

app.orders.payment-timeout=PT15M
app.orders.expiry-check-interval-ms=60000
app.images.orphan-cleanup-cron=0 30 3 * * *
app.images.orphan-grace=PT24H

# --- Payments: RAZORPAY | PAYU | PINELABS (new payments use this; existing ones keep their provider) ---
app.payments.provider=${PAYMENT_PROVIDER:RAZORPAY}
app.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.payments.payu.key=${PAYU_KEY:}
app.payments.payu.salt=${PAYU_SALT:}
app.payments.payu.base-url=${PAYU_BASE_URL:https://test.payu.in}
app.payments.payu.post-service-url=${PAYU_POST_SERVICE_URL:https://test.info.payu.in/merchant/postservice.php?form=2}
app.payments.payu.default-email=${PAYU_DEFAULT_EMAIL:orders@example.com}
# Pine Labs Online (Plural). Base URL: UAT https://pluraluat.v2.pinepg.in, live https://api.pluralpay.in
app.payments.pinelabs.merchant-id=${PINELABS_MERCHANT_ID:}
app.payments.pinelabs.client-id=${PINELABS_CLIENT_ID:}
app.payments.pinelabs.client-secret=${PINELABS_CLIENT_SECRET:}
app.payments.pinelabs.webhook-secret=${PINELABS_WEBHOOK_SECRET:}
app.payments.pinelabs.base-url=${PINELABS_BASE_URL:https://pluraluat.v2.pinepg.in}
app.payments.pinelabs.webhook-tolerance=${PINELABS_WEBHOOK_TOLERANCE:PT5M}

logging.level.root=INFO
logging.level.com.heuristq.dinein=INFO
logging.pattern.level=%5p [traceId=%X{traceId:-}]

# --- Notifications ---------------------------------------------------------
# Providers: email LOG | SMTP, sms LOG | TWILIO | MSG91, push LOG | FCM. LOG only writes a masked log line.
app.notifications.email.enabled=${NOTIFY_EMAIL_ENABLED:true}
app.notifications.email.provider=${NOTIFY_EMAIL_PROVIDER:LOG}
app.notifications.email.from=${NOTIFY_EMAIL_FROM:}
app.notifications.sms.enabled=${NOTIFY_SMS_ENABLED:true}
app.notifications.sms.provider=${NOTIFY_SMS_PROVIDER:LOG}
app.notifications.sms.default-country-code=${NOTIFY_SMS_DEFAULT_COUNTRY_CODE:91}
app.notifications.push.enabled=${NOTIFY_PUSH_ENABLED:true}
app.notifications.push.provider=${NOTIFY_PUSH_PROVIDER:LOG}
app.notifications.in-app.enabled=${NOTIFY_IN_APP_ENABLED:true}
# SMTP (used only when email provider is SMTP)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
# A mail server outage must not mark the app DOWN.
management.health.mail.enabled=false
# Twilio
app.notifications.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.notifications.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.notifications.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.notifications.sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
# MSG91 (flow template ids per event; template variables: token, orderNumber, table, restaurant)
app.notifications.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
app.notifications.sms.msg91.templates.order-ready=${MSG91_TEMPLATE_ORDER_READY:}
app.notifications.sms.msg91.templates.order-cancelled=${MSG91_TEMPLATE_ORDER_CANCELLED:}
# FCM HTTP v1 (service account JSON is secret; vapid key and web config are public and sent to browsers)
app.notifications.push.fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:}
app.notifications.push.fcm.project-id=${FCM_PROJECT_ID:}
app.notifications.push.fcm.vapid-key=${FCM_VAPID_KEY:}
app.notifications.push.fcm.web-config=${FCM_WEB_CONFIG:}
